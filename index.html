      rij.innerHTML = '<td class="plek"></td><td class="club"></td><td></td>'
                    + '<td class="punten"></td><td></td>';
      const cel = rij.children;
      cel[0].textContent = r.plek;
      cel[1].textContent = r.team;
      cel[2].textContent = r.gespeeld;
      cel[3].textContent = r.punten;
      cel[4].textContent = r.saldo;
      t.append(rij);
    }
    vak.append(t);
    });
  }

  const f = sp.f1 || {};
  if ((f.uitslag || []).length || (f.stand || []).length) {
    groep('Formule 1', f.race || '');
  }
  if ((f.uitslag || []).length) {
    kopje('Uitslagen', 'f1-uitslagen', f.uitslag.length, () => {
    for (const r of f.uitslag) {
      const rij = document.createElement('div');
      rij.className = 'ritrij' + (r.eigen ? ' eigen' : '');
      rij.innerHTML = '<span class="plek"></span><span class="naam"></span>';
      rij.children[0].textContent = r.plek;
      rij.children[1].textContent = r.naam;
      vak.append(rij);
    }
    });
  }

  if ((f.stand || []).length) {
    kopje('Stand', 'f1-stand', f.stand.length, () => {
    for (const r of f.stand) {
      const rij = document.createElement('div');
      rij.className = 'ritrij' + (r.eigen ? ' eigen' : '');
      rij.innerHTML = '<span class="plek"></span><span class="naam"></span>'
                    + '<span class="punten"></span>';
      rij.children[0].textContent = r.plek;
      rij.children[1].textContent = r.naam;
      rij.children[2].textContent = r.punten;
      vak.append(rij);
    }
    });
  }

  if (f.volgende && f.volgende.wanneer) {
    voet('Volgende race: ' + f.volgende.naam + ', ' + f.volgende.wanneer + '.');
  }
  /* De stand loopt achter op de uitslagen -- een wedstrijd van vanmiddag staat
     er 's avonds soms nog niet in. Dat is geen fout van de app, dus zeggen we
     het erbij in plaats van het te verbergen. */
  voet('Standen bijgewerkt om ' + (sp.bijgewerkt || '?')
       + '. Een uitslag van vandaag staat er soms nog niet in.');
  return vak;
}

/* Het looppaneel onder aan het trainingsscherm.
 *
 * Drie dingen onder elkaar, in de volgorde waarin je ze nodig hebt: wat je
 * deze week moet doen, wat je gedaan hebt, en waar dat op uitloopt. De
 * verwachting komt uit zijn eigen rondjes; de ambitie staat eronder en zegt
 * wat het doel vraagt. Het verschil tussen die twee is het hele punt.
 */
function tekenLoop(binnenin) {
  if (vandaag() < LOOPOPBOUW.van) return null;

  const vandaagLoop = trainingVan(vandaag()) === 'lopen';
  const vanVandaag = (st.dagen[vandaag()] || {}).loop || null;
  const dagen = loopDagen(4);
  const vak = el('div');

  /* De lange dag van deze week. Minuten en geen kilometers: je loopt tot de
     klok zegt dat het klaar is, en word je sneller, dan komen er in dezelfde
     tijd vanzelf meer kilometers in. */
  const lang = langeDagVan(loopWeekNr());
  const rust = langeDagVan(loopWeekNr()) === langeDagVan(loopWeekNr() - 1)
               && loopWeekNr() > 0;
  vak.appendChild(el('div', { class: 'regel' }, [
    el('span', { tekst: 'Deze week: lange dag ' }),
    el('b', { tekst: lang + ' minuten' }),
    el('span', { tekst: ' rustig, en je rondje zoals je het doet.'
                        + (rust ? ' Deze week komt er niets bij \u2014 dat is de'
                                + ' pas op de plaats.' : '') }),
  ]));

  if (lang >= LOOPOPBOUW.maxMin) {
    vak.appendChild(el('div', { class: 'kant',
      tekst: 'De lange dag groeit niet verder. Vanaf hier wordt het niet langer '
             + 'maar sneller, op je rondje.' }));
  } else {
    const week = vijfKmWeek();
    if (week) {
      vak.appendChild(el('div', { class: 'kant',
        tekst: dagenTussen(vandaag(), week) <= 7
          ? '5 km aan \u00e9\u00e9n stuk zit er deze week in.'
          : '5 km aan \u00e9\u00e9n stuk komt in zicht rond ' + korteDatum(week)
            + ', op je huidige duurtempo.' }));
    }
  }

  /* Invullen kan op de dag dat je Lopen hebt afgevinkt. Niet elke dag: een
     invulveld dat zes dagen per week niets te doen heeft, is ruis. */
  if (vandaagLoop) {
    if (vanVandaag && !ui.loopOpen) {
      vak.appendChild(el('div', { class: 'regel' }, [
        el('span', { tekst: 'Vandaag: ' }),
        el('b', { tekst: nl(vanVandaag.km) + ' km in ' + nl(vanVandaag.min) + ' min' }),
        el('span', { tekst: ' \u00b7 ' + tempoTekst(tempoVan(vanVandaag)) + ' per km' }),
      ]));
      vak.appendChild(el('button', {
        class: 'schakel', tekst: 'Aanpassen',
        onclick: () => { ui.loopOpen = true; tekenAlles(); },
      }));
    } else {
      const rij = el('div', { class: 'meting' });
      const kmv = el('input', { type: 'number', step: '0.1', inputmode: 'decimal',
                                placeholder: 'km' });
      const mnv = el('input', { type: 'number', step: '0.5', inputmode: 'decimal',
                                placeholder: 'min' });
      if (vanVandaag) { kmv.value = vanVandaag.km; mnv.value = vanVandaag.min; }
      rij.appendChild(el('label', { tekst: 'Afstand' }, [kmv]));
      rij.appendChild(el('label', { tekst: 'Tijd' }, [mnv]));
      rij.appendChild(el('button', {
        class: 'schakel', tekst: 'Bewaren',
        onclick: () => {
          const km = getal(kmv.value), mn = getal(mnv.value);
          if (km == null || mn == null) { zeg('Vul allebei in'); return; }
          dag(vandaag(), true).loop = { km, min: mn };
          ui.loopOpen = false;
          bewaar();
          tekenAlles();
          zeg('Loopje bewaard');
        },
      }));
      vak.appendChild(rij);
    }
  }

  /* De laatste vier, met het tempo erachter. Eén loopje zegt niets; vier op
     een rij laten zien welke kant het op gaat. */
  if (dagen.length) {
    const hist = el('div', { class: 'metinghistorie' });
    for (const d of dagen) {
      const l = st.dagen[d].loop;
      const opRondje = Math.abs(l.km - LOOPDOEL.rondje) <= LOOPDOEL.rondje * 0.1;
      hist.appendChild(el('div', {}, [
        el('span', { tekst: korteDatum(d) + ' \u00b7 ' }),
        el('b', { tekst: nl(l.km) + ' km' }),
        el('span', { tekst: ' in ' + nl(l.min) + ' min \u00b7 ' }),
        el('b', { tekst: tempoTekst(tempoVan(l)) }),
        el('span', { tekst: ' per km' + (opRondje ? ' \u00b7 je rondje' : '') }),
      ]));
    }
    vak.appendChild(hist);
  }

  /* De verwachting, en alleen op het vaste rondje: dezelfde route en dezelfde
     manier van klokken, dus wat er verandert ben jij en niet het parcours.
     Loopjes van wisselende afstand naast elkaar leggen meet vooral de
     afstand. */
  const punten = rondjes().slice().reverse()
    .map(d => [d, tempoVan(st.dagen[d].loop)]);
  const trend = trendPunten(punten, LOOPRUIS, LOOPMAX_PER_WEEK);
  const vooruit = el('div', { class: 'verwachting' });
  vooruit.appendChild(el('div', { class: 'kopje', tekst: 'Waar dit heen gaat' }));

  if (trend) {
    vooruit.appendChild(el('div', {
      tekst: trend.stil
        ? 'Je rondje staat op ' + tempoTekst(trend.basis) + ' per km en beweegt nog niet.'
        : (trend.perWeek < 0 ? '\u2212' : '+')
          + Math.round(Math.abs(trend.perWeek) * 60) + ' seconden per km per week'
          + ' \u00b7 nu ' + tempoTekst(trend.basis) }));
    if (!trend.stil && trend.perWeek < 0) {
      /* Zes weken vooruit en niet verder. Een looptrend is ruiziger dan een
         weegschaal -- wind, slaap en of je net gegeten hebt zitten er allemaal
         in -- en die ruis vermenigvuldigt zich met de afstand. */
      const d = plusDagen(vandaag(), 42);
      vooruit.appendChild(el('div', {}, [
        el('span', { tekst: korteDatum(d) + ' \u00b7 ' }),
        el('b', { tekst: tempoTekst(trend.op(d)) + ' per km op je rondje' }),
      ]));
    }
    if (trend.aantal < 5) {
      vooruit.appendChild(el('div', { class: 'kant',
        tekst: 'Nog maar ' + trend.aantal + ' keer geklokt op dezelfde route. Klok '
               + 'hem eens in de twee \u00e0 drie weken \u2014 vaker meet vooral de wind.' }));
    }
  } else {
    vooruit.appendChild(el('div', { class: 'kant',
      tekst: 'Vanaf je derde rondje van ' + LOOPDOEL.rondje + ' km staat hier wat '
             + 'je tempo doet. Vul je loopjes in, dan rekent hij het uit.' }));
  }

  /* De ambitie. Het verschil tussen 3 en 5 km staat er met opzet bij: 6:00 op
     je rondje is nog geen 6:00 over vijf kilometer, en dat is precies het
     soort detail waar een doel op stukloopt. */
  const nodigRondje = LOOPDOEL.tijd / LOOPDOEL.afstand - LANGER_IS_TRAGER;
  const mijlpaal = LOOPMIJLPALEN.find(([d]) => d >= vandaag());
  const doelblok = el('div', { class: 'ambitie' }, [
    el('div', { tekst: 'Ambitie: ' + LOOPDOEL.afstand + ' km onder de ' + LOOPDOEL.tijd
           + ' minuten, dat is ' + tempoTekst(LOOPDOEL.tijd / LOOPDOEL.afstand)
           + ' per km. Over ' + LOOPDOEL.afstand + ' km loop je zo\u2019n kwart '
           + 'minuut per km rustiger dan over ' + LOOPDOEL.rondje + ', dus je rondje '
           + 'moet richting ' + tempoTekst(nodigRondje) + '.' }),
    mijlpaal ? el('div', { tekst: 'Eerstvolgende mijlpaal: ' + mijlpaal[1] + ', rond '
             + korteDatum(mijlpaal[0]) + '.' }) : null,
  ]);
  vooruit.appendChild(doelblok);
  vak.appendChild(vooruit);

  /* Binnen het blok Lopen hoort er geen tweede kop "Lopen" boven, en geen
     eigen kaartrand om een kaart heen. Dan is het gewoon de inhoud van dat
     blok, met de week erboven. */
  if (binnenin) {
    return el('div', { class: 'loopinhoud' }, [
      el('div', { class: 'bij', tekst: 'week ' + (loopWeekNr() + 1) + ' van de opbouw' }),
      vak,
    ]);
  }
  return paneel('Lopen', 'week ' + (loopWeekNr() + 1) + ' van de opbouw', [vak]);
}

/* ---------- de ambitie naast de verwachting ---------- */

function maandJaar(datum) {
  const d = alsDatum(datum);
  return MAANDEN[d.getMonth()] + ' ' + d.getFullYear();
}

/* Wat het doel per week vraagt, en wanneer je er op je eigen tempo bent.
 *
 * Bewust geen oordeel ("je loopt achter"). Een tempo en een datum kun je iets
 * mee; een cijfer dat zegt dat je het niet haalt, kun je alleen wegklikken.
 * Hetzelfde onderscheid als bij de challenge: "nog 3 te gaan in 4 dagen" is
 * een plan, "3 van 5" is een constatering. */
function ambitieRegel(veld, trend) {
  const doel = AMBITIE[veld];
  if (doel == null || !trend) return '';
  const weken = dagenTussen(vandaag(), AMBITIE.op) / 7;
  if (weken < 2) return '';
  const teGaan = trend.basis - doel;
  const kop = 'Ambitie: ' + nl(doel) + ' ' + EENHEID[veld] + ' op ' + AMBITIE.opWoord;
  if (teGaan <= 0) return kop + ' \u2014 die staat er al.';
  const nodig = teGaan / weken;
  const regel = kop + ' \u2014 dat vraagt ' + nl(nodig) + ' ' + EENHEID[veld] + ' per week. ';
  if (trend.stil || trend.perWeek >= 0) return regel + 'Daar gaat je reeks nu niet heen.';
  const eigen = -trend.perWeek;
  if (eigen >= nodig) return regel + 'Je zit op ' + nl(eigen) + ', dus je loopt voor.';
  const datum = plusDagen(vandaag(), Math.round((teGaan / eigen) * 7));
  return regel + 'Je zit op ' + nl(eigen) + '; op dit tempo wordt het ' + maandJaar(datum) + '.';
}

/* ---------- lopen ---------- */

/* Gert loopt een vast rondje van 3 km om zijn huis en deed daar op 2 november
 * 2026 zo\u2019n 22 minuten over -- net boven zijn praattempo. Het doel is 5 km
 * onder de 30 minuten. Dat is twee kilometer erbij en anderhalve minuut per
 * kilometer eraf, en dat zijn twee projecten.
 *
 * Eerst de afstand, en wel hierom: je komt niet aan 5 km door 3 km harder te
 * lopen, en het tempo zakt onderweg vanzelf mee -- deels door de opbouw,
 * deels doordat er gewicht af gaat. Pas als 5 km staat, gaat er op de andere
 * dag snelheid bij. Nooit allebei in dezelfde week.
 *
 * Opgeslagen als dagen[datum].loop = { km, min }, dus het zit in oprij.v1 en
 * gaat mee in de reservekopie -- net als de training en het spelletje.
 */
const LOOPRUIS = 0.25;          // minuten per km die een dag nu eenmaal scheelt
const LOOPMAX_PER_WEEK = 0.12;  // 7 sec per km per week; sneller houdt niemand maanden vol

/* Over 5 km loop je rustiger dan over 3. Zo\u2019n vijftien seconden per
 * kilometer, en dat verschil is precies groot genoeg om het te noemen:
 * 6:00 over 5 km vraagt ongeveer 5:45 op zijn rondje. */
const LANGER_IS_TRAGER = 0.25;

const LOOPMIJLPALEN = [
  ['2026-12-21', '5 km aan \u00e9\u00e9n stuk, rond de 40 minuten'],
  ['2027-02-01', '5 km onder de 37 minuten'],
  ['2027-04-01', '5 km onder de 33 minuten'],
  ['2027-07-01', '5 km onder de 30 minuten'],
];

function loopDagen(hoeveel) {
  return Object.keys(st.dagen || {})
    .filter(d => st.dagen[d] && st.dagen[d].loop && st.dagen[d].loop.km > 0)
    .sort().reverse().slice(0, hoeveel || 999);
}

function tempoVan(l) { return l && l.km > 0 ? l.min / l.km : null; }

/* 7,33 minuten per kilometer leest niemand; 7:20 wel. */
function tempoTekst(minPerKm) {
  if (minPerKm == null) return '';
  let m = Math.floor(minPerKm);
  let sec = Math.round((minPerKm - m) * 60);
  if (sec === 60) { m++; sec = 0; }
  return m + ':' + String(sec).padStart(2, '0');
}

/* Loopjes op het vaste rondje: dezelfde route, dus onderling te vergelijken.
   Een marge van tien procent, want niemand loopt precies 3,00 km. */
function rondjes(hoeveel) {
  return loopDagen().filter(d => {
    const km = st.dagen[d].loop.km;
    return Math.abs(km - LOOPDOEL.rondje) <= LOOPDOEL.rondje * 0.1;
  }).slice(0, hoeveel || 999);
}

/* Het tempo waarop de lange dag gelopen wordt. Uit een echte lange loop als
   die er is, anders het rondjetempo plus een halve minuut -- want de lange
   dag hoort rustiger te zijn dan het rondje, en zonder dat verschil loopt de
   opbouw vast. */
function duurtempo() {
  const lang = loopDagen().map(d => st.dagen[d].loop)
    .filter(l => l.km >= LOOPDOEL.rondje * 1.15);
  if (lang.length) return tempoVan(lang[0]);
  const r = rondjes(1);
  if (r.length) return tempoVan(st.dagen[r[0]].loop) + 0.5;
  return 8;
}

function loopWeekNr() {
  return Math.max(0, Math.floor(dagenTussen(LOOPOPBOUW.van, maandagVan(vandaag())) / 7));
}

/* De lange dag van week n. Elke vierde week komt er niets bij: een week
   waarin je niet méér vraagt is wat een opbouw heel houdt. */
function langeDagVan(n) {
  const stappen = n - Math.floor(n / 4);
  return Math.min(LOOPOPBOUW.maxMin, LOOPOPBOUW.startMin + stappen * LOOPOPBOUW.perWeek);
}

/* De week waarin die lange dag lang genoeg is voor vijf kilometer. Dat is
   rekenwerk en geen voorspelling: de minuten liggen vast, het tempo komt uit
   zijn eigen loopjes. */
function vijfKmWeek() {
  const nodig = LOOPDOEL.afstand * duurtempo();
  const nu = loopWeekNr();
  for (let n = nu; n < nu + 60; n++) {
    if (langeDagVan(n) >= nodig) return plusDagen(maandagVan(vandaag()), (n - nu) * 7);
    if (langeDagVan(n) >= LOOPOPBOUW.maxMin) return null;
  }
  return null;
}

/* ---------- hulpjes voor het tekenen ---------- */

function el(tag, opties, kinderen) {
  const n = document.createElement(tag);
  if (opties) for (const k in opties) {
    if (k === 'class') n.className = opties[k];
    else if (k === 'tekst') n.textContent = opties[k];
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), opties[k]);
    else if (opties[k] !== null && opties[k] !== false) n.setAttribute(k, opties[k]);
  }
  if (kinderen) for (const kind of [].concat(kinderen)) if (kind) n.appendChild(kind);
  return n;
}

let meldingKlok = null;
function zeg(tekst) {
  const m = document.getElementById('melding');
  m.textContent = tekst;
  m.classList.add('aan');
  clearTimeout(meldingKlok);
  meldingKlok = setTimeout(() => m.classList.remove('aan'), 1900);
}

function paneel(titel, bij, inhoud) {
  const kop = el('div', { class: 'kop' }, [
    el('h2', { tekst: titel }),
    bij ? el('div', { class: 'bij', tekst: bij }) : null,
  ]);
  return el('section', { class: 'panel' }, [kop, el('div', { class: 'body' }, inhoud)]);
}

/* Bolletjes voor één gewoonte in één week. Nooit rood: wat niet gebeurd is,
   is grijs, en een overschrijding is warm geel — geen alarm. */
function stippenRij(aantal, doel, soort) {
  const rij = el('div', { class: 'stippen' });
  if (soort === 'min') {
    for (let i = 0; i < doel; i++) rij.appendChild(el('div', { class: 'stip' + (i < aantal ? ' vol' : '') }));
    for (let i = doel; i < aantal; i++) rij.appendChild(el('div', { class: 'stip extra' }));
  } else {
    for (let i = 0; i < doel; i++) rij.appendChild(el('div', { class: 'stip' + (i < aantal ? ' let' : '') }));
    for (let i = doel; i < aantal; i++) rij.appendChild(el('div', { class: 'stip let' }));
  }
  return rij;
}

function tellingTekst(aantal, doel, soort) {
  if (soort === 'min') {
    return { tekst: aantal + ' van ' + doel + (aantal >= doel ? ' · gehaald' : ''), klasse: aantal >= doel ? 'gehaald' : '' };
  }
  if (aantal === 0) return { tekst: 'geen', klasse: 'gehaald' };
  if (aantal <= doel) return { tekst: aantal + ' van hoogstens ' + doel, klasse: '' };
  return { tekst: aantal + '× · hoogstens ' + doel, klasse: 'let' };
}

/* ===================================================================
   Tabblad Vandaag
   =================================================================== */

/* Een korte naam uit een lange kop. Een dossier heet "Artikel 31" en niet
   "Begrotingsonderdeel Artikel 31 Politie (i.v.m. wijziging aanvangs- en
   eindtijdstip)"; de volledige kop staat toch in de tijdlijn. */
function kortNaam(titel) {
  const t = (titel || '').replace(/\s+/g, ' ').trim();
  if (t.length <= 42) return t;
  return t.slice(0, 42).replace(/\s+\S*$/, '') + '\u2026';
}

/* Het blok Dossiers: onderwerpen die je volgt.

   Standaard dicht en met dezelfde knop als de nieuwsblokken -- Gert vroeg op
   3 november 2026 of Duiding, Bewaard en Dossiers zich net zo willen gedragen
   als de rest. Dat is ook de juiste keuze: die drie stonden open omdat ze
   "van jou" zijn, maar dan is het eerste wat je ziet bij het openen van de
   briefing niet het nieuws maar je eigen lijstjes.

   Het blok staat er ook als je nog geen dossiers hebt, want anders is er geen
   plek om er een te beginnen. */
function tekenDossiers() {
  const vak = el('section', { class: 'blok' });
  const open = !!ui.blokOpen.dossiers;
  vak.dataset.open = open ? '1' : '0';

  const treffers = {};
  let nieuw = 0;
  for (const d of st.dossiers) {
    treffers[d.id] = dossierTreffers(d);
    if (treffers[d.id].some(isNieuw)) nieuw++;
  }

  const knop = el('button');
  knop.dataset.sleutel = 'blok:dossiers';
  knop.style.borderLeftColor = 'var(--teal)';
  knop.innerHTML = '<span>\u{1F5C2}</span>' +
    '<span class="naam">Dossiers</span>' +
    '<span class="aantal">' + (st.dossiers.length || '') + '</span>' +
    (nieuw ? '<span class="nieuwtje">' + nieuw + ' nieuw</span>' : '') +
    '<span class="pijl">&#9656;</span>';
  knop.addEventListener('click', () => {
    ui.blokOpen.dossiers = !open;
    herteken(tekenBriefing, 'blok:dossiers');
  });
  vak.append(knop);
  if (!open) return vak;

  const inhoud = el('div', { class: 'inhoud' });

  for (const dos of st.dossiers) {
    const draad = treffers[dos.id];
    const vers = draad.filter(isNieuw);

    const rij = el('div', { class: 'berichtrij' + (vers.length ? ' nieuw' : '') });
    const sinds = draad.length
      ? draad.flatMap(x => [...(x.dagen || [])]).filter(Boolean).sort()[0] : '';
    const meta = [
      draad.length ? draad.length + (draad.length === 1 ? ' bericht' : ' berichten') +
        (sinds ? ' sinds ' + korteDatum(sinds) : '') : 'nog niets gevonden',
      (dos.termen || []).length ? dos.termen.join(', ') : '',
    ].filter(Boolean).join(' \u00b7 ');
    rij.append(el('div', { class: 'bericht' }, [
      el('span', { class: 'titel', tekst: dos.naam }),
      el('span', { class: 'meta', tekst: meta }),
    ]));
    rij.append(el('button', {
      type: 'button', class: 'volgknop', title: 'Dossier aanpassen',
      'aria-label': 'Dossier aanpassen', tekst: '\u270e',
      onclick: () => {
        ui.dossierBewerk = ui.dossierBewerk === dos.id ? null : dos.id;
        herteken(tekenBriefing, 'blok:dossiers');
      },
    }));
    inhoud.append(rij);

    if (ui.dossierBewerk === dos.id) inhoud.append(dossierFormulier(dos));

    /* Hoogstens zes regels: dit is een overzicht en geen tweede nieuwsblok. */
    if (draad.length) {
      const tl = el('div', { class: 'tijdlijn' });
      for (const x of draad.slice(0, 6)) {
        const a = el(x.link ? 'a' : 'span', x.link
          ? { href: x.link, target: '_blank', rel: 'noopener' } : null);
        if (isNieuw(x)) a.className = 'vers';
        a.textContent = korteDatum(x.datum) + ' \u00b7 ' + x.titel +
          (x.dagen && x.dagen.size > 1 ? ' (' + x.dagen.size + ' dagen)' : '');
        tl.append(a);
      }
      if (draad.length > 6) {
        tl.append(el('span', { class: 'ouder',
                               tekst: '+ ' + (draad.length - 6) + ' ouder' }));
      }
      inhoud.append(tl);
    }
  }

  if (ui.dossierBewerk === 'nieuw') {
    inhoud.append(dossierFormulier(null));
  } else {
    inhoud.append(el('div', { class: 'dossiervoet' }, [
      el('button', {
        type: 'button', class: 'knopje', tekst: '+ Nieuw dossier',
        onclick: () => {
          ui.dossierBewerk = 'nieuw';
          herteken(tekenBriefing, 'blok:dossiers');
        },
      }),
    ]));
  }

  vak.append(inhoud);
  return vak;
}

/* Het invulformulier voor één dossier, of voor een nieuw als `dos` null is.

   Termen gescheiden door komma's, want dat is wat je zonder uitleg doet. Ze
   worden letterlijk gezocht in de kop en de omschrijving, met woordgrenzen --
   dus "Jos" vindt niet "Josephine". */
function dossierFormulier(dos) {
  const naam = el('input', { type: 'text', placeholder: 'Naam van het dossier',
                             value: dos ? dos.naam : '', enterkeyhint: 'done',
                             autocapitalize: 'sentences' });
  const termen = el('input', { type: 'text', value: dos ? (dos.termen || []).join(', ') : '',
                               placeholder: 'Termen, met komma\'s ertussen',
                               enterkeyhint: 'done' });

  const opslaan = () => {
    const n = naam.value.trim();
    if (!n) { zeg('Geef het dossier een naam'); naam.focus(); return; }
    if (dos) {
      dos.naam = n;
      dos.termen = termenUit(termen.value);
    } else {
      st.dossiers.unshift({ id: dossierId(), naam: n,
                            termen: termenUit(termen.value), zaad: null,
                            op: vandaag() });
    }
    bewaar();
    ui.dossierBewerk = null;
    zeg(dos ? 'Dossier bijgewerkt' : 'Dossier aangemaakt');
    herteken(tekenBriefing, 'blok:dossiers');
  };
  naam.addEventListener('keydown', (e) => { if (e.key === 'Enter') opslaan(); });
  termen.addEventListener('keydown', (e) => { if (e.key === 'Enter') opslaan(); });

  const knoppen = [
    el('button', { type: 'button', class: 'knopje aan', tekst: 'Bewaren',
                   onclick: opslaan }),
    el('button', { type: 'button', class: 'knopje', tekst: 'Annuleren',
                   onclick: () => {
                     ui.dossierBewerk = null;
                     herteken(tekenBriefing, 'blok:dossiers');
                   } }),
  ];
  if (dos) {
    knoppen.push(el('button', {
      type: 'button', class: 'knopje weg', tekst: 'Verwijderen',
      onclick: () => {
        st.dossiers = st.dossiers.filter(x => x.id !== dos.id);
        bewaar();
        ui.dossierBewerk = null;
        zeg('Dossier verwijderd');
        herteken(tekenBriefing, 'blok:dossiers');
      },
    }));
  }

  return el('div', { class: 'dossierform' }, [
    naam, termen,
    dos && dos.zaad
      ? el('p', { class: 'uitleg',
                  tekst: 'Ontstaan uit: ' + dos.zaad.titel })
      : null,
    el('p', { class: 'uitleg', tekst: 'Termen worden letterlijk gezocht in de '
      + 'kop en de omschrijving. Laat ze leeg bij een dossier uit een bericht, '
      + 'dan zoekt hij op gelijkenis met die kop.' }),
    el('div', { class: 'formknoppen' }, knoppen),
  ]);
}


/* Twee regels die de briefing en Gerts eigen gegevens naast elkaar leggen.
   Dat gebeurde nergens: de app wist veel van de wereld en weinig van hem, en
   alles stond al in dezelfde browser -- het werd alleen nooit gecombineerd.

   Er gaat niets de deur uit. Dit is rekenwerk op `st.dagen` (zijn gegevens,
   localStorage) en op het weerblok van de briefing die er toch al is. De
   taken en metingen blijven waar ze horen.

   Levert dit niets op, dan is er geen paneel. Een vak met een plichtmatige
   zin erin is erger dan geen vak -- dezelfde regel als overal hier. */
function slimmeRegels() {
  const uit = [];

  /* Vooruit: wat staat er vandaag op de rol, en wat doet het weer daarmee.
     Alleen bij een loopdag, want voor kracht in de schuur maakt regen niets
     uit en dan is het een weerbericht zonder reden. */
  const voorstel = (typeof voorstelVandaag === 'function') ? voorstelVandaag() : null;
  const weerblok = ((briefing && briefing.blokken) || []).find(b => b.id === 'weer');
  const dal = weerblok && weerblok.weer && weerblok.weer.dalfsen;
  if (voorstel && voorstel.id === 'lopen' && dal) {
    const graden = (dal.min != null && dal.max != null)
      ? dal.min + ' tot ' + dal.max + ' graden' : '';
    let regel;
    if (dal.regenkans != null && dal.regenkans >= 60) {
      regel = 'Je loopt vandaag, maar er staat ' + dal.regenkans +
        '% kans op neerslag — de crosstrainer telt als dezelfde dag.';
    } else if (dal.regenkans != null && dal.regenkans < 10) {
      regel = 'Je loopt vandaag, en het blijft droog' +
        (graden ? ' — ' + graden : '') + '.';
    } else {
      regel = 'Je loopt vandaag' +
        (dal.regenkans != null ? ' — ' + dal.regenkans + '% kans op neerslag' : '') +
        (graden ? ', ' + graden : '') + '.';
    }
    uit.push(regel);
  }

  /* Terug: het laatste rondje, afgezet tegen de keer ervoor. Alleen van
     vandaag of gisteren -- een loopje van vorige week is geen nieuws meer, en
     de reeks staat toch al op het trainingsscherm. */
  const r = (typeof rondjes === 'function') ? rondjes(2) : [];
  if (r.length) {
    const gisteren = sleutelVan(new Date(Date.now() - 864e5));
    if (r[0] === vandaag() || r[0] === gisteren) {
      const wanneer = r[0] === vandaag() ? 'van vandaag' : 'van gisteren';
      const nu = st.dagen[r[0]].loop;
      const tijd = tempoTekst(nu.min);
      /* Het snelst tot nu toe gaat op tempo en niet op de kale tijd: het
         rondje mag tien procent schelen, en dan wint een korter rondje
         vanzelf. */
      const mijnTempo = tempoVan(nu);
      const eerdere = rondjes().slice(1).map(d => tempoVan(st.dagen[d].loop))
        .filter(t => t != null);
      if (eerdere.length && mijnTempo != null && mijnTempo < Math.min(...eerdere)) {
        uit.push('Je rondje ' + wanneer + ' was ' + tijd + ' — je snelste tot nu toe.');
      } else if (r.length > 1) {
        const vorige = st.dagen[r[1]].loop;
        const sec = Math.round((vorige.min - nu.min) * 60);
        if (Math.abs(sec) >= 10) {
          uit.push('Je rondje ' + wanneer + ' was ' + tijd + ', ' +
            Math.abs(sec) + ' seconden ' + (sec > 0 ? 'sneller' : 'trager') +
            ' dan de keer ervoor.');
        } else {
          uit.push('Je rondje ' + wanneer + ' was ' + tijd + ', vrijwel gelijk aan de vorige.');
        }
      } else {
        uit.push('Je rondje ' + wanneer + ' was ' + tijd + ' — de eerste in de reeks.');
      }
    }
  }
  return uit;
}


function tekenVandaag() {
  const doel = document.getElementById('tab-vandaag');
  doel.textContent = '';
  const nu = vandaag();
  const d = dag(nu);

  const slim = slimmeRegels();
  if (slim.length) {
    doel.appendChild(el('div', { class: 'slim' },
      slim.map(t => el('p', { tekst: t }))));
  }

  /* --- de vinkjes van vandaag --- */
  const tegels = el('div', { class: 'tegels' });
  for (const g of GEWOONTES.filter(x => x.tegel)) {
    tegels.appendChild(el('button', {
      class: 'tegel',
      'aria-pressed': d[g.id] ? 'true' : 'false',
      onclick: () => {
        const r = dag(nu, true);
        r[g.id] = !r[g.id];
        bewaar();
        tekenVandaag();
      },
    }, [el('span', { class: 'bol' }), el('span', { tekst: g.kort })]));
  }

  const etenKeuze = el('div', { class: 'keuze' });
  /* "Wel zoogdier" is er op 1 november 2026 uit; dat eet Gert niet meer. De
     twee die overblijven zijn allebei iets om te kiezen in plaats van iets om
     te bekennen, en daarmee is het rode knopje ook niet meer nodig. */
  const etenOpties = [
    { id: 'veg',  naam: 'Vegetarisch' },
    { id: 'geen', naam: 'Geen zoogdier' },
  ];
  for (const o of etenOpties) {
    etenKeuze.appendChild(el('button', {
      'aria-pressed': d.eten === o.id ? 'true' : 'false',
      tekst: o.naam,
      onclick: () => {
        const r = dag(nu, true);
        r.eten = (r.eten === o.id) ? null : o.id;
        bewaar();
        tekenVandaag();
      },
    }));
  }

  /* Moet de bak vandaag of morgen aan de weg, dan staat dat bovenaan: dat is
     het enige op dit scherm met een deadline die vanavond afloopt. Anders
     hangt het onderaan bij de taken, waar het hoort. */
  const afvalkaart = tekenAfval();
  const afvalDringt = afvalkaart && afvalkaart.dataset.dringt === '1';
  if (afvalDringt) doel.appendChild(afvalkaart);

  /* De challenge bovenaan zolang hij loopt: dat is deze maand het eerste wat je
     wilt zien. Buiten november geeft dit niets terug en is het scherm als altijd. */
  const uitdaging = tekenUitdaging();
  if (uitdaging) doel.appendChild(uitdaging);

  const meting = tekenMeting();
  if (meting) doel.appendChild(meting);

  doel.appendChild(paneel('Vandaag', langeDatum(nu), [
    tegels,
    el('div', { class: 'rij-titel', tekst: 'Gegeten' }),
    etenKeuze,
  ]));

  /* --- hoe de week ervoor staat --- */
  const maandag = maandagVan(nu);
  const lijst = el('ul', { class: 'week' });
  for (const g of GEWOONTES) {
    const aantal = telWeek(maandag, g);
    const dl = doelVan(g);
    const t = tellingTekst(aantal, dl, g.soort);
    lijst.appendChild(el('li', null, [
      el('div', { class: 'naam', tekst: g.naam }),
      stippenRij(aantal, dl, g.soort),
      el('div', { class: 'telling ' + t.klasse, tekst: t.tekst }),
    ]));
  }
  doel.appendChild(tekenSmoothies());

  doel.appendChild(paneel('Deze week', 'week ' + weekVan(nu).split('-W')[1], [lijst]));

  if (afvalkaart && !afvalDringt) doel.appendChild(afvalkaart);

  /* --- de taken --- */
  doel.appendChild(tekenTaken());
}

/* ---------- smoothies ---------------------------------------------------
   Dezelfde rijen als bij de oefeningen: een naam met een pijltje, en de
   ingrediënten verschijnen pas als je erop tikt. Dichtgevouwen zijn het drie
   regels, en dat is precies wat je 's ochtends nodig hebt — kiezen, niet lezen. */
function tekenSmoothies() {
  const lijst = el('div', { class: 'inhoud' });

  SMOOTHIES.forEach(([naam, kort, spul, tip], n) => {
    const sleutel = 'sm-' + n;
    const open = !!ui.smoothieOpen[sleutel];
    const o = el('div', { class: 'oef' + (open ? ' open' : '') });

    const bovenkant = document.createElement('button');
    bovenkant.className = 'oef-top';
    bovenkant.innerHTML =
      '<span class="picto"><svg viewBox="0 0 60 60" fill="none" stroke="currentColor" ' +
        'stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
        PICTO['Smoothie'] + '</svg></span>' +
      '<span class="oef-mid"><span class="oef-naam">' + naam + '</span>' +
        '<span class="oef-kit">' + kort + '</span></span>' +
      '<span class="pijl">&#9656;</span>';
    bovenkant.dataset.sleutel = 'sm:' + sleutel;
    bovenkant.addEventListener('click', () => {
      ui.smoothieOpen[sleutel] = !open;
      herteken(tekenVandaag, 'sm:' + sleutel);
    });
    o.append(bovenkant);

    if (open) {
      const body = el('div', { class: 'oef-body' });
      body.innerHTML = '<p>' + spul.join('<br>') + '</p><p class="cue">' + tip + '</p>';
      o.append(body);
    }
    lijst.append(o);
  });

  /* Hier stond uitleg over de volle schep eiwitpoeder. Die is eruit op Gerts
     verzoek: het staat in elk recept zelf, en een tekst die je elke ochtend
     opnieuw voorbij ziet komen terwijl je hem al kent, is ruis. */
  return paneel('Smoothie', 'vier varianten', [lijst]);
}

/* ---------- afvalkalender ----------------------------------------------
   De ophaaldagen komen uit de briefing, want rechtstreeks uit de browser kan
   niet: ROVA stuurt geen CORS-headers. De Mac haalt ze elke ronde op en zet ze
   in briefing.json; hier worden ze alleen getoond.

   Geen taak met een vinkje. Een taak die je elke week opnieuw krijgt en elke
   week moet afvinken is werk erbij, en wat er écht toe doet is de avond
   ervóór: dan moet de bak aan de weg. Vandaar één regel die zegt wat er aan de
   beurt is, en een lijstje met de weken erna. */
function dagenTot(datum) {
  return Math.round((alsDatum(datum) - alsDatum(vandaag())) / 86400000);
}

function tekenAfval() {
  const rij = (briefing && briefing.afval || [])
    .filter(a => dagenTot(a.datum) >= 0)
    .slice(0, 5);
  if (!rij.length) return null;

  const eerst = rij[0];
  const n = dagenTot(eerst.datum);
  const kop = n === 0 ? eerst.naam + ' wordt vandaag opgehaald'
            : n === 1 ? eerst.naam + ' wordt morgen opgehaald'
            : eerst.naam + ' — ' + langeDatum(eerst.datum);
  const bij = (n === 0 ? 'Staat hij buiten?'
             : n === 1 ? 'Vanavond aan de weg zetten.'
             : 'Nog ' + n + ' dagen.')
            /* Een verzette ophaaldag is juist het ding dat je over het hoofd
               ziet: rond de feestdagen schuift ROVA een dag op. */
            + (eerst.afwijkend ? ' Let op: verzette dag.' : '');

  const lijst = el('ul', { class: 'afval-lijst' });
  for (const a of rij.slice(1, 4)) {
    lijst.appendChild(el('li', null, [
      el('span', { tekst: a.naam + (a.afwijkend ? ' (verzette dag)' : '') }),
      el('span', { class: 'wanneer', tekst: langeDatum(a.datum) }),
    ]));
  }

  const kaart = paneel('Aan de weg', 'ROVA', [
    el('div', { class: 'afval-nu' + (n <= 1 ? ' straks' : ''), tekst: kop }),
    el('div', { class: 'afval-bij', tekst: bij }),
    lijst,
  ]);
  /* tekenVandaag() leest dit af om te bepalen of de kaart bovenaan hoort. */
  kaart.dataset.dringt = n <= 1 ? '1' : '0';
  return kaart;
}

function tekenTaken() {
  const nu = vandaag();
  const invoer = el('input', { type: 'text', placeholder: 'Wat moet er gebeuren?', enterkeyhint: 'done', autocapitalize: 'sentences' });
  const voegToe = () => {
    const tekst = invoer.value.trim();
    if (!tekst) return;
    st.taken.push({ id: nieuwId(), tekst, label: ui.label, gemaakt: nu, voor: nu, klaar: null, verschoven: 0 });
    bewaar();
    invoer.value = '';
    tekenVandaag();
    // het veld houdt de aandacht, zodat je er vijf achter elkaar in kunt tikken
    const nieuw = document.querySelector('#tab-vandaag .invoer input');
    if (nieuw) nieuw.focus();
  };
  invoer.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); voegToe(); } });

  /* Etiket voor wat je nu intikt. Blijft staan, zodat je vijf telefoontjes
     achter elkaar kunt invoeren zonder telkens opnieuw te kiezen. */
  const chips = el('div', { class: 'chips' }, [el('span', { class: 'chips-kop', tekst: 'Etiket' })]);
  for (const l of LABELS) {
    chips.appendChild(el('button', {
      class: 'chip',
      'aria-pressed': ui.label === l.id ? 'true' : 'false',
      tekst: l.naam,
      onclick: () => { ui.label = ui.label === l.id ? null : l.id; tekenVandaag(); },
    }));
  }

  const open = takenVoorVandaag();
  const zichtbaar = ui.filter ? open.filter(t => t.label === ui.filter) : open;

  const lijst = el('ul', { class: 'taken' });
  if (!open.length) {
    lijst.appendChild(el('li', null, [el('div', { class: 'leeg', tekst: 'Niks meer voor vandaag.' })]));
  } else if (!zichtbaar.length) {
    lijst.appendChild(el('li', null, [el('div', { class: 'leeg', tekst: 'Niks met dit etiket.' })]));
  } else {
    for (const t of zichtbaar) lijst.appendChild(taakRegel(t));
  }

  const onderdelen = [el('div', { class: 'invoer' }, [invoer, el('button', { tekst: 'Zet erbij', onclick: voegToe })]), chips, lijst];

  /* filterknoppen alleen tonen als er iets te filteren valt */
  const gebruikt = LABELS.filter(l => open.some(t => t.label === l.id));
  if (gebruikt.length > 1) {
    const filters = el('div', { class: 'chips', style: 'margin-top:10px' }, [el('span', { class: 'chips-kop', tekst: 'Toon' })]);
    filters.appendChild(el('button', {
      class: 'chip', 'aria-pressed': ui.filter === null ? 'true' : 'false', tekst: 'Alles',
      onclick: () => { ui.filter = null; tekenVandaag(); },
    }));
    for (const l of gebruikt) {
      filters.appendChild(el('button', {
        class: 'chip', 'aria-pressed': ui.filter === l.id ? 'true' : 'false', tekst: l.naam,
        onclick: () => { ui.filter = ui.filter === l.id ? null : l.id; tekenVandaag(); },
      }));
    }
    onderdelen.splice(2, 0, filters);
  }

  const later = takenVoorLater();
  if (later.length) {
    onderdelen.push(el('button', {
      class: 'vouw',
      tekst: (ui.toonLater ? '▾ ' : '▸ ') + later.length + ' voor later',
      onclick: () => { ui.toonLater = !ui.toonLater; tekenVandaag(); },
    }));
    if (ui.toonLater) {
      const l2 = el('ul', { class: 'taken' });
      for (const t of later) l2.appendChild(taakRegel(t, true));
      onderdelen.push(l2);
    }
  }

  const af = takenAfVandaag();
  if (af.length) {
    onderdelen.push(el('button', {
      class: 'vouw',
      tekst: (ui.toonGedaan ? '▾ ' : '▸ ') + af.length + ' vandaag gedaan',
      onclick: () => { ui.toonGedaan = !ui.toonGedaan; tekenVandaag(); },
    }));
    if (ui.toonGedaan) {
      const l3 = el('ul', { class: 'taken' });
      for (const t of af) l3.appendChild(taakRegel(t));
      onderdelen.push(l3);
    }
  }

  return paneel('Taken', open.length ? open.length + ' open' : '', onderdelen);
}

function taakRegel(t, toonDatum) {
  if (ui.bewerkt === t.id) return bewerkRegel(t);

  const naam = LABELS.find(l => l.id === t.label);
  const meta = el('div', { class: 'meta' });
  if (naam) meta.appendChild(el('span', { class: 'label', tekst: naam.naam }));
  if (toonDatum) meta.appendChild(el('span', { class: 'zacht', tekst: korteDatum(t.voor) }));
  if ((t.verschoven || 0) >= 3 && !t.klaar) meta.appendChild(el('span', { class: 'zacht', tekst: t.verschoven + '× doorgeschoven' }));

  const acties = el('div', { class: 'acties' });
  if (!t.klaar) {
    acties.appendChild(el('button', {
      title: 'Naar morgen', 'aria-label': 'Naar morgen', tekst: '→',
      onclick: () => { t.voor = plusDagen(vandaag(), 1); bewaar(); tekenVandaag(); zeg('Naar morgen'); },
    }));
  }
  acties.appendChild(el('button', {
    title: 'Weghalen', 'aria-label': 'Weghalen', tekst: '×',
    onclick: () => { st.taken = st.taken.filter(x => x.id !== t.id); bewaar(); tekenVandaag(); },
  }));

  return el('li', { class: t.klaar ? 'af' : '' }, [
    el('button', {
      class: 'vink', 'aria-pressed': t.klaar ? 'true' : 'false', 'aria-label': 'Afvinken',
      onclick: () => {
        t.klaar = t.klaar ? null : vandaag();
        if (!t.klaar) t.voor = vandaag();
        bewaar();
        tekenVandaag();
      },
    }),
    el('div', { class: 'inhoud' }, [
      el('button', { class: 'tekst', tekst: t.tekst, onclick: () => { ui.bewerkt = t.id; tekenVandaag(); } }),
      meta.childNodes.length ? meta : null,
    ]),
    acties,
  ]);
}

function bewerkRegel(t) {
  const veld = el('input', { type: 'text', value: t.tekst, enterkeyhint: 'done' });
  const chips = el('div', { class: 'chips' });
  let gekozen = t.label;
  const tekenChips = () => {
    chips.textContent = '';
    for (const l of LABELS) {
      chips.appendChild(el('button', {
        class: 'chip', 'aria-pressed': gekozen === l.id ? 'true' : 'false', tekst: l.naam,
        onclick: () => { gekozen = gekozen === l.id ? null : l.id; tekenChips(); },
      }));
    }
  };
  tekenChips();

  const opslaan = () => {
    const tekst = veld.value.trim();
    if (tekst) t.tekst = tekst;
    t.label = gekozen;
    ui.bewerkt = null;
    bewaar();
    tekenVandaag();
  };
  veld.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); opslaan(); } });

  const regel = el('li', null, [el('div', { class: 'inhoud bewerk' }, [
    veld, chips,
    el('div', { class: 'knoppen' }, [
      el('button', { class: 'btn primair', tekst: 'Klaar', onclick: opslaan }),
      el('button', { class: 'btn', tekst: 'Laat maar', onclick: () => { ui.bewerkt = null; tekenVandaag(); } }),
    ]),
  ])]);
  setTimeout(() => { veld.focus(); veld.select(); }, 0);
  return regel;
}

/* ===================================================================
   Tabblad Terugblik
   =================================================================== */

function wekenMetGegevens(hoeveel) {
  const uit = [];
  let maandag = maandagVan(vandaag());
  for (let i = 0; i < hoeveel; i++) {
    uit.push(maandag);
    maandag = plusDagen(maandag, -7);
  }
  return uit;
}

function telBlok(maandagen, gewoonte) {
  let n = 0;
  for (const m of maandagen) n += telWeek(m, gewoonte);
  return n;
}

function heeftIets(maandag) {
  for (const datum of weekDagen(maandag)) {
    const d = st.dagen[datum];
    /* `d.alcohol` staat er nog in, al wordt het niet meer bijgehouden: anders
       zou een week uit het archief waarin alleen dat stond opeens als lege week
       gelden en uit de terugblik vallen. */
    if (d && (d.eten || d.sport || d.wandeling || d.mindful || d.smoothie || d.alcohol)) return true;
    if (st.taken.some(t => t.klaar === datum)) return true;
  }
  return false;
}

function tekenTerugblik() {
  const doel = document.getElementById('tab-terugblik');
  doel.textContent = '';

  const alle = wekenMetGegevens(ui.weken + 4);
  const recent = alle.slice(0, 4);
  const ervoor = alle.slice(4, 8);
  const erIetsDavoor = ervoor.some(heeftIets);

  /* --- vier weken tegen de vier daarvoor --- */
  if (erIetsDavoor) {
    const rijen = [];
    for (const g of GEWOONTES) {
      const nu = telBlok(recent, g);
      const toen = telBlok(ervoor, g);
      const verschil = nu - toen;
      /* omhoog is goed bij een minimum, omlaag is goed bij een maximum */
      const goed = g.soort === 'min' ? verschil > 0 : verschil < 0;
      const pijl = verschil === 0 ? 'gelijk' : (verschil > 0 ? '+' : '−') + Math.abs(verschil);
      rijen.push(el('div', { class: 'vgl' }, [
        el('div', { class: 'naam', tekst: g.naam }),
        el('div', { class: 'cijfer', tekst: nu + '×' }),
        el('div', { class: 'pijl' + (goed ? ' op' : ''), tekst: 'was ' + toen + '× · ' + pijl }),
      ]));
    }
    doel.appendChild(paneel('Laatste vier weken', 'tegen de vier daarvoor', rijen));
  }

  /* --- week voor week --- */
  const kaarten = [];
  let getoond = 0;
  for (const maandag of alle.slice(0, ui.weken)) {
    const isNu = maandag === maandagVan(vandaag());
    if (!isNu && !heeftIets(maandag)) continue;
    getoond++;
    const lijst = el('ul', { class: 'week' });
    for (const g of GEWOONTES) {
      const aantal = telWeek(maandag, g);
      const dl = doelVan(g);
      const t = tellingTekst(aantal, dl, g.soort);
      lijst.appendChild(el('li', null, [
        el('div', { class: 'naam', tekst: g.naam }),
        stippenRij(aantal, dl, g.soort),
        el('div', { class: 'telling ' + t.klasse, tekst: t.tekst }),
      ]));
    }
    const afgevinkt = st.taken.filter(t => t.klaar && weekDagen(maandag).includes(t.klaar)).length;
    kaarten.push(el('div', { style: 'margin-bottom:16px' }, [
      el('div', { class: 'weekkop' }, [
        el('b', { tekst: isNu ? 'Deze week' : 'Week ' + weekVan(maandag).split('-W')[1] }),
        el('span', { tekst: korteDatum(maandag) + ' – ' + korteDatum(plusDagen(maandag, 6)) + (afgevinkt ? ' · ' + afgevinkt + (afgevinkt === 1 ? ' taak' : ' taken') + ' gedaan' : '') }),
      ]),
      lijst,
    ]));
  }

  if (!getoond) kaarten.push(el('div', { class: 'leeg', tekst: 'Nog niets om op terug te kijken. Over een week staat hier je eerste rij.' }));
  else kaarten.push(el('button', {
    class: 'vouw', tekst: '▸ verder terug kijken',
    onclick: () => { ui.weken += 8; tekenTerugblik(); },
  }));

  doel.appendChild(paneel('Week voor week', '', kaarten));
}

      v = Math.max(0, Math.min(7, v));
      veld.value = String(v);
      st.doelen[g.id] = v;
      bewaar();

    });
    rijen.push(el('div', { class: 'doel' }, [

  /* --- reservekopie --- */
  const bestand = el('input', { type: 'file', accept: 'application/json,.json', style: 'display:none' });

    const f = bestand.files && bestand.files[0];

      try {
        const d = JSON.parse(lezer.result);

        vormGoed();
        bewaar();
        tekenAlles();

      } catch (e) {
        zeg('Dit bestand kan ik niet lezen');
      }
    };
    lezer.readAsText(f);
    bestand.value = '';
  });

  const knoppen = el('div', { class: 'knoprij' }, [
    el('button', {
      class: 'btn primair', tekst: 'Reservekopie bewaren',

        const naam = 'op-rij-reservekopie-' + vandaag() + '.json';

        const a = el('a', { href: URL.createObjectURL(blob), download: naam });
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
        st.laatsteKopie = vandaag();
        bewaar();
        setTimeout(tekenInstellingen, 50);
      },
    }),
    el('button', { class: 'btn', tekst: 'Terugzetten', onclick: () => bestand.click() }),
    bestand,
  ]);

  const sinds = st.laatsteKopie
    ? 'Laatste kopie: ' + langeDatum(st.laatsteKopie) + '.'
    : 'Je hebt nog geen reservekopie gemaakt.';

  doel.appendChild(paneel('Reservekopie', '', [
    knoppen,
    el('p', { class: 'uitleg', tekst: sinds + ' Alles staat alleen in deze browser, op deze telefoon. Wis je de browsergegevens of raak je het toestel kwijt, dan is het weg. Een kopie per maand is genoeg — bewaar hem in iCloud of mail hem naar jezelf.' }),
  ]));

  /* --- meldingen --- */
  const kanMelden = 'Notification' in window && 'PushManager' in window
                    && 'serviceWorker' in navigator;
  const stand = !kanMelden ? 'kan niet'
    : Notification.permission === 'granted' ? 'aan'
    : Notification.permission === 'denied' ? 'geweigerd' : 'uit';

  const meldStukken = [];
  if (stand === 'kan niet') {
    meldStukken.push(el('p', { class: 'uitleg', tekst: 'Dit toestel of deze browser kan geen meldingen aannemen. Op de iPhone kan het alleen als de app op je beginscherm staat — zet hem daar via Deel → Zet op beginscherm en open hem daarvandaan.' }));
  } else if (stand === 'geweigerd') {
    meldStukken.push(el('p', { class: 'uitleg', tekst: 'Je hebt meldingen eerder geweigerd. Dat kan de app niet zelf terugdraaien: zet het aan bij Instellingen → Dagstart → Berichtgeving op je telefoon.' }));
  } else {
    meldStukken.push(el('button', {
      class: 'btn',
      tekst: stand === 'aan' ? 'Opnieuw aanmelden' : 'Meldingen aanzetten',
      onclick: async (e) => {
        e.target.disabled = true;
        try {
          if (await Notification.requestPermission() !== 'granted') {
            zeg('Niet toegestaan'); return;
          }
          const reg = await navigator.serviceWorker.ready;
          const ab = await reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: sleutelBytes(VAPID_PUBLIEK),
          });
          aanmelding = JSON.stringify(ab.toJSON());
          zeg('Aangemeld');
        } catch (fout) {
          zeg('Aanmelden lukte niet');
        } finally {
          e.target.disabled = false;
          herteken(tekenInstellingen, 'tab:instellingen');
        }
      },
    }));
  }

  if (aanmelding) {
    const vak = el('textarea', { class: 'aanmelding', readonly: 'readonly', rows: '4' });
    vak.value = aanmelding;
    meldStukken.push(vak);
    meldStukken.push(el('button', {
      class: 'btn',
      tekst: 'Kopieer',
      onclick: () => {
        vak.select();
        navigator.clipboard ? navigator.clipboard.writeText(aanmelding).then(() => zeg('Gekopieerd'))
                            : zeg('Selecteer en kopieer zelf');
      },
    }));
    meldStukken.push(el('p', { class: 'uitleg', tekst: 'Stuur deze regel één keer naar jezelf en zet hem op de Mac in oprij/bron/push-abonnementen.json. Daarna weet je Mac waar hij een melding naartoe moet sturen. Dit hoeft maar één keer, tenzij je de app opnieuw installeert.' }));
  }

  meldStukken.push(el('p', { class: 'uitleg', tekst: 'Je krijgt er weinig: een topbenoeming in je vakgebied, iemand van gewicht die opstapt, een wereldleider die valt of aantreedt, oorlog, kraanvogels binnen tien kilometer van Dalfsen, en een zeer zeldzame vogel, libel, dagvlinder, zoogdier of bij in diezelfde cirkel. Het bericht zelf is leeg — de app haalt daarna zelf op wat er aan de hand is, zodat er onderweg niets te lezen valt.' }));

  /* Welke servicewerker er draait. Die vervangt zichzelf niet altijd even
     gewillig op iOS, en dan komt een melding wél aan maar zonder tekst. */
  const versieregel = el('p', { class: 'uitleg', tekst: 'Versie van de app: aan het opvragen…' });
  meldStukken.push(versieregel);
  if (navigator.serviceWorker && navigator.serviceWorker.controller) {
    const kanaal = (ev) => {
      if (ev.data && ev.data.versie) {
        versieregel.textContent = 'Versie van de app: ' + ev.data.versie + '.';
        navigator.serviceWorker.removeEventListener('message', kanaal);
      }
    };
    navigator.serviceWorker.addEventListener('message', kanaal);
    navigator.serviceWorker.controller.postMessage('versie?');
    setTimeout(() => {
      if (versieregel.textContent.endsWith('opvragen…')) {
        versieregel.textContent = 'Versie van de app: een oude — hij antwoordt niet. '
          + 'Haal Dagstart van je beginscherm en zet hem er opnieuw op.';
      }
    }, 1500);
  } else {
    versieregel.textContent = 'Versie van de app: onbekend, er draait geen servicewerker.';
  }

  doel.appendChild(paneel('Meldingen', stand === 'aan' ? 'aan' : '', meldStukken));

  /* --- over --- */
  doel.appendChild(paneel('Over deze app', '', [
    el('p', { class: 'uitleg', tekst: 'Op Rij draait helemaal op je eigen toestel. Er is geen account, geen server en niets wordt gedeeld. Zet hem in Safari op je beginscherm via Deel → Zet op beginscherm, dan opent hij als een gewone app en werkt hij ook zonder bereik.' }),
    el('p', { class: 'uitleg', tekst: 'Sinds oktober 2026 kan de app wél meldingen aannemen, zie het blok hierboven. Dat werkt alleen vanaf je beginscherm, en alleen als de Mac thuis aanstaat — die kijkt namelijk voor je mee.' }),
  ]));
}

/* ===================================================================
   Ochtendbriefing

   De briefing wordt elke ochtend door bron/ophalen.py op de Mac gemaakt en
   als briefing.json naast deze app gepubliceerd. De app haalt hem op bij het
   openen en bewaart de laatste goede versie in de opslag van dit toestel.
   Dat laatste is geen luxe: zonder bereik zou je anders een leeg scherm
   krijgen, en juist 's ochtends in de trein is dat het geval.
   =================================================================== */

/* De briefing, het dagarchief en de opname staan niet naast deze app maar bij
   GitHub. Reden: Netlify rekent 15 van de 300 maandcredits per publicatie, en
   publiceren is daar altijd de hele map tegelijk. Zes rondes per dag waren dus
   zes publicaties per dag en daarmee was de maand in vier dagen op — in
   augustus, september én oktober 2026. Een bestand bij GitHub vervangen is geen
   publicatie en kost niets, dus Netlify houdt alleen de app zelf.

   Verander je dit adres, verander dan ook 'eigenaar' in bron/github.json en de
   bronnenregel in ~/Claude/Scheduled/ochtend-briefing/SKILL.md; die drie moeten
   naar dezelfde plek wijzen. */
const DATA_BASIS = 'https://raw.githubusercontent.com/GertVeurink/dagstart-data/main/';

/* De publieke helft van de pushsleutel. Die mág iedereen zien — daar is hij
   voor: hij zegt alleen tegen Apple wiens meldingen dit toestel wil aannemen.
   De privéhelft staat in ~/.dagstart-push-sleutel.txt op de Mac. */
const VAPID_PUBLIEK = 'BALRrHK7q70Lj7UpaSPNZmfzNt-0cAYSFLZYMzrOoEAi9VPl2ADTWU6xuwEyfFiscZOMWSt_CFXT6b0hGI7zSdI';

/* De browser wil de sleutel als kale bytes, niet als tekst. */
function sleutelBytes(tekst) {
  const vol = (tekst + '='.repeat((4 - tekst.length % 4) % 4))
    .replace(/-/g, '+').replace(/_/g, '/');
  return Uint8Array.from(atob(vol), (c) => c.charCodeAt(0));
}

/* Wat de telefoon na het aanmelden moet doorgeven aan de Mac. Er is geen
   server, dus dat gaat één keer met de hand. Staat hier zodat het scherm het
   kan tonen zodra het er is. */
let aanmelding = null;

/* Paden in briefing.json zijn relatief ('audio/20261004.mp3'), zodat het
   bestand zelf niet weet waar hij gepubliceerd staat. Hier komt het adres
   ervoor. Een pad dat al met http begint laten we staan. */
function dataAdres(pad) {
  return /^https?:/.test(pad) ? pad : DATA_BASIS + pad;
}

const BRIEF_SLEUTEL = 'dagstart.briefing';
let briefing = null;
/* Oudere briefings worden pas opgehaald als je ze opvraagt, en daarna
   onthouden zolang de app open staat. Ze in de opslag bewaren zou die vol
   laten lopen met nieuws dat je één keer leest. */
const archief = {};

function briefingUitOpslag() {
  try {
    const rauw = localStorage.getItem(BRIEF_SLEUTEL);
    return rauw ? JSON.parse(rauw) : null;
  } catch (e) { return null; }
}

async function haalBriefing() {
  briefing = briefingUitOpslag();
  if (briefing) tekenAlles();
  try {
    /* cache: 'no-store' omdat de servicewerker anders die van gisteren mag
       teruggeven — en dan zie je 's ochtends het nieuws van eergisteren. */
    const r = await fetch(dataAdres('briefing.json') + '?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const verse = await r.json();
    if (verse && Array.isArray(verse.blokken)) {
      briefing = verse;
      try { localStorage.setItem(BRIEF_SLEUTEL, JSON.stringify(verse)); } catch (e) {}
      tekenAlles();
      warmArchief(verse.archief || []).then(() => {
        /* Pas hierna het archief in het geheugen trekken, en alleen als er
           iets te volgen is: zonder dossiers hoeft er niets ingelezen te
           worden. De briefing wordt daarna opnieuw getekend, want de
           tijdlijnen zijn er dan pas. */
        if (!(st.dossiers || []).length) return;
        laadArchief().then(() => tekenBriefing());
      });
    }
  } catch (e) {
    /* Geen bereik of nog niet gepubliceerd. Dan blijft staan wat er stond;
       daar hoeft geen foutmelding bij. */
  }
}

/* De zeven dagen uit het archief één keer binnenhalen, zodat terugbladeren ook
   zonder bereik werkt.

   De servicewerker bewaart alles wat van de gegevenshost komt, dus hij hoeft
   hier niets voor te leren -- maar hij bewaart alleen wat je ooit hebt
   opgevraagd, en dat is precies de dag die je offline níet meer kunt openen.
   Vandaar dit zetje. Zeven bestandjes van een paar honderd kilobyte.

   Eerst kijken wat er al in de cache staat, anders zijn het zeven verzoeken bij
   elke keer dat je de app opent. En één voor één met een pauze ertussen: dit
   hoeft niet snel te zijn en het is andermans server. */
async function warmArchief(dagen) {
  if (!('caches' in window)) return;
  for (const d of dagen) {
    if (d === vandaag()) continue;
    const adres = dataAdres('briefing/' + d + '.json');
    try {
      if (await caches.match(adres, { ignoreSearch: true })) continue;
      await fetch(adres);
      await new Promise((k) => setTimeout(k, 400));
    } catch (e) {
      return;   /* geen bereik -- de rest heeft dan ook geen zin */
    }
  }
}

/* De briefing die nu getoond wordt: die van vandaag, of een dag uit het
   archief die nog aan het laden kan zijn. */
function huidigeBriefing() {
  if (!ui.briefingDag) return briefing;
  return archief[ui.briefingDag] || null;
}

async function haalDag(datum) {
  if (archief[datum]) return;
  try {
    const r = await fetch(dataAdres('briefing/' + datum + '.json'), { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    archief[datum] = await r.json();
  } catch (e) {
    archief[datum] = 'mislukt';
  }
  if (ui.tab === 'briefing') tekenBriefing();
}

function korteDag(datum) {
  if (datum === vandaag()) return 'vandaag';
  const d = new Date(datum + 'T12:00:00');
  const gisteren = new Date(); gisteren.setDate(gisteren.getDate() - 1);
  if (datum === sleutelVan(gisteren)) return 'gisteren';
  return DAGNAMEN[d.getDay()].slice(0, 2) + ' ' + d.getDate();
}

/* Oudere briefings uit het archief hebben nog geen naam; die zijn allemaal
   's ochtends gemaakt. */
function briefingNaam(b) {
  return (b && b.naam) || 'Ochtendbriefing';
}

function briefingDatumTekst() {
  if (!briefing) return '';
  if (briefing.datum !== vandaag()) return 'van ' + langeDatum(briefing.datum);
  const wanneer = { Ochtendbriefing: 'vanochtend', Middagbriefing: 'vanmiddag',
                    Avondbriefing: 'vanavond' }[briefingNaam(briefing)];
  return 'van ' + (wanneer || 'vandaag');
}

        : '') +

      /* Zodat je van het startscherm af ziet dat je iets hebt weggezet; het

  brief.addEventListener('click', () => { ui.tab = 'briefing'; tekenAlles(); window.scrollTo(0,0); });

  const week = trainingDezeWeek();

  const voorstel = voorstelVandaag();
  const tr = document.createElement('button');

    '<div class="cijfers">' +
      '<span class="pil' + (week.gedaan >= week.doel ? ' groen' : '') + '">' +
        week.gedaan + ' van ' + week.doel + ' deze week</span>' +
      (vandaagGedaan ? '<span class="pil groen">✓ vandaag</span>' : '') +
    '</div>';
  tr.addEventListener('click', () => { ui.tab = 'training'; tekenAlles(); window.scrollTo(0,0); });

  /* Als laatste: het is de beloning, niet het werk. */
  const sd = spelDag(vandaag());
  const welk = sd ? sd.welk : spelVan(vandaag());
  const gespeeld = sd ? sd.scores.length : 0;
  const rec = spelRecord(welk);
  const sp = document.createElement('button');
  sp.className = 'startkaart spel';
  sp.innerHTML =
    '<h2>Spelletje</h2>' +
    '<div class="onder">' +
      (gespeeld >= SPEL_POGINGEN
        ? 'Vandaag gespeeld: ' + SPELLEN[welk].naam + ', beste ' + scoreTekst(welk, besteVan(sd.scores))
        : 'Vandaag: ' + SPELLEN[welk].naam + ' — drie keer ' + duurTekst(welk)) + '</div>' +
    '<div class="cijfers">' +
      (gespeeld >= SPEL_POGINGEN
        ? '<span class="pil groen">✓ vandaag</span>'
        : '<span class="pil">nog ' + (SPEL_POGINGEN - gespeeld) +
          (SPEL_POGINGEN - gespeeld === 1 ? ' poging' : ' pogingen') + '</span>') +
      (rec ? '<span class="pil">★ record ' + rec.score + '</span>' : '') +
    '</div>';
  sp.addEventListener('click', () => { ui.tab = 'spel'; tekenAlles(); window.scrollTo(0,0); });

  el.append(brief, tr, rij, sp);

  const voet = document.createElement('div');
  voet.className = 'startvoet';
  for (const [naam, tab] of [['Terugblik','terugblik'], ['Instellingen','instellingen']]) {
    const k = document.createElement('button');
    k.textContent = naam;
    k.addEventListener('click', () => { ui.tab = tab; tekenAlles(); window.scrollTo(0,0); });
    voet.append(k);
  }
  el.append(voet);

  doel.replaceChildren(el);
}

/* Hoeveel vinkjes van vandaag al staan — één regel op de startkaart, zodat je
   ziet of er nog iets te doen is zonder de app in te gaan. */
function gewoontesVandaagTekst() {
  const d = dag(vandaag(), false);
  const tegels = GEWOONTES.filter(g => g.tegel);
  const n = tegels.filter(g => d[g.id]).length;
  return n + ' van ' + tegels.length + ' vinkjes';
}

/* Opnieuw tekenen zonder dat de pagina naar boven springt.

   Elke klik op een blok of kopje tekent het hele briefingscherm opnieuw, en dan
   staat de pagina weer bovenaan — je klikt onderin op Vogels en moet vervolgens
   terugscrollen om te zien wat je net opende. Daarom onthouden we waar het
   aangeklikte element stond ten opzichte van het scherm, en zetten we het daar
   na het hertekenen weer neer. Bij uitklappen én bij dichtklappen, want in beide
   gevallen verschuift alles eronder. */
function herteken(tekenaar, sleutel) {
  const voor = sleutel
    ? document.querySelector('[data-sleutel="' + CSS.escape(sleutel) + '"]')
    : null;
  const top = voor ? voor.getBoundingClientRect().top : null;
  tekenaar();
  if (top === null) return;
  const na = document.querySelector('[data-sleutel="' + CSS.escape(sleutel) + '"]');
  if (na) window.scrollBy(0, na.getBoundingClientRect().top - top);
}

/* De ingesproken briefing, met een eigen speler in plaats van die van de
   browser. Snelheid zit erbij omdat dit gesproken nieuws is: wie hem al twee
   maanden hoort, luistert hem liever op anderhalf terwijl hij zich aankleedt.
   Die keuze blijft staan in de opslag van dit toestel — niet in je gegevens,
   want het is een gemak en geen instelling die ergens anders moet gelden. */
const SNELHEDEN = [1, 1.25, 1.5, 1.75];

function klokje(seconden) {
  if (!isFinite(seconden)) return '–:––';
  const m = Math.floor(seconden / 60);
  const s = Math.floor(seconden % 60);
  return m + ':' + String(s).padStart(2, '0');
}

function maakSpeler(bron) {
  const sp = el('div', { class: 'speler' });
  sp.innerHTML =
    '<div class="kop"><div class="label">Ingesproken</div>' +
      '<span class="duur">–:––</span></div>' +
    '<div class="bediening">' +
      '<button class="knop terug" type="button" title="15 seconden terug" ' +
        'aria-label="Vijftien seconden terug">' +
        '<svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>' +
      '</button>' +
      '<button class="knop afspelen" type="button" aria-label="Afspelen">' +
        '<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>' +
      '</button>' +
      '<input class="voortgang" type="range" min="0" max="1000" value="0" step="1" ' +
        'aria-label="Positie in de opname">' +
      '<span class="tijd">0:00</span>' +
      '<button class="knop snelheid" type="button" aria-label="Afspeelsnelheid">1×</button>' +
    '</div>';

  /* preload="metadata" en niet "none": zo staat de lengte er meteen, zonder dat
     de hele opname van een halve megabyte binnengehaald wordt. */
  const geluid = el('audio', { preload: 'metadata', src: bron });
  geluid.style.display = 'none';
  sp.append(geluid);

  const knop = sp.querySelector('.afspelen');
  const terug = sp.querySelector('.terug');
  const balk = sp.querySelector('.voortgang');
  const tijd = sp.querySelector('.tijd');
  const duur = sp.querySelector('.duur');
  const snelheid = sp.querySelector('.snelheid');
  const DRIEHOEK = '<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>';
  const STREPEN = '<svg viewBox="0 0 24 24"><path d="M7 4h4v16H7zm6 0h4v16h-4z"/></svg>';

  let slepen = false;

  knop.onclick = () => { geluid.paused ? geluid.play() : geluid.pause(); };
  terug.onclick = () => { geluid.currentTime = Math.max(0, geluid.currentTime - 15); };

  let keuze = 0;
  try {
    const bewaard = SNELHEDEN.indexOf(parseFloat(localStorage.getItem('dagstart.snelheid')));
    if (bewaard >= 0) keuze = bewaard;
  } catch (e) {}
  const zetSnelheid = () => {
    geluid.playbackRate = SNELHEDEN[keuze];
    snelheid.textContent = String(SNELHEDEN[keuze]).replace('.', ',') + '×';
    try { localStorage.setItem('dagstart.snelheid', SNELHEDEN[keuze]); } catch (e) {}
  };
  zetSnelheid();
  snelheid.onclick = () => { keuze = (keuze + 1) % SNELHEDEN.length; zetSnelheid(); };

  geluid.onplay = () => { knop.innerHTML = STREPEN; knop.setAttribute('aria-label', 'Pauzeren'); };
  geluid.onpause = () => { knop.innerHTML = DRIEHOEK; knop.setAttribute('aria-label', 'Afspelen'); };
  geluid.onended = () => { knop.innerHTML = DRIEHOEK; balk.value = 0; };
  geluid.onloadedmetadata = () => { duur.textContent = klokje(geluid.duration); };
  geluid.ontimeupdate = () => {
    tijd.textContent = klokje(geluid.currentTime);
    if (!slepen && geluid.duration) {
      balk.value = Math.round((geluid.currentTime / geluid.duration) * 1000);
    }
  };
  /* Tijdens het slepen niet meeschrijven met ontimeupdate, anders springt het
     knopje onder je vinger terug naar waar de opname nog staat. */
  balk.oninput = () => {
    slepen = true;
    if (geluid.duration) tijd.textContent = klokje(balk.value / 1000 * geluid.duration);
  };
  balk.onchange = () => {
    if (geluid.duration) geluid.currentTime = balk.value / 1000 * geluid.duration;
    slepen = false;
  };
  return sp;
}

/* Hoe oud is deze briefing, en moet je dat weten?

   Dit is de enige plek waar de app zijn eigen regel overtrad. Overal elders
   zwijgt hij liever dan het verkeerde te tonen -- het weer laat zijn velden
   leeg als vandaag niet in de vijfdaagse staat, een gevallen bron geeft een
   leeg blok -- maar over zichzelf zei hij niets. Een briefing van eergisteren
   zag er precies zo uit als een verse: dezelfde kop, dezelfde blokken, en
   "opgehaald 05:55" onderaan waar je niet kijkt.

   De datum stond er wél bovenaan, maar een datum lees je als een label en niet
   als een waarschuwing. Vandaar dat het hier met zoveel woorden staat.

   Twee gevallen, en de drempels volgen het ritme van de Mac: elk uur van 05:55
   tot 23:00. Overnacht is zeven uur oud dus normaal, en overdag is drie uur
   dat niet. Blader je zelf terug in het archief, dan weet je het al en zegt
   hij niets. */
function verouderd(toon) {
  if (ui.briefingDag) return '';            /* je hebt zelf een dag gekozen */
  const nu = new Date();
  if (toon.datum !== vandaag()) {
    /* 's Nachts is er nog niets van vandaag en dat hoort; pas als de ronde van
       05:55 geweest had moeten zijn, is het iets om te melden. */
    if (nu.getHours() < 7) return '';
    return 'Dit is de briefing van ' + langeDatum(toon.datum) +
      '. Vanochtend is er niets opgehaald — stond de Mac aan?';
  }
  const t = Date.parse(toon.opgehaald || '');
  if (!t) return '';
  const uren = (nu - t) / 36e5;
  if (uren >= 3 && nu.getHours() >= 8 && nu.getHours() <= 23) {
    return 'Laatst opgehaald om ' + String(new Date(t).getHours()).padStart(2, '0') +
      ':' + String(new Date(t).getMinutes()).padStart(2, '0') +
      ', ruim ' + Math.floor(uren) + ' uur geleden. Normaal is dat elk uur.';
  }
  return '';
}


/* ------------------------------------------------------------------ dossiers

   Zet je een ster bij een bericht, dan volgt de app dat verhaal vanaf dat
   moment: elke dag in het archief wordt nagekeken of er iets bij hoort, en in
   Bewaard staat niet één kop maar een draad met een tijdlijn.

   Waarom dit hier gebeurt en niet in `ophalen.py`: wat jij bewaart staat in de
   browser (`oprij.v1`) en niet in de briefing, die openbaar bij GitHub staat.
   Jouw onderwerpen zeggen iets over waar je mee bezig bent, en dat hoort daar
   niet terecht te komen. Dus doet de app het zelf, op gegevens die hij toch al
   heeft -- de zeven archiefdagen die `warmArchief()` al binnenhaalt.

   De vergelijking is bewust **dezelfde** als die van `ontdubbel_verhaal()` en
   `markeer_vervolg()` in `ophalen.py`: woorden van vijf letters of meer zonder
   vulwoorden, 60% overlap én minstens drie gedeelde woorden. Een kopie, want
   de afspraak hier is dat de apps geen code delen -- maar wél dezelfde kopie.
   Verandert die daar, verander hem hier mee. */

const VULWOORDEN = new Set(['wordt', 'worden', 'heeft', 'hebben', 'moeten',
  'moet', 'kunnen', 'zullen', 'nederland', 'nederlandse', 'volgens', 'tegen',
  'grote', 'nieuwe', 'eerste', 'onder', 'nieuws']);

/* Welke blokken meedoen. `vogels` en `hemel` staan er bewust niet in: daar
   zijn de koppen sjablonen ("Kolgans springt eruit — 15.865, normaal 22") en
   die wijzen elkaar aan zonder dat ze iets met elkaar te maken hebben.
   `bron` doet wél mee, anders dan bij `ontdubbel_verhaal()`: twee
   tweeminutendebatten over hetzelfde onderwerp zijn daar geen vergissing maar
   precies wat een dossier wil laten zien. */
const DOSSIERBLOKKEN = new Set(['internationaal', 'nationaal', 'lokaal', 'vak',
                                'ai', 'bron']);

function kernwoorden(titel) {
  const uit = new Set();
  for (const w of (titel || '').toLowerCase().match(/[a-zà-ü]{5,}/g) || []) {
    if (!VULWOORDEN.has(w)) uit.add(w);
  }
  return uit;
}

function zelfdeVerhaal(a, b) {
  if (!a.size || !b.size) return false;
  let gedeeld = 0;
  for (const w of a) if (b.has(w)) gedeeld++;
  return gedeeld >= 3 && gedeeld / Math.min(a.size, b.size) >= 0.6;
}

/* Alle archiefdagen in het geheugen. `haalDag()` slaat over wat er al staat en
   de servicewerker bewaart de rest, dus dit kost na de eerste keer niets. */
async function laadArchief() {
  for (const d of (briefing && briefing.archief) || []) {
    if (d === vandaag()) continue;
    await haalDag(d);
  }
}

/* Een dossier is een naam plus een stel termen, en eventueel het bericht
   waaruit het ontstaan is.

   Die twee manieren van zoeken staan er allebei met reden:

   - **Uit een bericht** (`zaad`): dan vergelijken we kop met kop, met dezelfde
     gelijkenismaat als `ontdubbel_verhaal()` in `ophalen.py`. Die is gebouwd om
     twee krantenkoppen naast elkaar te leggen.
   - **Zelf getypt** (`termen`): dan zoeken we die termen letterlijk op. Dat
     moest wel -- `kernwoorden()` houdt alleen woorden van vijf letters of meer
     over, dus "Bolle Jos" levert daar níets op en zou nooit iets vinden. Jij
     bepaalt waar hij op aanslaat, en bij een zelfgemaakt dossier is dat ook
     precies wat je wilt.

   Een dossier mag allebei hebben: begin uit een bericht, en vul de termen aan
   als dezelfde zaak elders anders heet. */

function dossierId() {
  return 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function termenUit(tekst) {
  return (tekst || '').split(',').map(t => t.trim()).filter(Boolean);
}

/* Een term met woordgrenzen eromheen, zelf geschreven en niet met `\b`: die
   kent geen accenten. Dit is dezelfde zorgvuldigheid als `politie(?!k)` in
   ophalen.py -- een term die overal half in past maakt een dossier waardeloos. */
function termRaak(term, tekst) {
  if (!term || !tekst) return false;
  const veilig = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return new RegExp('(^|[^a-zà-ÿ0-9])' + veilig + '($|[^a-zà-ÿ0-9])', 'i')
    .test(tekst);
}

function dossierRaak(dos, it) {
  const tekst = (it.titel || '') + ' ' + (it.context || it.toelichting || '');
  for (const t of dos.termen || []) if (termRaak(t, tekst)) return true;
  if (dos.zaad && dos.zaad.titel) {
    return zelfdeVerhaal(kernwoorden(dos.zaad.titel), kernwoorden(it.titel));
  }
  return false;
}

/* De berichten die bij een dossier horen, nieuwste eerst.

   Gegroepeerd op de kop en niet per dag. Dat moest: de Kameragenda toont de
   komende week, dus "Begrotingsonderdeel Artikel 31 Politie" stond zes dagen
   achter elkaar in de briefing. Zonder deze stap zei een dossier "12 berichten"
   over twee dingen die zes keer herhaald werden -- en een dossier hoort
   ontwikkelingen te laten zien, geen herhaling. */
function dossierTreffers(dos) {
  const dagen = {};
  if (briefing) dagen[briefing.datum] = briefing;
  for (const d of Object.keys(archief)) {
    if (archief[d] && archief[d] !== 'mislukt') dagen[d] = archief[d];
  }

  const per = new Map();
  for (const datum of Object.keys(dagen).sort().reverse()) {
    for (const blok of dagen[datum].blokken || []) {
      if (!DOSSIERBLOKKEN.has(blok.id)) continue;
      for (const it of blok.items || []) {
        if (!dossierRaak(dos, it)) continue;
        const sleutel = (it.titel || '').trim().toLowerCase();
        const bestaand = per.get(sleutel);
        if (bestaand) { bestaand.dagen.add(datum); continue; }
        /* `sorteer` moet mee: `isNieuw()` leest dat veld en niets anders, dus
           zonder dit zou de nieuw-markering stilzwijgend nooit aangaan. En
           omdat we van nieuw naar oud lopen is de eerste die we zien meteen de
           nieuwste. */
        per.set(sleutel, { datum, titel: it.titel, link: it.link,
                           bron: it.bron, tijd: it.tijd, sorteer: it.sorteer,
                           dagen: new Set([datum]) });
      }
    }
  }
  return [...per.values()];
}



/* De duiding bij de briefing: een paar alinea's die berichten aan elkaar
   knopen, met onder elke alinea de berichten waarop hij rust.

   Die verwijzingen zijn het hele punt en geen versiering. `duiden.py` laat een
   model alleen werken met wat er in de briefing staat en controleert daarna of
   elk genoemd bericht echt bestaat; wat hier getekend wordt is het resultaat
   van die controle. Zo is elke zin na te lopen naar een kop die je zelf kunt
   openklappen — anders dan bij een beschouwing, die je op zijn blauwe ogen
   moet geloven. Haal die linkjes er dus niet uit om het rustiger te maken. */
function tekenDuiding(draden) {
  const vak = document.createElement('section');
  vak.className = 'blok';
  /* Standaard dicht en met dezelfde knop als de nieuwsblokken. Stond eerst
     open; Gert vroeg op 3 november 2026 of Duiding, Bewaard en Dossiers zich
     net zo willen gedragen als de rest. */
  const open = !!ui.blokOpen.duiding;
  vak.dataset.open = open ? '1' : '0';

  const knop = document.createElement('button');
  knop.dataset.sleutel = 'blok:duiding';
  knop.style.borderLeftColor = 'var(--warm)';
  knop.innerHTML = '<span>\u{1F9F5}</span>' +
    '<span class="naam">Duiding</span>' +
    '<span class="aantal">' + draden.length + '</span>' +
    '<span class="pijl">&#9656;</span>';
  knop.addEventListener('click', () => {
    ui.blokOpen.duiding = !open;
    herteken(tekenBriefing, 'blok:duiding');
  });
  vak.append(knop);
  if (!open) return vak;

  const inhoud = document.createElement('div');
  inhoud.className = 'inhoud duiding';

  /* Wanneer dit geschreven is. De duiding wordt één keer om 06:05 gemaakt en
     staat 's avonds nog steeds boven een nieuwslijst die sindsdien dertien
     keer is ververst -- zonder dit regeltje leest het als de stand van nu.
     Een archiefbriefing van vóór 3 november 2026 draagt het veld niet; dan
     staat er niets, en dat is beter dan een verzonnen tijd. */
  const geschreven = draden.find(d => d.geschreven);
  if (geschreven) {
    inhoud.append(el('p', { class: 'uitleg duidingtijd',
                            tekst: 'Geschreven om ' + geschreven.geschreven
                                   + ', uit het nieuws van dat moment.' }));
  }

  for (const d of draden) {
    const el = document.createElement('div');
    el.className = 'draad' + (d.diep ? ' diep' : '');
    el.innerHTML = '<span class="draadkop"></span>';
    /* textContent en geen innerHTML: deze tekst komt van een model, en een
       losse < of & hoort als teken op het scherm te komen en niet als opmaak. */
    el.querySelector('.draadkop').textContent = d.titel || '';
    /* Eén <p> per alinea. Een gewone draad is één alinea en dan verandert er
       niets; een diepe draad (sinds 4 november 2026, voor de midterms) komt met
       witregels uit `duiden.py` en bestaat uit vier stukken: wat er gebeurde,
       hoe erop gereageerd wordt, en wat het op korte en lange termijn kan
       betekenen. Die aan elkaar plakken maakt er een muur van. */
    for (const alinea of String(d.tekst || '').split(/\n\s*\n/)) {
      if (!alinea.trim()) continue;
      const pp = document.createElement('p');
      pp.textContent = alinea.trim();
      el.append(pp);
    }

    if (d.verwijzingen && d.verwijzingen.length) {
      const uit = document.createElement('div');
      uit.className = 'waaruit';
      for (const v of d.verwijzingen) {
        const r = document.createElement(v.link ? 'a' : 'span');
        if (v.link) { r.href = v.link; r.target = '_blank'; r.rel = 'noopener'; }
        /* Afgekapt, want de transcriptietitels van de Tweede Kamer zijn lang
           ("Mevrouw Coenradie (JA21) over korpsleiding (Begrotingsonderdeel
           Artikel 31 Politie)") en met vijf bronnen onder één alinea nemen ze
           meer ruimte dan de duiding zelf. Je moet eruit kunnen opmaken welk
           bericht het is; lezen doe je het in zijn eigen blok. */
        const naam = (v.titel || '').length > 64
          ? (v.titel || '').slice(0, 64).replace(/\s+\S*$/, '') + '\u2026'
          : (v.titel || '');
        r.textContent = '\u2192 ' + naam + (v.bron ? ' (' + v.bron + ')' : '');
        uit.append(r);
      }
      el.append(uit);
    }
    inhoud.append(el);
  }

  const voet = document.createElement('p');
  voet.className = 'herkomst';
  /* Staat er een diepe draad bij, dan is "alleen uit de berichten in deze
     briefing" niet meer waar: in zo'n draad mogen de laatste twee alinea's
     zeggen wat er uit de uitslag volgt, en dat is het model dat redeneert.
     Dat hoort er dan ook te staan -- anders leest een gevolgtrekking als een
     bericht, en dat is precies het verschil dat deze voetregel moet maken. */
  voet.textContent = draden.some(d => d.diep)
    ? 'Geschreven door een model. De feiten komen uit de berichten in deze ' +
      'briefing en de bronnen staan eronder; wat een langer stuk over de ' +
      'gevolgen zegt, is de gevolgtrekking van het model zelf.'
    : 'Geschreven door een model, alleen uit de berichten in deze briefing ' +
      '\u2014 de bronnen staan eronder zodat je het kunt nalopen.';
  inhoud.append(voet);

  vak.append(inhoud);
  return vak;
}


function tekenBriefing() {
  const doel = document.getElementById('tab-briefing');
  const toon = huidigeBriefing();
  const dagen = (briefing && briefing.archief) ? briefing.archief : [];

  /* De dagkiezer hoort ook zichtbaar te zijn als de gekozen dag nog laadt of
     mislukte, anders kun je niet terug naar vandaag. */
  function dagkiezer() {
    if (dagen.length < 2) return null;
    const rij = document.createElement('div');
    rij.className = 'dagkiezer';
    for (const d of dagen) {
      const k = document.createElement('button');
      const actief = (ui.briefingDag || vandaag()) === d;
      k.className = 'dagknop' + (actief ? ' aan' : '');
      k.textContent = korteDag(d);
      k.addEventListener('click', () => {
        ui.briefingDag = (d === vandaag()) ? null : d;
        if (ui.briefingDag) haalDag(d);
        tekenBriefing();
        window.scrollTo(0, 0);
      });
      rij.append(k);
    }
    return rij;
  }

  if (ui.briefingDag && !toon) {
    const k = dagkiezer();
    const m = document.createElement('div');
    m.className = 'leeg';
    m.textContent = archief[ui.briefingDag] === 'mislukt'
      ? 'Die dag kon ik niet ophalen — oudere briefings staan alleen online.'
      : 'Even ophalen…';
    doel.replaceChildren(...(k ? [k, m] : [m]));
    return;
  }

  if (!toon) {
    doel.replaceChildren(Object.assign(document.createElement('div'), {
      className: 'leeg',
      textContent: 'De briefing van vanochtend is nog niet opgehaald.',
    }));
    return;
  }

  const stuk = document.createDocumentFragment();

  const kop = document.createElement('div');
  kop.className = 'briefkop';
  kop.innerHTML = '<h1>' + briefingNaam(toon) + '</h1>' +
    '<div class="datum">' + langeDatum(toon.datum) + '</div>';
  stuk.append(kop);

  const kiezer = dagkiezer();
  if (kiezer) stuk.append(kiezer);

  const oud = verouderd(toon);
  if (oud) {
    stuk.append(Object.assign(document.createElement('div'),
      { className: 'oud', textContent: oud }));
  }

  if (toon.audio) stuk.append(maakSpeler(dataAdres(toon.audio)));

  /* Duiding, boven de blokken en standaard open. Hij gaat júist over die
     blokken — hem ertussen zetten zou betekenen dat je hem pas leest nadat je
