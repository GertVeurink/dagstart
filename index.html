     de berichten al gehad hebt, en dan heeft hij geen functie meer.
     Ontbreekt hij, dan is er geen blok: dat is een stille dag of een ronde
     zonder sleutel, en in beide gevallen is een leeg paneel erger dan niets. */
  if (toon.duiding && toon.duiding.length) stuk.append(tekenDuiding(toon.duiding));

  const kleuren = { internationaal:'var(--teal)', nationaal:'var(--accent)',
                    lokaal:'var(--olijf)', ai:'var(--leisteen)', bron:'var(--accent)',
                    natuur:'var(--olijf)', vogels:'var(--olijf)',
                    hemel:'var(--leisteen)',
                    trektellen:'var(--olijf)', weer:'var(--teal)',
                    sport:'var(--teal)' };

  /* Bewaarde berichten, bovenaan en standaard dicht. Dit hangt niet aan de dag
     die je bekijkt: het is jouw lijstje en het staat in `oprij.v1`, dus het gaat
     mee in de reservekopie en overleeft een nieuwe versie van de app. */
  /* Dossiers: onderwerpen die je volgt. Staat bóven Bewaard en is er iets
     anders: Bewaard is "dit wil ik nog lezen" en eindigt zodra je het gelezen
     hebt, een dossier is "dit volg ik" en loopt door. Die twee door elkaar
     laten lopen betekende dat je je leeslijstje niet kon opruimen zonder je
     dossiers kwijt te raken. */
  stuk.append(tekenDossiers());

  if (st.bewaard.length) {
    const vak = document.createElement('section');
    vak.className = 'blok';
    const open = !!ui.blokOpen.bewaard;
    vak.dataset.open = open ? '1' : '0';

    const knop = document.createElement('button');
    knop.dataset.sleutel = 'blok:bewaard';
    knop.style.borderLeftColor = 'var(--warm)';
    knop.innerHTML = '<span>\u2605</span>' +
      '<span class="naam">Bewaard</span>' +
      '<span class="aantal">' + st.bewaard.length + '</span>' +
      '<span class="pijl">&#9656;</span>';
    knop.addEventListener('click', () => {
      ui.blokOpen.bewaard = !open;
      herteken(tekenBriefing, 'blok:bewaard');
    });
    vak.append(knop);

    if (open) {
      const inhoud = document.createElement('div');
      inhoud.className = 'inhoud';
      for (const bw of st.bewaard) {
        const rij = document.createElement('div');
        rij.className = 'berichtrij';
        const r = document.createElement(bw.link ? 'a' : 'div');
        r.className = 'bericht';
        if (bw.link) { r.href = bw.link; r.target = '_blank'; r.rel = 'noopener'; }
        r.innerHTML = '<span class="titel">' + bw.titel + '</span>' +
          '<span class="meta">' +
          [bw.bron, bw.tijd, bw.op ? 'bewaard ' + korteDatum(bw.op) : '']
            .filter(Boolean).join(' \u00b7 ') + '</span>';
        rij.append(r);

        /* Hier wordt een bewaard bericht een dossier. Dit is de ene plek waar
           dat hoort: op de nieuwsrij zelf zou het een derde knopje worden bij
           negentig berichten, en dit is het moment waarop je het wilt -- je
           hebt het al weggelegd en merkt dat het doorloopt. */
        if (!st.dossiers.some(d => d.zaad && d.zaad.sleutel === bw.sleutel)) {
          const v = document.createElement('button');
          v.type = 'button';
          v.className = 'volgknop';
          v.title = 'Maak hier een dossier van en volg het verder';
          v.setAttribute('aria-label', 'Dossier maken van: ' + bw.titel);
          v.textContent = '+ dossier';
          v.addEventListener('click', () => {
            st.dossiers.unshift({
              id: dossierId(),
              naam: kortNaam(bw.titel),
              termen: [],
              zaad: { sleutel: bw.sleutel, titel: bw.titel, link: bw.link,
                      bron: bw.bron },
              op: vandaag(),
            });
            bewaar();
            ui.blokOpen.dossiers = true;
            zeg('Dossier aangemaakt');
            herteken(tekenBriefing, 'blok:dossiers');
          });
          rij.append(v);
        }

        const k = document.createElement('button');
        k.type = 'button';
        k.className = 'bewaarknop aan';
        k.title = 'Niet meer bewaren';
        k.setAttribute('aria-label', k.title);
        k.textContent = '\u2605';
        k.addEventListener('click', () => {
          st.bewaard = st.bewaard.filter((x) => x.sleutel !== bw.sleutel);
          bewaar();
          herteken(tekenBriefing, 'blok:bewaard');
        });
        rij.append(k);
        inhoud.append(rij);
      }
      vak.append(inhoud);
    }
    stuk.append(vak);
  }

  for (const b of toon.blokken) {
    const el = document.createElement('section');
    el.className = 'blok';
    const uit = ui.blokOpen[b.id] ? '1' : '0';
    el.dataset.open = uit;

    const knop = document.createElement('button');
    knop.dataset.sleutel = 'blok:' + b.id;
    knop.style.borderLeftColor = kleuren[b.id] || 'var(--leisteen)';
    /* Hoeveel er in dit blok nieuw is sinds je vorige bezoek. Juist bij een
       dichtgeklapt blok is dat de informatie die je nodig hebt om te besluiten
       of je het opent. */
    const nieuwInBlok = b.items.filter(isNieuw).length;
    knop.innerHTML = '<span>' + b.emoji + '</span>' +
      '<span class="naam">' + b.titel + '</span>' +
      /* Een blok mag zelf zeggen wat er op de knop staat. Het sportblok heeft
         geen berichten maar wel negen uitslagen, en dichtgeklapt is dat getal
         het enige wat je ervan ziet. */
      '<span class="aantal">' + (b.aantal != null ? b.aantal
                                 : (b.items.length || '')) + '</span>' +
      (nieuwInBlok ? '<span class="nieuwtje">' + nieuwInBlok + ' nieuw</span>' : '') +
      '<span class="pijl">&#9656;</span>';
    knop.addEventListener('click', () => {
      ui.blokOpen[b.id] = !ui.blokOpen[b.id];
      herteken(tekenBriefing, 'blok:' + b.id);
    });
    el.append(knop);

    if (ui.blokOpen[b.id]) {
      const inhoud = document.createElement('div');
      inhoud.className = 'inhoud';

      if (b.id === 'weer' && b.weer) {
        const w = b.weer;
        const d = document.createElement('div');
        d.className = 'weerkaart';
        d.innerHTML =
          '<div class="groot">' + (w.nu != null ? w.nu + '°' : '') + '</div>' +
          '<div class="meta" style="color:var(--ink-3);font-size:13px">' +
            'meetstation ' + w.station + (w.wind ? ' · wind ' + w.wind : '') + '</div>' +
          /* De cijfers van vandaag zijn er niet altijd: zodra de dag loopt laat
             Buienradar hem uit de vijfdaagse vallen. Dan tonen we ze gewoon
             niet, in plaats van die van morgen onder het kopje vandaag — dat
             stond hier tot 8 oktober 2026 en gaf elke dag het verkeerde getal. */
          (w.omschrijving || w.min != null
            ? '<p><b>' + (w.omschrijving || '') + '</b><br>' +
              (w.min != null ? w.min + ' tot ' + w.max + ' graden' : '') +
              (w.regenkans != null ? ' · ' + w.regenkans + '% kans op regen' : '') +
              (w.zonkans != null ? ' · ' + w.zonkans + '% zon' : '') + '</p>'
            : '') +
          (w.bericht ? '<p>' + w.bericht + '</p>' : '') +
          /* Het landelijke weerbericht noemt Dalfsen nooit ("van 16 graden in
             het Waddengebied tot 17 in het midden"). Deze regel komt van een
             verwachting op de coördinaten van Dalfsen zelf. */
          (w.dalfsen && w.dalfsen.zin
            ? '<p class="dalfsen">' + w.dalfsen.zin + '</p>' : '') +
          (w.morgen ? '<p><b>Morgen</b> ' + (w.morgen.omschrijving || '').toLowerCase() +
            (w.morgen.min != null ? ', ' + w.morgen.min + ' tot ' + w.morgen.max + ' graden' : '') +
            (w.morgen.regenkans != null ? ' · ' + w.morgen.regenkans + '% kans op regen' : '') +
            '</p>' : '') +
          (w.omslag ? '<p class="omslag">' + w.omslag + '</p>' : '') +
          (w.vooruit ? '<p class="vooruit">' + w.vooruit + '</p>' : '');
        inhoud.append(d);
      }

      if (b.id === 'sport' && b.sport) inhoud.append(tekenSport(b.sport));

      /* Eén bericht als element. Apart, omdat de items nu op twee plekken
         gemaakt worden: los, en binnen een ingeklapt kopje. */
      const maakBericht = (it) => {
        const rij = document.createElement('div');
        rij.className = 'berichtrij' + (isNieuw(it) ? ' nieuw' : '');
        const heeftLink = !!it.link;
        const r = document.createElement(heeftLink ? 'a' : 'div');
        r.className = 'bericht' + (it.sein ? ' sein' : '');
        if (heeftLink) { r.href = it.link; r.target = '_blank'; r.rel = 'noopener'; }

        let meta = [it.bron, it.tijd].filter(Boolean).join(' · ');
        let extra = '';
        if (it.soorten && it.soorten.length) {
          extra += '<span class="meta">' +
            (it.aantal_soorten ? it.aantal_soorten + ' soorten · grootste: ' : '') +
            it.soorten.join(', ') + '</span>';
        }
        if (it.opmerkingen && it.opmerkingen.length) {
          extra += '<span class="meta">' + it.opmerkingen.join(' — ') + '</span>';
        }
        if (it.vergelijking) extra += '<span class="meta">' + it.vergelijking + '</span>';
        /* Een toelichting is inhoud, geen bijschrift — dus als lopende tekst en
           niet in het grijs van de metaregel. Bij Nature Today zit daar het
           enige dat telt: de kop is vaak alleen een datum. */
        if (it.toelichting) extra += '<p class="toelichting">' + it.toelichting + '</p>';
        /* Stond dit verhaal gisteren ook in de briefing? Dat zegt `ophalen.py`
           erbij; zie markeer_vervolg() daar. */
        if (it.vervolg) extra += '<span class="meta">' + it.vervolg + '</span>';
        if (it.wanneer) meta = it.wanneer + ' · ' + meta;
        if (it.tellers) meta += ' · ' + it.tellers;

        r.innerHTML = '<span class="titel">' + it.titel +
                      (isNieuw(it) ? '<span class="nieuwtje">nieuw</span>' : '') +
                      '</span>' +
                      extra + '<span class="meta">' + meta + '</span>';
        rij.append(r);

        /* De bewaarknop staat náást de link en niet erin: een knop binnen een
           anchor is ongeldige opmaak, en een tik erop zou het artikel openen. */
        const k = document.createElement('button');
        k.type = 'button';
        k.className = 'bewaarknop' + (isBewaard(it) ? ' aan' : '');
        k.title = isBewaard(it) ? 'Niet meer bewaren' : 'Bewaren';
        k.setAttribute('aria-label', k.title);
        k.textContent = isBewaard(it) ? '\u2605' : '\u2606';
        k.addEventListener('click', () => {
          bewaarWissel(it);
          herteken(tekenBriefing, 'blok:' + b.id);
        });
        rij.append(k);
        return rij;
      };

      /* Items met een kopje worden gegroepeerd en apart uitklapbaar. Een blok als
         "Uit de bron" heeft bijna twintig stukken; die allemaal tegelijk tonen is
         net zo onleesbaar als zonder kopjes. Items zonder kopje — alle andere
         blokken — komen gewoon achter elkaar. */
      const groepen = [];
      for (const it of b.items) {
        const laatste = groepen[groepen.length - 1];
        if (laatste && laatste.kop === (it.kop || null)) laatste.items.push(it);
        else groepen.push({ kop: it.kop || null, items: [it] });
      }

      for (const g of groepen) {
        if (!g.kop) {
          for (const it of g.items) inhoud.append(maakBericht(it));
          continue;
        }
        const sleutel = b.id + '|' + g.kop;
        const open = !!ui.kopOpen[sleutel];
        const knop = document.createElement('button');
        knop.dataset.sleutel = 'kop:' + sleutel;
        knop.className = 'subkop' + (open ? ' open' : '');
        knop.innerHTML = '<span class="naam">' + g.kop + '</span>' +
                         '<span class="aantal">' + g.items.length + '</span>' +
                         '<span class="pijl">&#9656;</span>';
        knop.addEventListener('click', () => {
          ui.kopOpen[sleutel] = !ui.kopOpen[sleutel];
          herteken(tekenBriefing, 'kop:' + sleutel);
        });
        inhoud.append(knop);
        if (open) for (const it of g.items) inhoud.append(maakBericht(it));
      }
      el.append(inhoud);
    }
    stuk.append(el);
  }

  /* Onderaan: ging het goed vanochtend? Alle storingen van deze app zijn stil —
     een blok dat ontbreekt ziet eruit als "er was niets". Deze regel maakt het
     verschil zichtbaar zonder dat je in logbestanden hoeft te kijken. */
  /* Heette `st` tot 30 oktober 2026, en dat was een valstrik: `st` is ook de
     naam van je eigen gegevens hierboven. Zolang deze functie die niet nodig
     had viel dat niet op; zodra het blok Bewaard erbij kwam, viel de hele
     briefing om met "Cannot access 'st' before initialization". */
  const rapport = toon.status;
  if (rapport) {
    const v = document.createElement('div');
    v.className = 'status' + (rapport.problemen && rapport.problemen.length ? ' let-op' : '');
    const stukken = [];
    if (rapport.opgehaald) stukken.push('opgehaald ' + rapport.opgehaald);
    if (rapport.blokken) stukken.push(rapport.blokken + ' blokken, ' + rapport.berichten + ' berichten');
    if (toon.audio) {
      stukken.push('ingesproken door ' +
        (rapport.audio_herkomst === 'model' ? 'je Mac, tekst van het model' :
         rapport.audio_herkomst === 'vangnet' ? 'je Mac, tekst van het sjabloon' :
         rapport.audio_herkomst === 'geplande taak' ? 'de geplande taak' : 'onbekend') +
        (rapport.audio_aangehaakt ? ', aangehaakt ' + rapport.audio_aangehaakt : ''));
    } else {
      stukken.push('nog geen opname');
    }
    let tekst = stukken.join(' · ');
    if (rapport.problemen && rapport.problemen.length) {
      tekst += '<br>' + rapport.problemen.length +
        (rapport.problemen.length === 1 ? ' bron gaf een storing: ' : ' bronnen gaven een storing: ') +
        rapport.problemen.join('; ');
    }
    v.innerHTML = tekst;
    stuk.append(v);
  }

  doel.replaceChildren(stuk);

  /* Nu je de briefing van vandaag gezien hebt, schuift het ijkpunt op -- maar
     alleen in de opslag. `gezienMs` hierboven blijft staan zolang de app open
     is, dus de stipjes verdwijnen niet onder je ogen. */
  if (!ui.briefingDag) gezienBijwerken();
}

/* ===================================================================
   Training

   Eén van de drie per dag, vijf keer per week. Welke van de drie stelt de app
   voor, en dat is niet willekeurig: het plan schrijft om-en-om voor. Twee
   krachtdagen achter elkaar geeft te weinig herstel, en elke dag lopen is bij
   100 kg en 51 jaar vragen om een blessure. Je mag altijd afwijken — er wordt
   niets geblokkeerd, het is een voorstel.
   =================================================================== */

function trainingVan(datum) {
  return dag(datum).training || null;
}

/* De laatste keren dat er getraind is, nieuwste eerst. */
function trainingHistorie(aantal) {
  const uit = [];
  const d = new Date();
  for (let i = 0; i < 60 && uit.length < aantal; i++) {
    const datum = sleutelVan(d);
    const t = trainingVan(datum);
    if (t) uit.push({ datum, soort: t });
    d.setDate(d.getDate() - 1);
  }
  return uit;
}

function voorstelVandaag() {
  const historie = trainingHistorie(4);
  if (!historie.length) return { id: 'a', reden: 'Eerste keer — begin met Kracht A.' };

  const laatste = historie[0];
  if (laatste.datum === vandaag()) return null;   /* vandaag al gedaan */

  if (TRAINING[laatste.soort].soort === 'kracht') {
    return { id: 'lopen', reden: 'Gisteren kracht, dus vandaag lopen — om en om.' };
  }
  /* Na een loopdag weer kracht, en dan de krachtdag die het langst geleden is. */
  const laatsteKracht = historie.find(h => TRAINING[h.soort].soort === 'kracht');
  const volgende = laatsteKracht && laatsteKracht.soort === 'a' ? 'b' : 'a';
  return { id: volgende, reden: 'Na een loopdag weer kracht.' };
}

function trainingDezeWeek() {
  const g = GEWOONTES.find(x => x.id === 'training');
  return { gedaan: telWeek(maandagVan(vandaag()), g), doel: doelVan(g) };
}

function zetTraining(id) {
  const d = dag(vandaag(), true);
  if (d.training === id) delete d.training;   /* nog eens tikken = terugnemen */
  else d.training = id;
  bewaar();
  tekenAlles();
  zeg(d.training ? TRAINING[id].naam + ' afgevinkt' : 'Afvinken teruggenomen');

  /* Vieren pas ná het opslaan en alleen bij het aanvinken -- niet als je het
     terugneemt. De vijfde van de week is het moment: dan is de week binnen. */
  if (!d.training) return;
  const maandag = maandagVan(vandaag());
  const week = telWeek(maandag, GEWOONTES.find(g => g.id === 'training'));
  if (week >= (st.doelen.training || 5)) {
    vierAls('week-' + maandag, 'Vijf deze week — binnen!');
  }
  if (uitdagingLoopt() && uitdagingGedaan() >= UITDAGING.doel) {
    vierAls('uitdaging-' + UITDAGING.van, UITDAGING.naam + ' gehaald. Alle ' +
            UITDAGING.doel + '.');
  }
}

function tekenTraining() {
  const doel = document.getElementById('tab-training');
  const stuk = document.createDocumentFragment();
  const gedaanVandaag = trainingVan(vandaag());
  const week = trainingDezeWeek();
  const voorstel = voorstelVandaag();

  const kop = document.createElement('div');
  kop.className = 'briefkop';
  kop.innerHTML = '<h1>Training</h1><div class="datum">' +
    week.gedaan + ' van ' + week.doel + ' deze week' +
    (week.gedaan >= week.doel ? ' — gehaald' : '') + '</div>';
  stuk.append(kop);

  const advies = document.createElement('div');
  advies.className = 'speler';
  advies.innerHTML = gedaanVandaag
    ? '<div class="label">Vandaag gedaan</div><b style="font-family:var(--serif);font-size:19px">' +
      TRAINING[gedaanVandaag].naam + '</b>'
    : '<div class="label">Vandaag aan de beurt</div><b style="font-family:var(--serif);font-size:19px">' +
      TRAINING[voorstel.id].naam + '</b><div class="label" style="margin:6px 0 0">' +
      voorstel.reden + '</div>';
  stuk.append(advies);

  for (const id of TRAINING_VOLGORDE) {
    const t = TRAINING[id];
    const el = document.createElement('section');
    el.className = 'blok';
    el.dataset.open = ui.blokOpen['tr-' + id] ? '1' : '0';

    const rij = document.createElement('div');
    rij.className = 'trainingrij';

    const vink = document.createElement('button');
    vink.className = 'vinkknop' + (gedaanVandaag === id ? ' aan' : '');
    vink.setAttribute('aria-label', t.naam + ' afvinken voor vandaag');
    /* Een leeg vlak leest niet als een knop. Een open rondje wel, en het zegt
       meteen dat er nog niets is afgevinkt. */
    vink.textContent = gedaanVandaag === id ? '✓' : '○';
    vink.addEventListener('click', () => zetTraining(id));

    const knop = document.createElement('button');
    knop.className = 'trainingnaam';
    if (!gedaanVandaag && voorstel && voorstel.id === id) knop.classList.add('beurt');
    knop.innerHTML = '<span class="naam">' + t.naam + '</span>' +
      '<span class="aantal">' + t.onder + ' · ' + t.duur + '</span>' +
      '<span class="pijl">&#9656;</span>';
    knop.dataset.sleutel = 'tr:' + id;
    knop.addEventListener('click', () => {
      ui.blokOpen['tr-' + id] = !ui.blokOpen['tr-' + id];
      herteken(tekenTraining, 'tr:' + id);
    });

    rij.append(vink, knop);
    el.append(rij);

    if (ui.blokOpen['tr-' + id]) {
      const inhoud = document.createElement('div');
      inhoud.className = 'inhoud';
      t.oefeningen.forEach(([naam, kit, sets, uitleg, tip], n) => {
        const sleutel = id + '-' + n;
        const o = document.createElement('div');
        o.className = 'oef' + (ui.oefOpen[sleutel] ? ' open' : '');

        const bovenkant = document.createElement('button');
        bovenkant.className = 'oef-top';
        bovenkant.innerHTML =
          '<span class="picto"><svg viewBox="0 0 60 60" fill="none" stroke="currentColor" ' +
            'stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
            (PICTO[naam] || '') + '</svg></span>' +
          '<span class="oef-mid"><span class="oef-naam">' + naam + '</span>' +
            '<span class="oef-kit">' + kit + '</span></span>' +
          /* "3 × 8 per been" op één regel duwt de naam over twee regels heen.
             Het staartje dus eronder, kleiner — net als in het oorspronkelijke
             schema. */
          '<span class="oef-num">' +
            sets.replace(/ (per .+|sec)$/, '<small>$1</small>') + '</span>' +
          '<span class="pijl">&#9656;</span>';
        bovenkant.dataset.sleutel = 'oef:' + sleutel;
        bovenkant.addEventListener('click', () => {
          ui.oefOpen[sleutel] = !ui.oefOpen[sleutel];
          herteken(tekenTraining, 'oef:' + sleutel);
        });
        o.append(bovenkant);

        if (ui.oefOpen[sleutel]) {
          const body = document.createElement('div');
          body.className = 'oef-body';
          body.innerHTML = '<p>' + uitleg + '</p><p class="cue">' + tip + '</p>';
          o.append(body);
        }
        inhoud.append(o);
      });
      /* Het looppaneel -- de opbouw van deze week, je laatste rondjes, de
         verwachting -- stond hieronder als los blok op het scherm. Daardoor
         was het trainingsscherm drie regels plus een lap tekst die er altijd
         stond, ook op een krachtdag. Gert vroeg op 3 november 2026 om drie
         nette regels met de uitleg pas achter een tik; dus hoort dit thuis
         waar het over gaat, en dat is onder Lopen. */
      if (id === 'lopen') {
        const loop = tekenLoop(true);
        if (loop) inhoud.append(loop);
      }
      el.append(inhoud);
    }
    stuk.append(el);
  }

  /* Hier stond een blok algemene uitleg -- hoe zwaar een set moet voelen, dat
     de weegschaal de eerste weken stilstaat, spierpijn tegenover gewrichtspijn.
     Gert heeft het er op 3 november 2026 uit gehaald, en terecht: het stond
     onder elk trainingsscherm, elke dag, en hij kent het. Wat per oefening
     telt staat bij die oefening, en het algemene verhaal staat op de PDF die
     in de schuur hangt -- daar lees je het één keer en niet honderd keer.
     Zet het niet terug bij een opruiming. */

  doel.replaceChildren(stuk);
}

/* ===================================================================
   Spelletje — één klein spel per dag.

   Gert wilde 's ochtends iets kleins om te spelen, zonder dat het de hele
   ochtend kost. Daarom drie pogingen per dag van precies anderhalve minuut,
   en de beste telt: meer dan vijf minuten wordt het nooit. Een vaste tijd en
   geen levens, want met levens duurt een goede ronde Snake tien minuten — en
   dan zijn scores van verschillende dagen ook niet meer te vergelijken.

   De datum bepaalt welk spel aan de beurt is én hoe het die dag loopt: alle
   drie de pogingen krijgen dezelfde reeks appels. Zo leer je het bord een
   beetje kennen en gaat de tweede keer beter. Morgen is het een andere reeks.

   De scores staan in `dagen[datum].spel` = { welk, scores: [..] }, net als de
   training, en gaan daarmee vanzelf mee in de reservekopie. Een poging wordt
   bij de start al als 0 weggeschreven: wie halverwege wegtikt of de app
   herlaadt, heeft die poging gebruikt. Anders is "drie keer" geen drie keer.
   =================================================================== */

const SPEL_POGINGEN = 3;
/* Seconden per poging. Een spel mag er zelf een andere neerzetten (`duur`):
   Tetris heeft er meer nodig, want daar is de eerste minuut vooral opbouwen en
   begint het pas te tellen als de stapel er staat. De andere blijven op 90 --
   dat is kort genoeg om er 's ochtends niet in te blijven hangen. */
const SPEL_DUUR = 90;

/* De spellen zelf staan verderop; elk spel zet zich in deze lijst. */
const SPELLEN = {};
/* De beurtvolgorde: elke dag de volgende, en na vijf dagen weer de eerste. Een
   spel erbij zetten verschuift de hele rij, maar de scores houden hun spel vast:
   die staan bij `welk` en niet bij de plek in deze lijst. */
const SPEL_VOLGORDE = ['snake', 'breakout', 'ruimte', '2048', 'lichtjes',
                       'frogger', 'tetris'];

/* "anderhalve minuut" stond twee keer hard in de tekst. Sinds Tetris langer
   duurt dan de rest klopt dat niet meer, en een scherm dat 90 seconden belooft
   terwijl de klok op 2:30 staat is erger dan geen belofte. */
function duurTekst(welk) {
  const sec = SPELLEN[welk].duur || SPEL_DUUR;
  if (sec === 90) return 'anderhalve minuut';
  if (sec === 150) return 'tweeënhalve minuut';
  if (sec % 60 === 0) return (sec / 60) + ' minuten';
  return sec + ' seconden';
}

function spelVan(datum) {
  const dagnr = Math.round(alsDatum(datum).getTime() / 864e5);
  const n = SPEL_VOLGORDE.length;
  return SPEL_VOLGORDE[((dagnr % n) + n) % n];
}

function spelDag(datum) {
  const s = dag(datum).spel;
  return s && Array.isArray(s.scores) ? s : null;
}

function besteVan(scores) { return scores.length ? Math.max(...scores) : 0; }

function scoreTekst(welk, n) {
  const e = SPELLEN[welk].eenheid;
  return n + ' ' + (n === 1 ? e[0] : e[1]);
}

/* Het beste dagresultaat ooit; met `voor` alleen van de dagen daarvóór, om te
   zien of vandaag een record is. */
function spelRecord(welk, voor) {
  let beste = null;
  for (const datum in st.dagen) {
    if (voor && datum >= voor) continue;
    const s = st.dagen[datum].spel;
    if (!s || s.welk !== welk || !Array.isArray(s.scores) || !s.scores.length) continue;
    const b = besteVan(s.scores);
    /* Een 0 is geen record, en het is ook wat er staat tijdens een lopende
       poging. */
    if (b > 0 && (!beste || b > beste.score)) beste = { score: b, datum };
  }
  return beste;
}

function spelHistorie(welk, aantal) {
  return Object.keys(st.dagen).sort().reverse()
    .filter((d) => {
      const s = st.dagen[d].spel;
      return s && s.welk === welk && Array.isArray(s.scores) && s.scores.length;
    })
    .slice(0, aantal)
    .map((d) => ({ datum: d, score: besteVan(st.dagen[d].spel.scores) }));
}

/* Toeval dat op dezelfde dag steeds hetzelfde uitvalt: een kleine rekenmachine
   (mulberry32) met de datum als beginwaarde. Math.random kan dat niet. */
function dagToeval(tekst) {
  let h = 2166136261;
  for (let i = 0; i < tekst.length; i++) { h ^= tekst.charCodeAt(i); h = Math.imul(h, 16777619); }
  let a = h >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---------- het speelwerk dat alle spellen delen ----------

   Elk spel in SPELLEN levert hetzelfde rijtje:
   - begin(toeval)        de beginstand; `toeval` is die van vandaag
   - verder(t, ms)        de tijd loopt door; geeft een reden terug als het mis
                          gaat ('bots', 'nat', 'vol', …), anders niets
   - veeg(t, dx, dy)      een veeg of een pijltjestoets; ook een reden of niets
   - tik(t)               een tik zonder te vegen (mag ontbreken)
   - sleep(t, fx)         de vinger staat op fx (0 links … 1 rechts); alleen
                          voor spellen die je vinger volgen, zoals Breakout
   - teken(g, maat, kleur, t)
   De klok, de pogingen, het opslaan en de knoppen zitten hier en niet in elk
   spel apart. */

let spel = null;   /* de poging van nu (of de laatst afgelopen), niet bewaard */

function spelVanVandaag() {
  const s = spelDag(vandaag());
  return s && SPELLEN[s.welk] ? s.welk : spelVan(vandaag());
}

function startPoging() {
  const datum = vandaag();
  const d = dag(datum, true);
  if (!spelDag(datum) || !SPELLEN[d.spel.welk]) d.spel = { welk: spelVan(datum), scores: [] };
  if (d.spel.scores.length >= SPEL_POGINGEN) return;
  const welk = d.spel.welk;
  d.spel.scores.push(0);
  bewaar();
  spel = {
    datum, welk, nr: d.spel.scores.length - 1,
    t: SPELLEN[welk].begin(dagToeval(welk + ':' + datum)),
    over: (SPELLEN[welk].duur || SPEL_DUUR) * 1000, vorige: 0,
    gestart: false, pauze: false, klaar: false, reden: null,
  };
  tekenSpel();
  requestAnimationFrame(spelLus);
}

function spelLus(nu) {
  if (!spel || spel.klaar) return;
  /* Hoogstens een kwart seconde per beeldje: na een hapering mag er niet
     ineens van alles tegelijk gebeuren. */
  const dt = spel.vorige ? Math.min(nu - spel.vorige, 250) : 0;
  spel.vorige = nu;
  if (spel.gestart && !spel.pauze) {
    spel.over -= dt;
    const einde = SPELLEN[spel.welk].verder(spel.t, dt);
    if (einde) eindPoging(einde);
    else if (spel.over <= 0) { spel.over = 0; eindPoging('tijd'); }
  }
  tekenBord();
  werkStandBij();
  if (!spel.klaar) requestAnimationFrame(spelLus);
}

/* Elke vorm van invoer begint de klok, en haalt een gepauzeerd spel van de
   pauze af. */
function invoer(soort, a, b) {
  if (!spel || spel.klaar) return;
  if (!spel.gestart) spel.gestart = true;
  if (spel.pauze) { spel.pauze = false; spel.vorige = 0; }
  const f = SPELLEN[spel.welk][soort];
  const einde = f ? f.call(SPELLEN[spel.welk], spel.t, a, b) : null;
  if (einde) eindPoging(einde);
}

function eindPoging(reden) {
  if (!spel || spel.klaar) return;
  spel.klaar = true;
  spel.reden = reden;
  const s = spelDag(spel.datum);
  if (s && s.scores.length > spel.nr) s.scores[spel.nr] = spel.t.score;
  bewaar();
  if (ui.tab === 'spel') tekenSpel();
}

const SPEL_EINDE = {
  tijd: 'Tijd!', bots: 'Botsing!', nat: 'Plons!', mis: 'Gemist!', vol: 'Vol!', vast: 'Vast!',
  door: 'Doorgelaten!',
};

/* Een afgerond vakje; oudere Safari kent roundRect nog niet. */
function rondVak(g, x, y, b, h, r) {
  g.beginPath();
  if (g.roundRect) g.roundRect(x, y, b, h, r);
  else g.rect(x, y, b, h);
  g.fill();
}

/* Voordat je begint, laat het bord al zien hoe het er vandaag uitziet. */
let voorbeeldBord = null;
function voorbeeld(welk) {
  const sleutel = welk + ':' + vandaag();
  if (!voorbeeldBord || voorbeeldBord.sleutel !== sleutel)
    voorbeeldBord = { sleutel, t: SPELLEN[welk].begin(dagToeval(sleutel)) };
  return voorbeeldBord.t;
}

function tekenBord() {
  const c = document.getElementById('spelbord');
  if (!c || !c.clientWidth) return;
  const welk = spel ? spel.welk : spelVanVandaag();
  const maat = Math.round(c.clientWidth * (window.devicePixelRatio || 1));
  const hoog = Math.round(maat * (SPELLEN[welk].verhouding || 1));
  if (c.width !== maat || c.height !== hoog) { c.width = maat; c.height = hoog; }
  const g = c.getContext('2d');
  const stijl = getComputedStyle(document.documentElement);
  const kleur = (n) => stijl.getPropertyValue(n).trim();
  g.clearRect(0, 0, maat, hoog);
  g.globalAlpha = 1;
  SPELLEN[welk].teken(g, maat, kleur, spel ? spel.t : voorbeeld(welk));
  g.globalAlpha = 1;
}

/* Een heel zacht dambord, zodat je ziet hoeveel vakjes er nog zijn. */
function dambord(g, maat, kleur, n) {
  const vak = maat / n;
  g.fillStyle = kleur('--line');
  g.globalAlpha = .45;
  for (let x = 0; x < n; x++)
    for (let y = 0; y < n; y++) if ((x + y) % 2) g.fillRect(x * vak, y * vak, vak, vak);
  g.globalAlpha = 1;
}

/* ---------- Snake ---------- */

const SNAKE_VAK = 15;          /* 15 × 15 vakjes: op een telefoon ruim 20 px per vakje */
const SNAKE_TEMPO = 160;       /* milliseconden per stap aan het begin */
const SNAKE_SNELST = 90;

/* Steeds de volgende uit de reeks van vandaag; valt hij op de slang, dan de
   volgende. Zo krijgen alle pogingen dezelfde appels zolang je hetzelfde rijdt. */
function snakeAppel(t) {
  for (let i = 0; i < 500; i++) {
    const p = [Math.floor(t.toeval() * SNAKE_VAK), Math.floor(t.toeval() * SNAKE_VAK)];
    if (!t.slang.some(([x, y]) => x === p[0] && y === p[1])) return p;
  }
  return null;
}

function snakeStap(t) {
  if (t.wachtrij.length) t.richting = t.wachtrij.shift();
  const [x, y] = t.slang[0];
  const kop = [x + t.richting[0], y + t.richting[1]];
  const eet = !!t.appel && kop[0] === t.appel[0] && kop[1] === t.appel[1];
  /* De staart schuift deze stap op, dus daar mag de kop wél komen — behalve
     als hij net eet, want dan blijft de staart staan. */
  const lijf = eet ? t.slang : t.slang.slice(0, -1);
  if (kop[0] < 0 || kop[1] < 0 || kop[0] >= SNAKE_VAK || kop[1] >= SNAKE_VAK ||
      lijf.some(([a, b]) => a === kop[0] && b === kop[1])) {
    t.botsing = true;
    return 'bots';
  }
  t.slang.unshift(kop);
  if (eet) {
    t.score++;
    t.stap = Math.max(SNAKE_SNELST, t.stap - 3);
    t.appel = snakeAppel(t);
  } else {
    t.slang.pop();
  }
  return null;
}

SPELLEN.snake = {
  naam: 'Snake', eenheid: ['appel', 'appels'],
  uitleg: 'Veeg om te sturen en eet zoveel mogelijk appels. Rand of jezelf geraakt: poging voorbij.',
  hint: 'Veeg om te beginnen', mac: 'op de Mac: de pijltjestoetsen',
  begin(toeval) {
    const t = { toeval, slang: [[4, 7], [3, 7], [2, 7]], richting: [1, 0], wachtrij: [],
                appel: null, score: 0, stap: SNAKE_TEMPO, opgespaard: 0, botsing: false };
    t.appel = snakeAppel(t);
    return t;
  },
  verder(t, dt) {
    t.opgespaard += dt;
    while (t.opgespaard >= t.stap) {
      t.opgespaard -= t.stap;
      const einde = snakeStap(t);
      if (einde) return einde;
    }
    return null;
  },
  /* Twee bochten mogen in de wachtrij: wie snel "omhoog, links" veegt, wil dat
     allebei, ook als ze binnen één stap vallen. Omkeren kan niet — dan rijd je
     jezelf in. */
  veeg(t, dx, dy) {
    const laatste = t.wachtrij.length ? t.wachtrij[t.wachtrij.length - 1] : t.richting;
    if (laatste[0] === dx && laatste[1] === dy) return null;
    if (laatste[0] === -dx && laatste[1] === -dy) return null;
    if (t.wachtrij.length < 2) t.wachtrij.push([dx, dy]);
    return null;
  },
  teken(g, maat, kleur, t) {
    dambord(g, maat, kleur, SNAKE_VAK);
    const vak = maat / SNAKE_VAK;
    if (t.appel) {
      g.fillStyle = kleur('--warm');
      g.beginPath();
      g.arc((t.appel[0] + .5) * vak, (t.appel[1] + .5) * vak, vak * .34, 0, Math.PI * 2);
      g.fill();
    }
    t.slang.forEach(([x, y], n) => {
      g.fillStyle = n === 0 ? kleur('--accent-ink') : kleur('--accent');
      rondVak(g, x * vak + vak * .07, y * vak + vak * .07, vak * .86, vak * .86, vak * .25);
    });
    if (t.botsing) {
      const [x, y] = t.slang[0];
      g.strokeStyle = kleur('--warm');
      g.lineWidth = vak * .12;
      g.strokeRect(x * vak + vak * .1, y * vak + vak * .1, vak * .8, vak * .8);
    }
  },
};

/* ---------- Ruimtewacht ----------
   Je schip volgt je vinger en schiet vanzelf; jij hoeft alleen te zorgen dat
   je onder de goede staat. Dat is met opzet: dit is het enige spel hier
   zonder vegen, en vegen is op een telefoon nu eenmaal de wankelste invoer.
   Slepen werkt bij Breakout al jaren goed, dus dat is het hier ook.

   Zelf schieten zou een tik vragen terwijl je sleept, en dat is op een
   telefoon een onmogelijke combinatie -- vandaar dat het vuren vanzelf gaat.
   Wat je traint is kiezen welke je eerst neerhaalt, niet hoe snel je tikt.

   Alles in fracties van het bord (0 tot 1), net als Breakout, zodat de
   schermgrootte niets uitmaakt. En in stapjes van hooguit 8 ms, anders vliegt
   een kogel bij een hapering dwars door een vijand heen. */

const RU_KOLOMMEN = 7;
const RU_SCHIP_Y = .9;
const RU_SCHOT = 300;          /* milliseconden tussen twee kogels */
const RU_RAAK = .055;          /* hoe dicht een kogel bij een vijand moet komen */

function ruimteKolom(k) { return (k + .5) / RU_KOLOMMEN; }

SPELLEN.ruimte = {
  naam: 'Ruimtewacht', eenheid: ['raak', 'raak'],
  uitleg: 'Je schip volgt je vinger en schiet vanzelf. Laat er geen één langs '
        + 'de onderkant komen.',
  hint: 'Raak het bord aan om te beginnen', mac: 'op de Mac: slepen, of de pijltjestoetsen',
  begin(toeval) {
    return { toeval, schip: .5, doel: .5, kogels: [], vijanden: [],
             sindsSchot: 0, sindsSpawn: 400, score: 0 };
  },
  sleep(t, fx) { t.doel = fx; return null; },
  veeg(t, dx) { t.doel = Math.max(0, Math.min(1, t.doel + dx * .08)); return null; },
  verder(t, ms) {
    t.schip = Math.max(.06, Math.min(.94, t.doel));

    /* Hoe verder je komt, hoe sneller ze zakken en hoe korter ze op zich laten
       wachten. Allebei met een plafond: zonder dat is het na een minuut niet
       meer te doen en is de klok van 90 seconden zinloos. */
    const snelheid = Math.min(.30, .10 + t.score * .0016);
    const tussen = Math.max(330, 820 - t.score * 13);

    t.sindsSchot += ms;
    while (t.sindsSchot >= RU_SCHOT) {
      t.sindsSchot -= RU_SCHOT;
      t.kogels.push({ x: t.schip, y: RU_SCHIP_Y - .04 });
    }

    t.sindsSpawn += ms;
    while (t.sindsSpawn >= tussen) {
      t.sindsSpawn -= tussen;
      t.vijanden.push({ x: ruimteKolom(Math.floor(t.toeval() * RU_KOLOMMEN)),
                        y: -.05, soort: Math.floor(t.toeval() * 3) });
    }

    let rest = ms / 1000;
    while (rest > 0) {
      const dt = Math.min(rest, .008);
      rest -= dt;
      for (const k of t.kogels) k.y -= 1.15 * dt;
      for (const v of t.vijanden) v.y += snelheid * dt;

      for (let i = t.kogels.length - 1; i >= 0; i--) {
        const k = t.kogels[i];
        if (k.y < -.03) { t.kogels.splice(i, 1); continue; }
        const j = t.vijanden.findIndex(
          (v) => Math.abs(v.x - k.x) < RU_RAAK && Math.abs(v.y - k.y) < RU_RAAK);
        if (j >= 0) { t.vijanden.splice(j, 1); t.kogels.splice(i, 1); t.score++; }
      }
      /* Langs je schip is het einde. De grens ligt op de schiplijn zelf en niet
         onderaan het bord: anders zie je hem onder je door glippen en gebeurt
         er pas een halve seconde later iets. */
      if (t.vijanden.some((v) => v.y >= RU_SCHIP_Y)) return 'door';
    }
    return null;
  },
  teken(g, maat, kleur, t) {
    const kleuren = ['--teal', '--olijf', '--leisteen'];
    for (const v of t.vijanden) {
      g.fillStyle = kleur(kleuren[v.soort % kleuren.length]);
      rondVak(g, (v.x - .045) * maat, (v.y - .045) * maat, .09 * maat, .09 * maat, .025 * maat);
      /* Twee lichte stipjes, zodat je ziet welke kant de voorkant is en het
         geen los blokje blijft. */
      g.fillStyle = kleur('--bg');
      g.fillRect((v.x - .026) * maat, (v.y + .004) * maat, .016 * maat, .016 * maat);
      g.fillRect((v.x + .010) * maat, (v.y + .004) * maat, .016 * maat, .016 * maat);
    }
    g.fillStyle = kleur('--warm');
    for (const k of t.kogels)
      rondVak(g, (k.x - .008) * maat, (k.y - .03) * maat, .016 * maat, .06 * maat, .008 * maat);

    g.fillStyle = kleur('--accent-ink');
    g.beginPath();
    g.moveTo(t.schip * maat, (RU_SCHIP_Y - .055) * maat);
    g.lineTo((t.schip + .05) * maat, (RU_SCHIP_Y + .035) * maat);
    g.lineTo((t.schip - .05) * maat, (RU_SCHIP_Y + .035) * maat);
    g.closePath();
    g.fill();
  },
};

/* ---------- Lichtjes ----------
   Tik een lampje aan en hij gaat om, samen met zijn buren boven, onder, links
   en rechts. Alles uit en je hebt hem. Dan komt de volgende, een tikje lastiger.

   Twee dingen maken dit anders dan de rest, en daarom staat het erin: het is
   het enige spel zonder reflexen -- je mag erover nadenken zolang de klok loopt
   -- en het enige dat met tikken alleen te spelen is. Geen vegen, geen slepen.

   De puzzels worden gemaakt door vanaf alles-uit een aantal willekeurige tikken
   te geven. Daarmee is elke puzzel per definitie oplosbaar: dezelfde tikken in
   omgekeerde volgorde brengen hem terug. Een bord verzinnen en hopen dat het
   kan, werkt hier niet -- de helft van alle borden is onoplosbaar. */

const LI_VAK = 5;
const LI_START = 3;            /* aantal tikken waarmee de eerste puzzel is gemaakt */

function lichtTik(bord, x, y) {
  for (const [dx, dy] of [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]]) {
    const a = x + dx, b = y + dy;
    if (a >= 0 && b >= 0 && a < LI_VAK && b < LI_VAK) bord[b * LI_VAK + a] = !bord[b * LI_VAK + a];
  }
}

function lichtPuzzel(t) {
  t.bord = new Array(LI_VAK * LI_VAK).fill(false);
  const tikken = Math.min(12, LI_START + t.score);
  /* Een puzzel die per ongeluk al uit staat is geen puzzel: dan opnieuw. */
  for (let poging = 0; poging < 20; poging++) {
    for (let i = 0; i < tikken; i++)
      lichtTik(t.bord, Math.floor(t.toeval() * LI_VAK), Math.floor(t.toeval() * LI_VAK));
    if (t.bord.some(Boolean)) return;
  }
  t.bord[0] = true;
}

SPELLEN.lichtjes = {
  naam: 'Lichtjes', eenheid: ['puzzel', 'puzzels'],
  uitleg: 'Tik een lampje aan: hij gaat om, en zijn vier buren ook. Krijg ze '
        + 'allemaal uit, dan komt de volgende.',
  hint: 'Tik een lampje aan om te beginnen', mac: 'op de Mac: klikken',
  begin(toeval) {
    const t = { toeval, bord: [], score: 0 };
    lichtPuzzel(t);
    return t;
  },
  verder() { return null; },
  tik(t, fx, fy) {
    const x = Math.floor(fx * LI_VAK), y = Math.floor(fy * LI_VAK);
    if (x < 0 || y < 0 || x >= LI_VAK || y >= LI_VAK) return null;
    lichtTik(t.bord, x, y);
    if (!t.bord.some(Boolean)) { t.score++; lichtPuzzel(t); }
    return null;
  },
  teken(g, maat, kleur, t) {
    const vak = maat / LI_VAK;
    for (let y = 0; y < LI_VAK; y++) {
      for (let x = 0; x < LI_VAK; x++) {
        g.fillStyle = t.bord[y * LI_VAK + x] ? kleur('--warm') : kleur('--line');
        rondVak(g, x * vak + vak * .07, y * vak + vak * .07, vak * .86, vak * .86, vak * .22);
      }
    }
  },
};

/* ---------- 2048 ----------
   Vier bij vier; elke veeg schuift alles die kant op en twee gelijke tegels
   worden er één. De punten zijn de som van alle samenvoegingen, zoals in het
   origineel. Waar de nieuwe tegel komt, volgt de reeks van vandaag. */

function zet2048(t) {
  const leeg = [];
  t.bord.forEach((v, i) => { if (!v) leeg.push(i); });
  if (!leeg.length) return;
  const i = leeg[Math.floor(t.toeval() * leeg.length)];
  t.bord[i] = t.toeval() < .9 ? 2 : 4;
  t.nieuw = i;
}

/* De vier rijen (of kolommen) in de volgorde waarin ze schuiven: de eerste
   index is de kant waar de tegels naartoe gaan. */
function rijen2048(dx, dy) {
  const uit = [];
  for (let a = 0; a < 4; a++) {
    const rij = [];
    for (let b = 0; b < 4; b++) rij.push(dx ? a * 4 + b : b * 4 + a);
    uit.push((dx > 0 || dy > 0) ? rij.reverse() : rij);
  }
  return uit;
}

function kan2048(t) {
  for (let i = 0; i < 16; i++) {
    if (!t.bord[i]) return true;
    if (i % 4 < 3 && t.bord[i] === t.bord[i + 1]) return true;
    if (i < 12 && t.bord[i] === t.bord[i + 4]) return true;
  }
  return false;
}

SPELLEN['2048'] = {
  naam: '2048', eenheid: ['punt', 'punten'],
  uitleg: 'Veeg om alle tegels te schuiven. Twee gelijke tegels worden er één, en dat levert punten op.',
  hint: 'Veeg om te beginnen', mac: 'op de Mac: de pijltjestoetsen', eenPerVeeg: true,
  begin(toeval) {
    const t = { toeval, bord: new Array(16).fill(0), score: 0, nieuw: -1 };
    zet2048(t);
    zet2048(t);
    t.nieuw = -1;   /* het kadertje om de nieuwste tegel pas na je eerste zet */
    return t;
  },
  verder() { return null; },
  veeg(t, dx, dy) {
    let veranderd = false;
    for (const rij of rijen2048(dx, dy)) {
      const waarden = rij.map((i) => t.bord[i]).filter((v) => v);
      const nieuw = [];
      for (let k = 0; k < waarden.length; k++) {
        if (waarden[k] === waarden[k + 1]) {
          nieuw.push(waarden[k] * 2);
          t.score += waarden[k] * 2;
          k++;
        } else nieuw.push(waarden[k]);
      }
      rij.forEach((i, k) => {
        const v = nieuw[k] || 0;
        if (t.bord[i] !== v) { t.bord[i] = v; veranderd = true; }
      });
    }
    if (!veranderd) return null;
    zet2048(t);
    return kan2048(t) ? null : 'vast';
  },
  teken(g, maat, kleur, t) {
    const rand = maat * .03;
    const vak = (maat - rand * 5) / 4;
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    for (let i = 0; i < 16; i++) {
      const x = rand + (i % 4) * (vak + rand), y = rand + Math.floor(i / 4) * (vak + rand);
      const v = t.bord[i];
      g.fillStyle = kleur('--line');
      g.globalAlpha = .6;
      rondVak(g, x, y, vak, vak, vak * .1);
      if (!v) { g.globalAlpha = 1; continue; }
      /* Hoe hoger de tegel, hoe voller het groen; vanaf 256 wordt het warm,
         zodat een grote tegel eruit springt. */
      const stap = Math.log2(v);
      g.fillStyle = v >= 256 ? kleur('--warm') : kleur('--accent');
      g.globalAlpha = v >= 256 ? 1 : Math.min(1, .18 + stap * .11);
      rondVak(g, x, y, vak, vak, vak * .1);
      g.globalAlpha = 1;
      g.fillStyle = (v >= 256 || stap >= 6) ? kleur('--op-accent') : kleur('--ink');
      const cijfers = String(v).length;
      g.font = '600 ' + Math.round(vak * (cijfers <= 2 ? .42 : cijfers === 3 ? .34 : .27)) +
        'px ui-sans-serif, -apple-system, sans-serif';
      g.fillText(String(v), x + vak / 2, y + vak / 2 + vak * .02);
      if (i === t.nieuw) {
        g.strokeStyle = kleur('--accent-ink');
        g.lineWidth = maat * .006;
        g.strokeRect(x + vak * .06, y + vak * .06, vak * .88, vak * .88);
      }
    }
  },
};

/* ---------- Breakout ----------
   Alles in fracties van het bord (0 tot 1), dan maakt de schermgrootte niet
   uit. Het batje volgt je vinger, waar op het bord je ook bent: dan zit je duim
   niet voor de bal. Bal gemist is poging voorbij, net als een botsing bij
   Snake. Is de muur leeg, dan komt er een nieuwe. */

const BO_KOLOMMEN = 8, BO_RIJEN = 5;
const BO_BATJE_Y = .9, BO_BATJE_B = .2, BO_BATJE_H = .025, BO_BAL = .016;

function muurBreakout(t) {
  t.stenen = [];
  for (let r = 0; r < BO_RIJEN; r++)
    for (let k = 0; k < BO_KOLOMMEN; k++) {
      /* Een paar gaten en een paar stenen die twee keer geraakt moeten worden,
         elke dag op een andere plek. */
      if (t.toeval() < .12) continue;
      t.stenen.push({ k, r, sterk: t.toeval() < .18 ? 2 : 1 });
    }
}

function balOpnieuw(t) {
  const hoek = (t.toeval() - .5) * Math.PI / 3;
  t.bal = { x: t.batje, y: BO_BATJE_Y - .06, vx: Math.sin(hoek) * t.tempo, vy: -Math.cos(hoek) * t.tempo };
}

SPELLEN.breakout = {
  naam: 'Breakout', eenheid: ['steen', 'stenen'],
  uitleg: 'Het batje volgt je vinger. Kaats de bal tegen de stenen; mis je hem, dan is de poging voorbij.',
  hint: 'Raak het bord aan om te beginnen', mac: 'op de Mac: slepen, of de pijltjestoetsen',
  begin(toeval) {
    const t = { toeval, batje: .5, doel: .5, tempo: .6, score: 0, stenen: [], bal: null };
    muurBreakout(t);
    balOpnieuw(t);
    return t;
  },
  sleep(t, fx) { t.doel = fx; return null; },
  veeg(t, dx) { t.doel = Math.max(0, Math.min(1, t.doel + dx * .08)); return null; },
  verder(t, ms) {
    /* Het batje volgt de vinger meteen, maar niet buiten het bord. */
    const half = BO_BATJE_B / 2;
    t.batje = Math.max(half, Math.min(1 - half, t.doel));
    /* In stapjes van hooguit 4 ms, anders schiet een snelle bal door een steen. */
    let rest = ms / 1000;
    while (rest > 0) {
      const dt = Math.min(rest, .004);
      rest -= dt;
      const b = t.bal;
      const px = b.x, py = b.y;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      if (b.x < BO_BAL) { b.x = BO_BAL; b.vx = Math.abs(b.vx); }
      if (b.x > 1 - BO_BAL) { b.x = 1 - BO_BAL; b.vx = -Math.abs(b.vx); }
      if (b.y < BO_BAL) { b.y = BO_BAL; b.vy = Math.abs(b.vy); }
      /* Het batje: waar je raakt bepaalt de hoek, zoals in het origineel. Aan
         de rand kaatst hij schuin weg, in het midden recht omhoog. */
      if (b.vy > 0 && b.y + BO_BAL >= BO_BATJE_Y && py + BO_BAL <= BO_BATJE_Y + .01 &&
          Math.abs(b.x - t.batje) <= half + BO_BAL) {
        const waar = Math.max(-1, Math.min(1, (b.x - t.batje) / half));
        const hoek = waar * Math.PI / 3;
        t.tempo = Math.min(1.1, t.tempo + .012);
        b.vx = Math.sin(hoek) * t.tempo;
        b.vy = -Math.cos(hoek) * t.tempo;
        b.y = BO_BATJE_Y - BO_BAL;
      }
      if (b.y > 1 + BO_BAL) return 'mis';
      for (let i = 0; i < t.stenen.length; i++) {
        const s = t.stenen[i];
        const sx = s.k / BO_KOLOMMEN, sy = .1 + s.r * .05, sb = 1 / BO_KOLOMMEN, sh = .05;
        if (b.x + BO_BAL < sx || b.x - BO_BAL > sx + sb || b.y + BO_BAL < sy || b.y - BO_BAL > sy + sh) continue;
        /* Kwam hij van opzij, dan kaatst hij horizontaal terug, anders verticaal. */
        if (px + BO_BAL <= sx || px - BO_BAL >= sx + sb) b.vx = -b.vx;
        else b.vy = -b.vy;
        b.x = px; b.y = py;
        s.sterk--;
        if (!s.sterk) { t.stenen.splice(i, 1); t.score++; }
        break;
      }
      if (!t.stenen.length) { muurBreakout(t); }
    }
    return null;
  },
  teken(g, maat, kleur, t) {
    const kleuren = ['--teal', '--accent', '--olijf', '--leisteen', '--accent-ink'];
    for (const s of t.stenen) {
      g.fillStyle = s.sterk > 1 ? kleur('--warm') : kleur(kleuren[s.r % kleuren.length]);
      rondVak(g, (s.k / BO_KOLOMMEN) * maat + maat * .004, (.1 + s.r * .05) * maat + maat * .004,
              maat / BO_KOLOMMEN - maat * .008, .05 * maat - maat * .008, maat * .008);
    }
    g.fillStyle = kleur('--accent-ink');
    rondVak(g, (t.batje - BO_BATJE_B / 2) * maat, BO_BATJE_Y * maat, BO_BATJE_B * maat,
            BO_BATJE_H * maat, BO_BATJE_H * maat / 2);
    g.fillStyle = kleur('--ink');
    g.beginPath();
    g.arc(t.bal.x * maat, t.bal.y * maat, BO_BAL * maat, 0, Math.PI * 2);
    g.fill();
  },
};

/* ---------- Frogger ----------
   Elf bij elf. Onderaan begin je, bovenaan is de overkant. Daartussen vier
   rijstroken, een veilige berm en vier rijen water met boomstammen. In het
   water moet je op een stam staan; die neemt je mee, en drijf je het bord af,
   dan lig je erin. Elke keer dat je overkomt, gaat alles iets sneller.

   De rijen (snelheid, lengte van auto's en stammen, de gaten ertussen) komen uit
   de reeks van vandaag. */

const FR_N = 11;
const FR_WATER = [1, 2, 3, 4], FR_WEG = [6, 7, 8, 9];

function froggerRij(toeval, rij, water) {
  const richting = rij % 2 ? 1 : -1;
  const snelheid = (water ? .7 : .9) + toeval() * (water ? .9 : 1.4);
  const dingen = [];
  let x = 0;
  const aantal = water ? 3 : 2 + Math.floor(toeval() * 2);
  for (let i = 0; i < aantal; i++) {
    const lengte = water ? 2 + Math.floor(toeval() * 3) : 1 + Math.floor(toeval() * 2);
    dingen.push({ x, lengte });
    /* Op het water niet te veel gat, anders is er geen doorkomen aan. */
    x += lengte + (water ? 1.5 + toeval() * 2 : 2.5 + toeval() * 3);
  }
  return { rij, water, richting, snelheid, dingen, rond: Math.max(FR_N + 3, x), schuif: 0 };
}

function froggerPlek(rijdata, ding) {
  const x = (ding.x + rijdata.schuif) % rijdata.rond;
  return (x < 0 ? x + rijdata.rond : x) - 2;
}

function froggerTempo(t) { return 1 + t.score * .15; }

/* Staat de kikker goed? Op de weg mag niets hem raken; op het water moet er
   een stam onder hem liggen. */
function froggerCheck(t) {
  const r = t.rijen[t.y];
  if (!r) return null;
  const midden = t.x + .5;
  const onder = r.dingen.find((d) => {
    const x = froggerPlek(r, d);
    return r.water ? (midden >= x && midden <= x + d.lengte)
                   : (midden + .32 > x && midden - .32 < x + d.lengte);
  });
  if (r.water) {
    if (!onder || t.x < -.45 || t.x > FR_N - .55) { t.dood = true; return 'nat'; }
  } else if (onder) { t.dood = true; return 'bots'; }
  return null;
}

SPELLEN.frogger = {
  naam: 'Frogger', eenheid: ['oversteek', 'oversteken'],
  uitleg: 'Tik om een sprong vooruit te maken, veeg voor opzij of terug. Ontwijk de auto’s en spring op de stammen.',
  hint: 'Tik of veeg om te beginnen', mac: 'op de Mac: de pijltjestoetsen', eenPerVeeg: true,
  begin(toeval) {
    const rijen = {};
    for (const r of FR_WATER) rijen[r] = froggerRij(toeval, r, true);
    for (const r of FR_WEG) rijen[r] = froggerRij(toeval, r, false);
    /* Bij de start staat er niets recht voor je neus: de eerste sprong mag niet
       meteen onder een auto eindigen voordat je hebt kunnen kijken. */
    const eerste = rijen[FR_WEG[FR_WEG.length - 1]];
    for (let i = 0; i < 40 && eerste.dingen.some((d) => {
      const x = froggerPlek(eerste, d);
      return x < 6.7 && x + d.lengte > 4.3;
    }); i++) eerste.schuif += .5;
    return { toeval, rijen, x: 5, y: FR_N - 1, score: 0, dood: false };
  },
  verder(t, ms) {
    const dt = ms / 1000 * froggerTempo(t);
    for (const r of Object.values(t.rijen)) {
      r.schuif = (r.schuif + r.richting * r.snelheid * dt) % r.rond;
      if (r.rij === t.y && r.water) t.x += r.richting * r.snelheid * dt;
    }
    return froggerCheck(t);
  },
  veeg(t, dx, dy) {
    /* Bij een sprong omhoog of omlaag recht op een vakje landen, ook als de
       stam je net een half vakje had meegenomen. */
    if (dy) t.x = Math.round(t.x);
    t.x = Math.max(0, Math.min(FR_N - 1, t.x + dx));
    t.y = Math.max(0, Math.min(FR_N - 1, t.y + dy));
    if (t.y === 0) {
      t.score++;
      t.x = 5;
      t.y = FR_N - 1;
      return null;
    }
    return froggerCheck(t);
  },
  tik(t) { return this.veeg(t, 0, -1); },
  teken(g, maat, kleur, t) {
    const vak = maat / FR_N;
    for (let r = 0; r < FR_N; r++) {
      const rij = t.rijen[r];
      if (r === 0) { g.fillStyle = kleur('--accent'); g.globalAlpha = .25; }
      else if (rij && rij.water) { g.fillStyle = kleur('--teal'); g.globalAlpha = .3; }
      else if (rij) { g.fillStyle = kleur('--ink-3'); g.globalAlpha = .16; }
      else { g.fillStyle = kleur('--line'); g.globalAlpha = .5; }
      g.fillRect(0, r * vak, maat, vak);
      g.globalAlpha = 1;
      if (!rij) continue;
      /* Stammen in het grijsbruin, auto's warm, en de kikker als enige groen:
         dan zie je hem ook staan als hij op een stam zit. */
      g.fillStyle = rij.water ? kleur('--ink-3') : kleur('--warm');
      for (const d of rij.dingen) {
        const x = froggerPlek(rij, d);
        rondVak(g, x * vak + vak * .05, r * vak + vak * (rij.water ? .14 : .18),
                d.lengte * vak - vak * .1, vak * (rij.water ? .72 : .64), vak * .2);
      }
    }
    g.fillStyle = kleur('--accent-ink');
    rondVak(g, t.x * vak + vak * .14, t.y * vak + vak * .14, vak * .72, vak * .72, vak * .3);
    if (t.dood) {
      g.strokeStyle = kleur('--ink');
      g.lineWidth = vak * .1;
      g.beginPath();
      g.arc((t.x + .5) * vak, (t.y + .5) * vak, vak * .48, 0, Math.PI * 2);
      g.stroke();
    }
    g.fillStyle = kleur('--panel');
    for (const ox of [.36, .64]) {
      g.beginPath();
      g.arc((t.x + ox) * vak, (t.y + .36) * vak, vak * .08, 0, Math.PI * 2);
      g.fill();
    }
  },
};

/* ---------- Tetris ----------
   Tien breed, twintig hoog, in het midden van het bord; rechts staat het
   volgende blok. Tik om te draaien, veeg opzij om te schuiven en omlaag om te
   laten zakken. De blokken komen in zakjes van zeven, zoals in het echte spel:
   zo komen er nooit vijf keer achter elkaar dezelfde, en de volgorde van
   vandaag is voor alle drie de pogingen gelijk. */

const TE_B = 10, TE_H = 20;
const TE_VORMEN = {
  I: [4, [[0, 1], [1, 1], [2, 1], [3, 1]]],
  O: [2, [[0, 0], [1, 0], [0, 1], [1, 1]]],
  T: [3, [[1, 0], [0, 1], [1, 1], [2, 1]]],
  S: [3, [[1, 0], [2, 0], [0, 1], [1, 1]]],
  Z: [3, [[0, 0], [1, 0], [1, 1], [2, 1]]],
  J: [3, [[0, 0], [0, 1], [1, 1], [2, 1]]],
  L: [3, [[2, 0], [0, 1], [1, 1], [2, 1]]],
};
const TE_KLEUR = { I: '--teal', O: '--warm', T: '--leisteen', S: '--accent', Z: '--olijf',
                   J: '--accent-ink', L: '--ink-3' };

function tetrisVolgende(t) {
  if (!t.zak.length) {
    const z = Object.keys(TE_VORMEN);
    for (let i = z.length - 1; i > 0; i--) {
      const j = Math.floor(t.toeval() * (i + 1));
      [z[i], z[j]] = [z[j], z[i]];
    }
    t.zak = z;
  }
  return t.zak.shift();
}

function tetrisPast(t, cellen, x, y) {
  return cellen.every(([cx, cy]) => {
    const px = x + cx, py = y + cy;
    return px >= 0 && px < TE_B && py < TE_H && (py < 0 || !t.bord[py][px]);
  });
}

function tetrisNieuw(t) {
  const soort = t.straks;
  t.straks = tetrisVolgende(t);
  const [n, cellen] = TE_VORMEN[soort];
  t.blok = { soort, n, cellen: cellen.map((c) => c.slice()), x: Math.floor((TE_B - n) / 2), y: 0 };
  return tetrisPast(t, t.blok.cellen, t.blok.x, t.blok.y) ? null : 'vol';
}

function tetrisSchuif(t, dx, dy) {
  const b = t.blok;
  if (!tetrisPast(t, b.cellen, b.x + dx, b.y + dy)) return false;
  b.x += dx;
  b.y += dy;
  return true;
}

/* Het blok ligt vast: in het bord zetten, volle rijen weghalen, en het volgende. */
function tetrisVast(t) {
  const b = t.blok;
  for (const [cx, cy] of b.cellen) if (b.y + cy >= 0) t.bord[b.y + cy][b.x + cx] = b.soort;
  const over = t.bord.filter((rij) => rij.some((v) => !v));
  const weg = TE_H - over.length;
  while (over.length < TE_H) over.unshift(new Array(TE_B).fill(null));
  t.bord = over;
  t.score += weg;
  return tetrisNieuw(t);
}

SPELLEN.tetris = {
  naam: 'Tetris', eenheid: ['lijn', 'lijnen'],
  uitleg: 'Tik om te draaien, veeg opzij om te schuiven en omlaag om te laten zakken. Elke volle rij telt.',
  hint: 'Tik of veeg om te beginnen', mac: 'op de Mac: pijltjes, en omhoog draait', drempel: 22,
  /* Hoger dan breed: in een vierkant werden de blokjes op een telefoon te klein
     om goed te zien in welke kolom je zit. */
  verhouding: 1.3,
  /* Tweeënhalve minuut in plaats van anderhalve, op Gerts verzoek. Dit is het
     enige spel waarin de eerste minuut vooral opbouwen is: je hebt een stapel
     nodig voordat er rijen vol raken, en bij 90 seconden was de klok op
     ongeveer het moment dat het interessant werd. De andere spellen scoren
     vanaf de eerste seconde en blijven daarom op 90. */
  duur: 150,
  begin(toeval) {
    const t = { toeval, bord: [], zak: [], straks: null, blok: null, score: 0, opgespaard: 0 };
    for (let r = 0; r < TE_H; r++) t.bord.push(new Array(TE_B).fill(null));
    t.straks = tetrisVolgende(t);
    tetrisNieuw(t);
    return t;
  },
  verder(t, ms) {
    /* Elke tien lijnen iets sneller, maar nooit sneller dan acht rijen per
       seconde: het moet met een duim te doen blijven. */
    const val = Math.max(120, 650 - t.score * 20);
    t.opgespaard += ms;
    while (t.opgespaard >= val) {
      t.opgespaard -= val;
      if (!tetrisSchuif(t, 0, 1)) {
        const einde = tetrisVast(t);
        if (einde) return einde;
      }
    }
    return null;
  },
  veeg(t, dx, dy) {
    if (dy < 0) return this.tik(t);
    if (dy > 0) { if (tetrisSchuif(t, 0, 1)) t.opgespaard = 0; return null; }
    tetrisSchuif(t, dx, 0);
    return null;
  },
  /* Draaien met de klok mee. Past het niet, dan een stapje opzij proberen —
     anders draait een blok tegen de wand nooit. */
  tik(t) {
    const b = t.blok;
    if (b.soort === 'O') return null;
    const gedraaid = b.cellen.map(([x, y]) => [b.n - 1 - y, x]);
    for (const opzij of [0, -1, 1, -2, 2]) {
      if (tetrisPast(t, gedraaid, b.x + opzij, b.y)) {
        b.cellen = gedraaid;
        b.x += opzij;
        break;
      }
    }
    return null;
  },
  teken(g, maat, kleur, t) {
    const hoog = g.canvas.height;
    const vak = hoog / TE_H;
    const x0 = (maat - TE_B * vak) / 2 - vak;   /* iets naar links: rechts staat "straks" */
    g.fillStyle = kleur('--panel');
    g.fillRect(x0, 0, TE_B * vak, hoog);
    g.strokeStyle = kleur('--line-2');
    g.lineWidth = Math.max(1, maat * .003);
    g.strokeRect(x0, 0, TE_B * vak, hoog);
    const blokje = (x, y, soort, alfa) => {
      g.fillStyle = kleur(TE_KLEUR[soort]);
      g.globalAlpha = alfa;
      rondVak(g, x0 + x * vak + vak * .06, y * vak + vak * .06, vak * .88, vak * .88, vak * .18);
      g.globalAlpha = 1;
    };
    t.bord.forEach((rij, y) => rij.forEach((v, x) => { if (v) blokje(x, y, v, 1); }));
    if (t.blok) {
      /* Een schaduw op de plek waar het blok zou landen: op een telefoon zie je
         anders moeilijk in welke kolom je zit. */
      const b = t.blok;
      let val = 0;
      while (tetrisPast(t, b.cellen, b.x, b.y + val + 1)) val++;
      for (const [cx, cy] of b.cellen) if (b.y + cy + val >= 0) blokje(b.x + cx, b.y + cy + val, b.soort, .22);
      for (const [cx, cy] of b.cellen) if (b.y + cy >= 0) blokje(b.x + cx, b.y + cy, b.soort, 1);
    }
    if (t.straks) {
      const [, cellen] = TE_VORMEN[t.straks];
      const klein = vak * .6;
      const sx = x0 + TE_B * vak + vak * .7, sy = vak * 1.6;
      g.fillStyle = kleur('--ink-3');
      g.font = Math.round(vak * .6) + 'px ui-sans-serif, -apple-system, sans-serif';
      g.textAlign = 'left';
      g.textBaseline = 'alphabetic';
      g.fillText('straks', sx, vak * 1.1);
      g.fillStyle = kleur(TE_KLEUR[t.straks]);
      for (const [cx, cy] of cellen) rondVak(g, sx + cx * klein, sy + cy * klein, klein * .88, klein * .88, klein * .18);
    }
  },
};

/* ---------- tekenen van het scherm ---------- */

/* Alleen de getallen en de melding; de rest van het scherm blijft staan, want
   dit gebeurt zestig keer per seconde. */
function werkStandBij() {
  const score = document.getElementById('spel-score');
  const klok = document.getElementById('spel-klok');
  const melding = document.getElementById('spel-melding');
  if (!score) return;
  const welk = spel ? spel.welk : spelVanVandaag();
  const info = SPELLEN[welk];
  const over = spel ? Math.ceil(spel.over / 1000) : SPEL_DUUR;
  score.textContent = spel ? spel.t.score : '–';
  klok.querySelector('b').textContent = klokje(over);
  klok.classList.toggle('krap', !!spel && !spel.klaar && over <= 15);

  let tekst = '', onder = '';
  const s = spelDag(vandaag());
  const gebruikt = s ? s.scores.length : 0;
  if (!spel) {
    if (gebruikt >= SPEL_POGINGEN) { tekst = 'Klaar voor vandaag'; onder = 'Morgen weer'; }
    else { tekst = info.uitleg; }
  } else if (spel.klaar) {
    tekst = (SPEL_EINDE[spel.reden] ? SPEL_EINDE[spel.reden] + ' ' : '') + scoreTekst(welk, spel.t.score);
  } else if (!spel.gestart) {
    tekst = info.hint; onder = info.mac;
  } else if (spel.pauze) {
    tekst = 'Even stil'; onder = 'tik of veeg om verder te gaan';
  }
  const span = melding.firstChild;
  if (span.dataset.tekst !== tekst + onder) {
    span.dataset.tekst = tekst + onder;
    span.textContent = tekst;
    if (onder) span.append(el('small', { tekst: onder }));
  }
}

function tekenSpel() {
  const doel = document.getElementById('tab-spel');
  const datum = vandaag();
  if (spel && spel.datum !== datum) spel = null;
  const s = spelDag(datum);
  const welk = spelVanVandaag();
  const info = SPELLEN[welk];
  const scores = s ? s.scores : [];
  const bezig = !!spel && !spel.klaar;
  const op = scores.length >= SPEL_POGINGEN && !bezig;

  const kop = el('div', { class: 'briefkop' }, [
    el('h1', { tekst: info.naam }),
    el('div', { class: 'datum', tekst: op ? 'Klaar voor vandaag — morgen ' + SPELLEN[spelVan(plusDagen(datum, 1))].naam
      : 'Drie pogingen van ' + duurTekst(welk) + '; de beste telt' }),
  ]);

  const pogingNr = bezig ? spel.nr + 1 : Math.min(scores.length + (op ? 0 : 1), SPEL_POGINGEN);
  const stand = el('div', { class: 'spelstand' }, [
    el('span', null, [document.createTextNode('Poging '), el('b', { tekst: pogingNr + '/' + SPEL_POGINGEN })]),
    el('span', null, [document.createTextNode('· '), el('b', { id: 'spel-score', tekst: '–' })]),
    el('span', { class: 'klok', id: 'spel-klok' }, [el('b', { tekst: klokje(SPEL_DUUR) })]),
  ]);

  const bord = el('canvas', { class: 'spelbord', id: 'spelbord',
    style: info.verhouding ? 'aspect-ratio: 1 / ' + info.verhouding : null });
  /* Vegen met de vinger, of slepen met de muis. Al na een paar vakjes breedte
     telt het als een veeg, en daarna begint de meting opnieuw: zo kun je in één
     beweging twee bochten maken, of een Tetris-blok drie kolommen opschuiven.
     Bij 2048 en Frogger telt één veeg één keer — één veeg is daar één zet.
     Wie alleen tikt zonder te vegen, doet een tik. */
  let veeg = null;
  /* Welke kant een beweging op wijst. De as die het duidelijkst wint telt;
     bij een schuine haal waar niets duidelijk wint gebeurt er niets, want dan
     raden we en is raden fout -- in Snake is een verkeerde bocht de dood. */
  const stuurVeeg = (dx, dy) => {
    if (Math.abs(dx) > Math.abs(dy) * 1.3) invoer('veeg', Math.sign(dx), 0);
    else if (Math.abs(dy) > Math.abs(dx) * 1.3) invoer('veeg', 0, Math.sign(dy));
  };

  const opBord = (e) => {
    const r = bord.getBoundingClientRect();
    return (e.clientX - r.left) / r.width;
  };
  /* Een tik geeft ook de hoogte door. Breakout en Ruimtewacht hebben genoeg
     aan de x (hun batje of schip staat op een vaste regel), maar Lichtjes moet
     weten wélk lampje je raakte. Spellen die er niets mee doen negeren het. */
  const opBordY = (e) => {
    const r = bord.getBoundingClientRect();
    return (e.clientY - r.top) / r.height;
  };
  bord.addEventListener('pointerdown', (e) => {
    veeg = { x: e.clientX, y: e.clientY, bewogen: false, gedaan: false };
    try { bord.setPointerCapture(e.pointerId); } catch (_) {}
    if (spel && SPELLEN[spel.welk].sleep) invoer('sleep', opBord(e));
    e.preventDefault();
  });
  bord.addEventListener('pointermove', (e) => {
    if (!veeg || !spel) return;
    const info = SPELLEN[spel.welk];
    if (info.sleep) { invoer('sleep', opBord(e)); veeg.bewogen = true; return; }
    const dx = e.clientX - veeg.x, dy = e.clientY - veeg.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) > 10) veeg.bewogen = true;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < (info.drempel || 18)) return;
    if (info.eenPerVeeg && veeg.gedaan) return;
    stuurVeeg(dx, dy);
    veeg.x = e.clientX;
    veeg.y = e.clientY;
    veeg.gedaan = true;
  });
  bord.addEventListener('pointerup', (e) => {
    if (veeg && spel && !SPELLEN[spel.welk].sleep) {
      if (!veeg.bewogen) invoer('tik', opBord(e), opBordY(e));
      /* Een korte, snelle flik viel tussen wal en schip: meer dan 10 pixels, dus
         geen tik, maar minder dan 18, dus ook geen veeg. Je beweging verdween
         dan gewoon. Bij Tetris merk je dat nauwelijks -- het blok schuift niet
         en je veegt opnieuw -- maar bij Snake rijd je ondertussen de muur in, en
         dat is precies wat er niet lekker aan voelde.

         Dus telt een gebaar dat eindigt zonder dat er iets gebeurde alsnog als
         één veeg, zolang hij maar ergens heen wees (8 pixels). Niet lager: dan
         wordt elke onvaste tik een veeg. */
      else if (!veeg.gedaan) {
        const dx = e.clientX - veeg.x, dy = e.clientY - veeg.y;
        if (Math.max(Math.abs(dx), Math.abs(dy)) >= 8) stuurVeeg(dx, dy);
      }
    }
    veeg = null;
  });
  bord.addEventListener('pointercancel', () => { veeg = null; });

  const vak = el('div', { class: 'spelbordvak' }, [
    bord, el('div', { class: 'spelmelding', id: 'spel-melding' }, [el('span')]),
  ]);

  const na = el('div', { class: 'spelna' });
  if (!bezig && !op) {
    if (spel && spel.klaar) {
      na.append(el('p', { tekst: 'Poging ' + (spel.nr + 1) + ': ' + scoreTekst(welk, spel.t.score) +
        ' — nog ' + (SPEL_POGINGEN - scores.length) + ' te gaan.' }));
    }
    na.append(el('button', {
      class: 'btn primair',
      tekst: scores.length ? 'Poging ' + (scores.length + 1) + ' starten' : 'Starten',
      onclick: startPoging,
    }));
  }

  const overzicht = el('div', { class: 'spelscores' });
  if (scores.length) {
    const beste = besteVan(scores);
    const eerder = spelRecord(welk, datum);
    const lijst = el('ul');
    scores.forEach((n, i) => {
      const loopt = bezig && i === spel.nr;
      lijst.append(el('li', null, [
        el('span', { tekst: 'Poging ' + (i + 1) }),
        el('b', { tekst: loopt ? 'bezig…' : scoreTekst(welk, n) }),
      ]));
    });
    overzicht.append(el('h3', { tekst: 'Vandaag' }), lijst);
    if (!bezig && beste > 0 && (!eerder || beste > eerder.score)) {
      overzicht.append(el('p', { class: 'record', tekst: eerder
        ? '★ Nieuw record — het was ' + eerder.score + ', op ' + korteDatum(eerder.datum)
        : '★ Je eerste score, en dus meteen het record' }));
    }
  }
  /* Alleen eerdere dagen: wat vandaag gebeurt staat er al boven. */
  const record = spelRecord(welk, datum);
  const eerdere = spelHistorie(welk, 6).filter((h) => h.datum !== datum).slice(0, 5);
  if (record || eerdere.length) {
    const lijst = el('ul');
    if (record) lijst.append(el('li', { class: 'record' }, [
      el('span', { tekst: '★ Record, ' + korteDatum(record.datum) }),
      el('b', { tekst: scoreTekst(welk, record.score) }),
    ]));
    for (const h of eerdere) lijst.append(el('li', null, [
      el('span', { tekst: langeDatum(h.datum) }),
      el('b', { tekst: scoreTekst(welk, h.score) }),
    ]));
    overzicht.append(el('h3', { tekst: 'Eerder', style: scores.length ? 'margin-top:14px' : null }), lijst);
  }

  const vakje = el('div', { class: 'spelvak' },
    [stand, vak, na, overzicht.childNodes.length ? overzicht : null]);
  doel.replaceChildren(kop, vakje);
  werkStandBij();
  /* Het scherm is op dit moment nog verborgen (tekenAlles haalt `hidden` er pas
     daarna af), dus het bord heeft nog geen breedte. Een beeldje later wel. */
  requestAnimationFrame(tekenBord);
}

window.addEventListener('resize', () => { if (ui.tab === 'spel') tekenBord(); });

document.addEventListener('keydown', (e) => {
  if (ui.tab !== 'spel' || !spel || spel.klaar) return;
  if (e.key === ' ') { e.preventDefault(); invoer('tik'); return; }
  const r = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
              w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0] }[e.key];
  if (!r) return;
  e.preventDefault();
  invoer('veeg', r[0], r[1]);
});

/* Telefoon weggelegd of een gesprek binnen: dan staat de klok stil. Bewust
   wegtikken naar een ander scherm in de app is wél het einde van de poging. */
document.addEventListener('visibilitychange', () => {
  if (document.hidden && spel && spel.gestart && !spel.klaar) spel.pauze = true;
});

/* ===================================================================
   Opstarten
   =================================================================== */

function tekenAlles() {
  if (ui.tab !== 'spel' && spel && !spel.klaar) eindPoging('weg');
  document.getElementById('vandaag-tekst').textContent = langeDatum(vandaag());
  document.body.dataset.scherm = ui.tab;
  if (ui.tab === 'start') tekenStart();
  if (ui.tab === 'briefing') tekenBriefing();
  if (ui.tab === 'training') tekenTraining();
  if (ui.tab === 'spel') tekenSpel();
  if (ui.tab === 'vandaag') tekenVandaag();
  if (ui.tab === 'terugblik') tekenTerugblik();
  if (ui.tab === 'instellingen') tekenInstellingen();
  for (const knop of document.querySelectorAll('.tabs button')) {
    const aan = knop.dataset.tab === ui.tab;
    knop.setAttribute('aria-selected', aan ? 'true' : 'false');
  }
  document.getElementById('tab-start').hidden = ui.tab !== 'start';
  document.getElementById('tab-briefing').hidden = ui.tab !== 'briefing';
  document.getElementById('tab-training').hidden = ui.tab !== 'training';
  document.getElementById('tab-spel').hidden = ui.tab !== 'spel';
  document.getElementById('tab-vandaag').hidden = ui.tab !== 'vandaag';
  document.getElementById('tab-terugblik').hidden = ui.tab !== 'terugblik';
  document.getElementById('tab-instellingen').hidden = ui.tab !== 'instellingen';
}

document.getElementById('naar-start').addEventListener('click', () => {
  ui.tab = 'start';
  tekenAlles();
  window.scrollTo(0, 0);
});

for (const knop of document.querySelectorAll('.tabs button')) {
  knop.addEventListener('click', () => {
    ui.tab = knop.dataset.tab;
    ui.bewerkt = null;
    tekenAlles();
    window.scrollTo(0, 0);
  });
}

/* Ligt de telefoon een nacht op tafel met de app open, dan moet hij bij het
   oppakken de nieuwe dag tonen en niet die van gisteren. */
let getekendOp = null;
function controleerDag() {
  const nu = vandaag();
  if (getekendOp !== nu) {
    getekendOp = nu;
    rolDoor();
    tekenAlles();
    haalBriefing();   /* nieuwe dag: ook een nieuwe briefing proberen */
  }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) controleerDag(); });
window.addEventListener('focus', controleerDag);
setInterval(controleerDag, 60000);

laad();
rolDoor();
getekendOp = vandaag();
tekenAlles();

haalBriefing();

if (!opslagWerkt) zeg('Let op: deze browser bewaart niets');

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
