<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dagstart — de ochtendbriefing en je eigen lijst</title>
<meta name="theme-color" content="#2d6b2d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dagstart">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icoon-180.png">
<link rel="icon" type="image/png" href="icoon-192.png">
<style>
  :root {
    /* Gert's natuurstijl: bosgroen op perkament, dezelfde kleuren als zijn
       reis-PDF's. Crème in plaats van wit, omdat een wit scherm om half zeven
       's ochtends te hard is. */
    --bg: #f2ede1;
    --panel: #fbf9f3;
    --panel-2: #f5f1e8;
    --ink: #1a1a1a;
    --ink-2: #5a5848;
    --ink-3: #8a8674;
    --line: #ddd7c6;
    --line-2: #cdc9b8;
    --accent: #2d6b2d;        /* bosgroen */
    --accent-ink: #1f4d1f;
    --accent-zacht: #e4ecdf;
    --op-accent: #ffffff;   /* tekst bovenop het accent */
    --warm: #c47a18;
    --warm-zacht: #f7edd9;
    /* Streepkleuren per blok, zodat je in één oogopslag ziet waar je bent. */
    --teal: #1a5a46;
    --olijf: #6b7a25;
    --leisteen: #4a6858;
    --serif: Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(30,28,24,.06), 0 4px 14px rgba(30,28,24,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161a15; --panel: #1e241c; --panel-2: #252b22;
      --ink: #eef0e8; --ink-2: #b4b8a6; --ink-3: #888b7c;
      --line: #323a2f; --line-2: #44503f;
      --accent: #7fb069; --accent-ink: #9cc98a; --accent-zacht: #24301f;
      --op-accent: #161a15;
      --warm: #e0a94f; --warm-zacht: #352d16;
      --teal: #5f9e86; --olijf: #a3b35c; --leisteen: #7d9a89;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"] {
      --bg: #161a15; --panel: #1e241c; --panel-2: #252b22;
      --ink: #eef0e8; --ink-2: #b4b8a6; --ink-3: #888b7c;
      --line: #323a2f; --line-2: #44503f;
      --accent: #7fb069; --accent-ink: #9cc98a; --accent-zacht: #24301f;
      --op-accent: #161a15;
      --warm: #e0a94f; --warm-zacht: #352d16;
      --teal: #5f9e86; --olijf: #a3b35c; --leisteen: #7d9a89;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }
  h1, h2, h3 { margin: 0; font-weight: 650; letter-spacing: -.01em; }
  /* Koppen in een schreefletter: dat is wat Gert's PDF's ook doen, en het
     scheelt genoeg van de lopende tekst om een blok herkenbaar te maken. */
  h1, h2, h3, .brand b, .startkaart h2 { font-family: var(--serif); font-weight: 600; }
  button, input, select { font: inherit; color: inherit; }
  button { -webkit-tap-highlight-color: transparent; }

  header.app { position: sticky; top: 0; z-index: 30; background: var(--panel); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top); }
  .bar { max-width: 720px; margin: 0 auto; padding: 9px 14px; display: flex; align-items: center; gap: 10px; }
  .brand { display: flex; align-items: baseline; gap: 8px; margin-right: auto; min-width: 0; }
  .brand b { font-size: 19px; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; }
  .brand span { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* op een smalle telefoon staat de datum toch al boven het eerste blok */
  @media (max-width: 520px) { .brand span { display: none; } }
  .tabs { display: flex; gap: 2px; background: var(--panel-2); padding: 3px; border-radius: 9px; border: 1px solid var(--line); }
  .tabs button { border: 0; background: transparent; color: var(--ink-2); padding: 7px 11px; border-radius: 7px; cursor: pointer; font-weight: 550; font-size: 14px; white-space: nowrap; }
  .tabs button[aria-selected="true"] { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }

  main { max-width: 720px; margin: 0 auto; padding: 14px 14px calc(40px + env(safe-area-inset-bottom)); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 14px; overflow: hidden; }
  .kop { display: flex; align-items: baseline; gap: 9px; padding: 12px 14px 0; }
  .kop h2 { font-size: 15.5px; }
  .kop .bij { font-size: 12.5px; color: var(--ink-3); margin-left: auto; }
  .body { padding: 12px 14px 14px; }

  /* --- vinkjes van vandaag --- */
  .tegels { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .tegel { display: flex; align-items: center; gap: 9px; padding: 12px 12px; border: 1px solid var(--line-2); background: var(--panel-2); border-radius: 10px; cursor: pointer; text-align: left; font-size: 15px; font-weight: 550; color: var(--ink-2); }
  .tegel .bol { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line-2); flex: none; }
  .tegel[aria-pressed="true"] { background: var(--accent-zacht); border-color: var(--accent); color: var(--accent-ink); }
  .tegel[aria-pressed="true"] .bol { background: var(--accent); border-color: var(--accent); box-shadow: inset 0 0 0 3px var(--accent-zacht); }

  .rij-titel { font-size: 12.5px; color: var(--ink-3); margin: 16px 0 7px; }
  .keuze { display: flex; gap: 6px; }
  .keuze button { flex: 1; padding: 11px 4px; border: 1px solid var(--line-2); background: var(--panel-2); border-radius: 10px; cursor: pointer; font-size: 13.5px; font-weight: 550; color: var(--ink-2); white-space: nowrap; }
  .keuze button[aria-pressed="true"] { background: var(--accent-zacht); border-color: var(--accent); color: var(--accent-ink); }
  .keuze button.let[aria-pressed="true"] { background: var(--warm-zacht); border-color: var(--warm); color: var(--warm); }

  /* --- afvalkalender --- */
  .afval-nu { font-size: 16px; font-weight: 600; }
  .afval-nu.straks { color: var(--accent-ink); }
  .afval-bij { font-size: 13.5px; color: var(--ink-3); margin-top: 3px; }
  .afval-lijst { list-style: none; margin: 12px 0 0; padding: 12px 0 0; border-top: 1px solid var(--line); }
  .afval-lijst li { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; color: var(--ink-2); padding: 4px 0; }
  .afval-lijst .wanneer { color: var(--ink-3); }

  .stil { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
  .stil span { font-size: 13.5px; color: var(--ink-3); }
  .schakel { padding: 7px 12px; border: 1px solid var(--line-2); background: var(--panel-2); border-radius: 20px; cursor: pointer; font-size: 13.5px; color: var(--ink-2); white-space: nowrap; flex: none; }
  .schakel[aria-pressed="true"] { background: var(--warm-zacht); border-color: var(--warm); color: var(--warm); }

  /* --- weekvoortgang --- */
  .week { list-style: none; margin: 0; padding: 0; }
  .week li { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .week li:last-child { border-bottom: 0; }
  .week .naam { font-size: 14.5px; color: var(--ink-2); flex: 1; min-width: 0; }
  .stippen { display: flex; gap: 4px; flex: none; }
  .stip { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--line-2); }
  /* De maandchallenge. Eigen, kleinere stippen: er staan er eenentwintig op een
     rij en die moeten op een telefoon naast elkaar passen. */
  .uitdaging .stippen { flex-wrap: wrap; gap: 5px; margin: 10px 0 2px; }
  .uitdaging .stip { width: 9px; height: 9px; }
  .uitdaging .groot { font-size: 26px; font-weight: 650; line-height: 1.1; }
  .uitdaging .groot small { font-size: 15px; font-weight: 400; color: var(--ink-3); }
  .uitdaging .regel { margin-top: 8px; font-size: 14px; }
  .uitdaging .achter { color: var(--warm); }
  .meting { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  .meting label { flex: 1 1 110px; font-size: 13px; color: var(--ink-3); }
  .meting input { width: 100%; margin-top: 4px; padding: 9px 10px; font: inherit;
                  font-size: 16px; border: 1px solid var(--line-2); border-radius: 8px;
                  background: var(--vlak); color: var(--ink); }
  .meting button { padding: 10px 16px; }
  .metinghistorie { margin-top: 10px; font-size: 13.5px; color: var(--ink-3); }
  .metinghistorie div { padding: 3px 0; }
  .metinghistorie b { color: var(--ink); font-weight: 600; }
  .verwachting { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line);
                 font-size: 13.5px; color: var(--ink-3); }
  .verwachting div { padding: 3px 0; border: 0; }
  .verwachting b { color: var(--ink); font-weight: 600; }
  .verwachting .kopje { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
  .verwachting .kant { margin-top: 5px; font-size: 12.5px; line-height: 1.5; }
  /* De ambitie staat er anders bij dan de kanttekeningen: dit is waar je heen
     wilt, niet een voorbehoud bij een getal. Vandaar een eigen blokje met een
     lijn erboven, en niet nog een grijze regel in de rij. */
  .verwachting .ambitie { margin-top: 9px; padding-top: 8px;
                          border-top: 1px solid var(--line); color: var(--accent-ink); }
  .verwachting .ambitie div { font-size: 12.5px; line-height: 1.5; }
  .panel .kant { margin-top: 6px; font-size: 12.5px; line-height: 1.5;
                 color: var(--ink-3); }
  .panel .regel { margin-top: 8px; font-size: 14px; }
  /* Sport. Een uitslag is drie kolommen, zodat de cijfers onder elkaar staan
     en je de rij niet hoeft te lezen om de score te zien.

     Sinds 4 november 2026 twee lagen: Voetbal en Formule 1 als groep, en
     daaronder Uitslagen en Stand. Gert vroeg daarom -- het blok was één rij
     kopjes ("Eredivisie", "Stand", "Formule 1", "WK-stand") en dan moet je uit
     de inhoud opmaken bij welke sport een stand hoort. De sport waar iets over
     gaat hoort erboven te staan, niet in de kop van de tabel. */
  .sportgroep { padding: 13px 14px 1px; font-family: var(--serif);
                font-weight: 650; font-size: 16px; }
  /* De competitie of de race achter de sport, in de gewone letter: het is een
     toevoeging bij "Voetbal" en geen kop op zichzelf. */
  .sportgroep .wat { font-family: ui-sans-serif, -apple-system, sans-serif;
                     font-weight: 400; font-size: 12.5px; color: var(--ink-3); }
  .sportgroep.later { border-top: 1px solid var(--line); margin-top: 10px;
                      padding-top: 14px; }
  /* Uitslagen en Stand zijn knoppen (.subkop, dezelfde als de kopjes in een
     nieuwsblok). De streep boven zo'n knop hoort er tussen twee kopjes wél en
     direct onder de naam van de sport niet -- daar staat al een kop. */
  .sportgroep + .subkop { border-top: 0; padding-top: 6px; }
  .uitslag { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px;
             align-items: baseline; padding: 9px 14px;
             border-bottom: 1px solid var(--line); }
  .uitslag:last-child { border-bottom: 0; }
  .uitslag .thuis { text-align: right; }
  .uitslag .score { font-weight: 650; font-size: 17px; white-space: nowrap; }
  .uitslag .wanneer { grid-column: 1 / -1; text-align: center;
                      color: var(--ink-3); font-size: 12.5px; }
  .uitslag .bezig { color: var(--accent); font-weight: 600; }
  .uitslag.eigen { background: var(--accent-zacht); }
  .uitslag.eigen .thuis, .uitslag.eigen .gast { font-weight: 600; }
  .ritrij { display: flex; gap: 10px; align-items: baseline; padding: 6px 14px;
            border-bottom: 1px solid var(--line); font-size: 14.5px; }
  .ritrij:last-child { border-bottom: 0; }
  .ritrij .plek { color: var(--ink-3); width: 22px; flex: none; }
  .ritrij .naam { flex: 1; }
  .ritrij .punten { font-weight: 650; }
  .ritrij.eigen { background: var(--accent-zacht); font-weight: 600; }
  table.stand { width: 100%; border-collapse: collapse; font-size: 14.5px; }
  table.stand th { text-align: right; color: var(--ink-3); font-weight: 500;
                   font-size: 12px; padding: 7px 6px 5px;
                   border-bottom: 1px solid var(--line); }
  table.stand th.club, table.stand td.club { text-align: left; }
  table.stand td { text-align: right; padding: 6px;
                   border-bottom: 1px solid var(--line); }
  /* Alleen buitenom de volle marge. Met 14 pixels aan weerskanten van élke cel
     bleef er op een telefoon zo weinig over dat "Go Ahead Eagles" over twee
     regels ging. */
  table.stand th:first-child, table.stand td:first-child { padding-left: 14px; }
  table.stand th:last-child, table.stand td:last-child { padding-right: 14px; }
  table.stand td.plek { color: var(--ink-3); width: 1px; }
  table.stand td.punten { font-weight: 650; }
  table.stand tr:last-child td { border-bottom: 0; }
  table.stand tr.eigen td { background: var(--accent-zacht); font-weight: 600; }
  .sportvoet { padding: 9px 14px; color: var(--ink-3); font-size: 12.5px;
               line-height: 1.5; }
  .uitlegvak { margin-top: 12px; }
  .uitlegvak summary { cursor: pointer; font-size: 13.5px; color: var(--accent-ink); }
  .uitlegvak p { font-size: 13.5px; color: var(--ink-3); line-height: 1.55; margin: 9px 0 0; }
  /* Confetti: losse blokjes die naar beneden dwarrelen en zichzelf opruimen.
     Geen bibliotheek -- dat zou het eerste externe pakket in deze map zijn. */
  .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 99; overflow: hidden; }
  .snipper { position: absolute; width: 9px; height: 14px; opacity: .9;
             animation: val 1.8s linear forwards; }
  @keyframes val {
    0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(70vh) rotate(540deg); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .snipper { animation-duration: .01s; }
  }
  .stip.vol { background: var(--accent); border-color: var(--accent); }
  .stip.extra { background: var(--accent); border-color: var(--accent); opacity: .45; }
  .stip.let { background: var(--warm); border-color: var(--warm); }
  .telling { font-size: 12.5px; color: var(--ink-3); flex: none; min-width: 92px; text-align: right; font-variant-numeric: tabular-nums; }
  .telling.gehaald { color: var(--accent-ink); }
  .telling.let { color: var(--warm); }

  /* --- taken --- */
  .invoer { display: flex; gap: 8px; }
  .invoer input[type="text"] { flex: 1; min-width: 0; padding: 12px 12px; border: 1px solid var(--line-2); background: var(--panel-2); border-radius: 10px; }
  .invoer input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .invoer button { padding: 0 16px; border: 1px solid var(--accent); background: var(--accent); color: var(--op-accent); border-radius: 10px; cursor: pointer; font-weight: 600; }

  .chips { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
  .chips-kop { font-size: 12px; color: var(--ink-3); margin-right: 2px; }
  .chip { padding: 5px 11px; border: 1px solid var(--line-2); background: var(--panel-2); border-radius: 20px; cursor: pointer; font-size: 13px; color: var(--ink-3); }
  .chip[aria-pressed="true"] { background: var(--accent-zacht); border-color: var(--accent); color: var(--accent-ink); font-weight: 550; }

  ul.taken { list-style: none; margin: 12px 0 0; padding: 0; }
  ul.taken li { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .vink { width: 24px; height: 24px; flex: none; margin-top: 1px; border-radius: 7px; border: 2px solid var(--line-2); background: transparent; cursor: pointer; padding: 0; }
  .vink[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
  .vink[aria-pressed="true"]::after { content: "✓"; color: var(--op-accent); font-size: 15px; line-height: 20px; display: block; }
  .inhoud { flex: 1; min-width: 0; }
  .inhoud .tekst { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 0; cursor: text; font-size: 15.5px; line-height: 1.45; word-break: break-word; }
  li.af .tekst { color: var(--ink-3); text-decoration: line-through; }
  .meta { display: flex; gap: 8px; align-items: center; margin-top: 3px; flex-wrap: wrap; }
  .label { font-size: 11.5px; padding: 1px 8px; border-radius: 20px; background: var(--panel-2); border: 1px solid var(--line); color: var(--ink-3); }
  .zacht { font-size: 11.5px; color: var(--ink-3); }
  .acties { display: flex; gap: 2px; flex: none; }
  .acties button { border: 0; background: transparent; color: var(--ink-3); cursor: pointer; padding: 4px 7px; border-radius: 7px; font-size: 15px; line-height: 1.2; }
  .acties button:hover { background: var(--panel-2); color: var(--ink); }

  .bewerk { display: flex; flex-direction: column; gap: 8px; }
  .bewerk input { width: 100%; padding: 9px 10px; border: 1px solid var(--accent); background: var(--panel-2); border-radius: 8px; }
  .bewerk .knoppen { display: flex; gap: 6px; }
  .btn { border: 1px solid var(--line-2); background: var(--panel); color: var(--ink); padding: 7px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 550; }
  .btn.primair { background: var(--accent); border-color: var(--accent); color: var(--op-accent); }

  .vouw { width: 100%; text-align: left; border: 0; background: transparent; color: var(--ink-3); font-size: 13.5px; padding: 11px 0 0; cursor: pointer; border-top: 1px solid var(--line); margin-top: 4px; }
  .leeg { color: var(--ink-3); font-size: 14.5px; padding: 14px 0 4px; }

  /* --- terugblik --- */
  .vgl { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
  .vgl:last-child { border-bottom: 0; }
  .vgl .naam { flex: 1; color: var(--ink-2); }
  .vgl .cijfer { font-variant-numeric: tabular-nums; color: var(--ink); }
  .vgl .pijl { font-size: 12.5px; color: var(--ink-3); min-width: 74px; text-align: right; }
  .vgl .pijl.op { color: var(--accent-ink); }

  .weekkop { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  .weekkop b { font-size: 14.5px; }
  .weekkop span { font-size: 12.5px; color: var(--ink-3); }

  .aanmelding { width: 100%; font: 11px/1.4 ui-monospace, Menlo, monospace;
                word-break: break-all; border: 1px solid var(--line);
                border-radius: 8px; padding: 8px; background: var(--panel-2);
                color: var(--ink); margin: 8px 0; }

  /* --- instellingen --- */
  .doel { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .doel:last-of-type { border-bottom: 0; }
  .doel .naam { flex: 1; font-size: 14.5px; color: var(--ink-2); }
  .doel .soort { font-size: 12px; color: var(--ink-3); }
  .doel input { width: 62px; padding: 7px 8px; border: 1px solid var(--line-2); background: var(--panel-2); border-radius: 8px; text-align: center; font-variant-numeric: tabular-nums; }
  p.uitleg { font-size: 13.5px; color: var(--ink-3); line-height: 1.55; margin: 10px 0 0; }
  .knoprij { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }

  .melding { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 20px; font-size: 14px; z-index: 50; opacity: 0; pointer-events: none; transition: opacity .18s; }
  .melding.aan { opacity: .95; }

  @media (max-width: 380px) {
    .telling { min-width: 78px; font-size: 12px; }
    .tegel { font-size: 14px; padding: 11px 10px; }
  }

  /* ---------- Startscherm: twee grote blokken ----------------------
     Bij openen wil Gert niet meteen tegen een muur tekst aankijken. Dus
     eerst de keuze: wat is er gebeurd, of wat moet ik doen. De rest zit
     erachter. */
  .start { padding: 16px; display: grid; gap: 14px; }
  .startkaart {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: var(--panel); border: 1px solid var(--line);
    border-left: 6px solid var(--accent);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 18px 18px 16px; color: inherit; font: inherit;
  }
  .startkaart:active { transform: translateY(1px); }
  .startkaart.briefing { border-left-color: var(--teal); }
  .startkaart.oprij    { border-left-color: var(--olijf); }
  .startkaart h2 { font-size: 21px; margin-bottom: 4px; }
  .startkaart .onder { color: var(--ink-2); font-size: 14px; }
  .startkaart .cijfers {
    margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px;
  }
  .pil {
    font-size: 12.5px; padding: 3px 9px; border-radius: 999px;
    background: var(--panel-2); border: 1px solid var(--line);

  }
  .pil.groen { background: var(--accent-zacht); border-color: transparent; color: var(--accent-ink); }
  .startvoet { padding: 2px 4px 20px; display: flex; gap: 14px; justify-content: center; }
  .startvoet button {
    background: none; border: 0; color: var(--ink-3); font: inherit;
    font-size: 14px; text-decoration: underline; cursor: pointer; padding: 6px;
  }

  /* ---------- Ochtendbriefing ---------- */
  .briefkop { padding: 14px 16px 4px; }
  .briefkop .datum { color: var(--ink-2); font-size: 14px; }
  .speler {
    margin: 10px 16px 4px; padding: 12px 14px; background: var(--panel);
    border: 1px solid var(--line); border-left: 6px solid var(--accent);
    border-radius: var(--radius); box-shadow: var(--shadow);
  }
  .speler .label { font-size: 13.5px; color: var(--ink-2); margin-bottom: 8px; }

  /* Eigen audiospeler. De browser levert er zelf een, maar die is knalwit en
     staat boven aan het scherm dat je elke ochtend als eerste ziet — in een app
     die verder helemaal in bosgroen en crème is uitgevoerd. Deze gebruikt
     dezelfde kleurvariabelen, dus hij volgt ook de donkere stand mee. */
  .weerkaart .dalfsen { font-weight: 600; }

  .speler .kop { display: flex; align-items: baseline; gap: 10px; }
  /* `.label` is elders in de app een chipje met rand en vulling; hier is het
     gewoon een regel tekst. Zonder deze terugzetting ziet "Ingesproken door
     Robin" eruit als een leeg invulveld. */
  .speler .kop .label {
    flex: 1; margin: 0; padding: 0; border: none; background: none;
    border-radius: 0; font-size: 13.5px;
  }
  .speler .duur {
    font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums;
  }
  .speler .bediening { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
  .speler button.knop {
    flex: none; display: grid; place-items: center; cursor: pointer;
    background: none; border: 1px solid var(--line-2); color: var(--ink-2);

  .speler button.knop:hover { border-color: var(--accent); color: var(--accent); }

    width: 46px; height: 46px; background: var(--accent); border: none;

  .speler button.afspelen:hover { background: var(--accent-ink); color: var(--op-accent); }

    flex: 1; accent-color: var(--accent); height: 22px; cursor: pointer; min-width: 0;
  }
  .speler .tijd {
    flex: none; font-size: 12.5px; color: var(--ink-3);
    font-variant-numeric: tabular-nums; min-width: 42px; text-align: right;
  }
  .blok { margin: 10px 16px; }
  .blok > button {
    width: 100%; display: flex; align-items: center; gap: 10px;
    background: var(--panel); border: 1px solid var(--line);
    border-left: 6px solid var(--leisteen);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 13px 14px; color: inherit; font: inherit; cursor: pointer;
    text-align: left;
  }
  .blok > button .naam { font-family: var(--serif); font-size: 17px; flex: 1; }
  .blok > button .aantal { color: var(--ink-3); font-size: 13.5px; }

  .blok[data-open="1"] > button .pijl { transform: rotate(90deg); }
  .blok[data-open="1"] > button { border-radius: var(--radius) var(--radius) 0 0; }
  .blok .inhoud {
    border: 1px solid var(--line); border-top: 0;
    border-radius: 0 0 var(--radius) var(--radius);
    background: var(--panel-2); overflow: hidden;
  }
  /* De regel zit om het bericht heen en niet in het bericht zelf: naast de
     tekst staat de bewaarknop, en die hoort binnen dezelfde scheidslijn te
     vallen. Vandaar dat de rand hier zit en niet op .bericht. */
  .berichtrij { display: flex; align-items: flex-start; border-top: 1px solid var(--line); }
  .berichtrij:first-child { border-top: 0; }
  .berichtrij.nieuw { box-shadow: inset 3px 0 0 var(--accent); }
  .bewaarknop { flex: 0 0 auto; background: none; border: 0; cursor: pointer;

  .bericht { display: block; flex: 1; min-width: 0; padding: 11px 14px;

  a.bericht .titel { color: var(--accent-ink); }
  .weerkaart { padding: 13px 14px; }
  /* De omslag is het enige in dit blok dat je echt moet zien: morgen is meestal

  .weerkaart .omslag { font-weight: 600; color: var(--accent, #7a9a6d); margin-top: 10px; }

  .weerkaart p { margin: 8px 0 0; color: var(--ink-2); font-size: 14.5px; line-height: 1.45; }
  /* De regel die de briefing en Gerts eigen gegevens combineert. Bewust rustig:
     hij staat bovenaan het drukste scherm van de app en moet informeren, niet
     roepen. */
  /* De tijdlijn van een dossier: klein en ingesprongen, want het is een

  /* De knop die van een bewaard bericht een dossier maakt, en het potloodje
     bij een dossier.

     Stond er eerst als een los rondpijltje. Dat was niet te raden: Gert vroeg

     een title-tekst, en die ziet een telefoon nooit, want er is niets om op te

  .duidingtijd { margin: 0 0 12px; }

  .dossierform { padding: 2px 14px 14px; display: flex; flex-direction: column;

  .dossierform input[type="text"] { padding: 11px 12px; border-radius: 10px;

  .formknoppen { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
  .knopje { padding: 9px 14px; border-radius: 999px; cursor: pointer;
            border: 1px solid var(--line-2); background: var(--panel-2);
            color: var(--ink-2); font: inherit; font-size: 14px; }
  .knopje.aan { background: var(--accent); border-color: var(--accent);
                color: var(--op-accent); font-weight: 600; }
  .knopje.weg { color: var(--warm); margin-left: auto; }
  .tijdlijn { padding: 0 14px 11px 25px; }
  .tijdlijn a, .tijdlijn span {
    display: block; font-size: 12.5px; line-height: 1.5; margin-top: 2px;
    color: var(--ink-3); text-decoration: none; }
  .tijdlijn a { color: var(--accent-ink); }
  .tijdlijn a.vers { font-weight: 600; }
  .tijdlijn .ouder { font-style: italic; }
  /* De waarschuwing dat je naar een oude briefing kijkt. Warm en niet rood:
     dit is geen storing maar een mededeling -- meestal staat de Mac gewoon
     uit, en dat is zijn goed recht. */
  .oud { margin: 0 0 14px; padding: 11px 13px; border-radius: var(--radius);
         background: var(--warm-zacht); border-left: 3px solid var(--warm);
         font-size: 14px; line-height: 1.45; color: var(--ink-2); }
  .slim { margin: 0 0 14px; padding: 11px 13px; border-radius: var(--radius);
          background: var(--panel); border-left: 3px solid var(--accent); }
  .slim p { margin: 0; font-size: 14.5px; line-height: 1.45; color: var(--ink-2); }
  .slim p + p { margin-top: 6px; }
  .duiding { padding: 4px 14px 13px; }
  .duiding .draad { padding-top: 13px; }
  .duiding .draad + .draad { border-top: 1px solid var(--line); margin-top: 13px; }
  .duiding .draadkop { display: block; font-weight: 650; font-family: var(--serif);
                       font-size: 16px; margin-bottom: 5px; }
  .duiding p { margin: 0; color: var(--ink-2); font-size: 14.5px; line-height: 1.5; }
  /* Een diepe draad heeft meer dan één alinea; zonder ruimte ertussen is het
     één lap tekst. */
  .duiding .draad p + p { margin-top: 9px; }
  /* De berichten waarop een alinea rust. Klein en ingesprongen: ze zijn er om
     na te lopen, niet om te lezen — de kop staat al in zijn eigen blok. */
  .duiding .waaruit { margin-top: 8px; padding-left: 11px;
                      border-left: 2px solid var(--line); }
  .duiding .waaruit a, .duiding .waaruit span {
    display: block; font-size: 12.5px; line-height: 1.45; margin-top: 3px;
    color: var(--accent-ink); text-decoration: none; }
  .duiding .waaruit span { color: var(--ink-3); }
  /* Dat hier een model heeft geschreven hoort erbij te staan. Niet als
     disclaimer maar als leesaanwijzing: het verklaart waarom de bronnen
     eronder staan en waarom je ze kunt willen nalopen. */
  .duiding .herkomst { margin-top: 14px; font-size: 12px; color: var(--ink-3);
                       line-height: 1.4; }
  .leeg { padding: 26px 16px; color: var(--ink-3); text-align: center; }
  #naar-start {
    background: none; border: 0; color: var(--ink-2); font-size: 20px;
    cursor: pointer; padding: 2px 8px 2px 0; line-height: 1;
  }
  body[data-scherm="start"] #naar-start,
  body[data-scherm="start"] .tabs { display: none; }
  body[data-scherm="briefing"] .tabs,
  body[data-scherm="training"] .tabs { display: none; }
  .startkaart.training { border-left-color: var(--accent); }
  /* Afvinken en opengaan zijn twee verschillende dingen; daarom twee knoppen
     naast elkaar en geen tik-op-de-hele-rij. Anders vink je per ongeluk af
     terwijl je alleen wilde lezen wat de oefeningen waren. */
  .trainingrij { display: flex; gap: 0; align-items: stretch; }
  .vinkknop {
    flex: 0 0 52px; background: var(--panel); border: 1px solid var(--line);
    border-right: 0; border-radius: var(--radius) 0 0 var(--radius);
    font-size: 21px; color: var(--ink-3); cursor: pointer; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow);
  }
  .vinkknop.aan { background: var(--accent); color: var(--op-accent); border-color: var(--accent); }
  .trainingnaam {
    flex: 1; display: flex; align-items: center; gap: 10px; text-align: left;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 0 var(--radius) var(--radius) 0;
    box-shadow: var(--shadow); padding: 13px 14px; color: inherit; font: inherit;
    cursor: pointer;
  }
  .trainingnaam .naam { font-family: var(--serif); font-size: 17px; }
  .trainingnaam .aantal { flex: 1; color: var(--ink-3); font-size: 13px; }
  .trainingnaam.beurt { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .blok[data-open="1"] .trainingnaam { border-radius: 0 var(--radius) 0 0; }
  .blok[data-open="1"] .vinkknop { border-radius: var(--radius) 0 0 0; }
  .blok[data-open="1"] .trainingnaam .pijl { transform: rotate(90deg); }
  .oef { border-top: 1px solid var(--line); }
  .oef:first-child { border-top: 0; }
  .oef-top {
    width: 100%; display: flex; align-items: center; gap: 12px;
    background: none; border: 0; color: inherit; font: inherit;
    padding: 10px 13px; cursor: pointer; text-align: left;
  }
  .picto { flex: 0 0 46px; height: 46px; color: var(--accent); }
  .picto svg { width: 100%; height: 100%; display: block; }
  .oef-mid { flex: 1; min-width: 0; }
  .oef-naam { display: block; font-size: 14.5px; font-weight: 600; line-height: 1.25; }
  .oef-kit { display: block; font-size: 12px; color: var(--ink-3); margin-top: 2px; }
  .oef-num {
    flex: 0 0 auto; text-align: right; font-size: 14px; font-weight: 600;
    color: var(--accent-ink); white-space: nowrap;
  }
  .oef.open .pijl { transform: rotate(90deg); }
  /* Het looppaneel binnen het blok Lopen: zelfde binnenmarge als een geopende
     oefening eronder, met een streep erboven zodat het niet aan de laatste
     oefening vastplakt. */
  .loopinhoud { padding: 13px 14px 15px; border-top: 1px solid var(--line); }
  .loopinhoud > .bij { margin-bottom: 9px; }
  .oef-body { padding: 0 13px 13px 71px; }
  .oef-body p { margin: 0; font-size: 13.5px; line-height: 1.45; }
  .oef-body .cue { margin-top: 7px; font-size: 12.5px; color: var(--accent-ink); font-style: italic; }
  .oef-num small { display: block; font-size: 10.5px; font-weight: 400; color: var(--ink-3); }
  .picto { flex: 0 0 42px; height: 42px; }
  .dagkiezer {
    display: flex; gap: 7px; overflow-x: auto; padding: 8px 16px 2px;
    -webkit-overflow-scrolling: touch;
  }
  .dagknop {
    flex: 0 0 auto; background: var(--panel); border: 1px solid var(--line);
    border-radius: 999px; padding: 7px 14px; font: inherit; font-size: 13.5px;
    color: var(--ink-2); cursor: pointer; white-space: nowrap;
  }
  .dagknop.aan { background: var(--accent); border-color: var(--accent); color: var(--op-accent); }
  /* Het kraanvogelsein. Springt eruit omdat je het maar twee keer per jaar
     ziet en je het dan niet wilt missen. */
  .bericht.sein {
    background: var(--warm-zacht); border-left: 4px solid var(--warm);
  }
  .bericht.sein .titel { color: var(--warm); font-weight: 650; }
  .status {
    margin: 18px 16px 24px; padding: 10px 13px;
    font-size: 12.5px; line-height: 1.5; color: var(--ink-3);
    border-top: 1px solid var(--line);
  }
  .status.let-op {
    color: var(--warm); background: var(--warm-zacht);
    border: 1px solid var(--warm); border-radius: var(--radius);
  }
  .subkop {
    width: 100%; display: flex; align-items: center; gap: 10px;
    padding: 11px 14px; font: inherit; font-family: var(--serif);
    font-size: 14.5px; color: var(--ink-2); text-align: left; cursor: pointer;
    border: 0; border-top: 1px solid var(--line); background: var(--panel);
  }
  .subkop .naam { flex: 1; }
  .subkop .aantal { color: var(--ink-3); font-size: 13px; }
  .subkop .pijl { color: var(--ink-3); transition: transform .15s; }
  .subkop.open .pijl { transform: rotate(90deg); }
  .inhoud > .subkop:first-child { border-top: 0; }
  .toelichting {
    margin: 6px 0 0; font-size: 13.5px; line-height: 1.45; color: var(--ink-2);
  }

  /* ---------- Spelletje ---------- */
  body[data-scherm="spel"] .tabs { display: none; }
  .startkaart.spel { border-left-color: var(--leisteen); }
  .spelvak { padding: 0 16px; }
  .spelstand {
    display: flex; gap: 8px; margin: 10px 0 8px; font-size: 14px; color: var(--ink-2);
  }
  .spelstand b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .spelstand .klok { margin-left: auto; }
  .spelstand .klok.krap b { color: var(--warm); }

  .spelbord {
    display: block; width: 100%; aspect-ratio: 1; touch-action: none;
    border: 1px solid var(--line); border-radius: var(--radius);

  .spelmelding span {

  }
  .spelmelding span:empty { display: none; }
  .spelmelding small { display: block; margin-top: 4px; font-family: ui-sans-serif, -apple-system, sans-serif; font-size: 13px; color: var(--ink-3); }
  .spelna { margin-top: 12px; text-align: center; }
  .spelna .btn { padding: 11px 20px; font-size: 15px; }
  .spelna p { margin: 0 0 10px; color: var(--ink-2); font-size: 14.5px; }
  .spelscores { margin: 18px 0 0; padding: 12px 0 0; border-top: 1px solid var(--line); }
  .spelscores h3 { font-size: 14.5px; margin-bottom: 6px; }
  .spelscores ul { list-style: none; margin: 0; padding: 0; }
  .spelscores li {
    display: flex; justify-content: space-between; gap: 10px;
    font-size: 13.5px; color: var(--ink-2); padding: 3px 0;
  }
  .spelscores li b { font-variant-numeric: tabular-nums; color: var(--ink); }
  .spelscores .record { color: var(--accent-ink); }
  .spelscores p.record { margin: 8px 0 0; font-size: 14px; font-weight: 600; }
</style>

<body>

<header class="app">
  <div class="bar">
    <div class="brand">
      <button id="naar-start" aria-label="Terug naar start">&#8592;</button>
      <b>Dagstart</b><span id="vandaag-tekst"></span>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="vandaag" aria-selected="false">Vandaag</button>
      <button role="tab" data-tab="terugblik" aria-selected="false">Terugblik</button>
      <button role="tab" data-tab="instellingen" aria-selected="false" aria-label="Instellingen">&#9881;</button>
    </div>
  </div>
</header>

<main>
  <div id="tab-start"></div>
  <div id="tab-briefing" hidden></div>
  <div id="tab-training" hidden></div>
  <div id="tab-spel" hidden></div>
  <div id="tab-vandaag" hidden></div>
  <div id="tab-terugblik" hidden></div>
  <div id="tab-instellingen" hidden></div>
</main>

<div class="melding" id="melding"></div>

<script>
"use strict";

/* ===================================================================
   Op Rij — taken en gewoontes op één plek.

   Alles staat in de opslag van deze browser (localStorage), onder de
   sleutel hieronder. Er gaat niets naar een server: de app werkt overal,
   maar de gegevens blijven op dit toestel. Daarom staat er bij
   Instellingen een knop om een reservekopie te bewaren — dat is het
   enige vangnet dat er is.
   =================================================================== */

const SLEUTEL = 'oprij.v1';

/* De gewoontes. `soort` bepaalt hoe je ze telt:
   - 'min': je wilt er minstens zoveel per week halen.
   - 'max': het gaat om afwezigheid, dus je telt de uitzonderingen en
     wilt er hoogstens zoveel. Zo hoef je niets aan te tikken op de dagen
     dat het goed ging.
   Vegetarisch en zoogdier komen allebei uit dezelfde dagkeuze bij eten,
   zodat één tik per dag genoeg is. */
const GEWOONTES = [
  { id: 'sport',     naam: 'Hardlopen of sporten', kort: 'Hardlopen',   soort: 'min', tegel: true },
  { id: 'wandeling', naam: 'Lange wandeling',      kort: 'Wandeling',   soort: 'min', tegel: true },
  { id: 'mindful',   naam: 'Mindfulness',          kort: 'Mindfulness', soort: 'min', tegel: true },
  { id: 'smoothie',  naam: 'Smoothie-ontbijt',     kort: 'Smoothie',    soort: 'min', tegel: true },
  { id: 'veg',       naam: 'Vegetarisch',          soort: 'min', uitEten: 'veg' },
  /* Geen chips, vijf dagen per week (2 november 2026, op Gerts verzoek). Twee
     dagen ruimte is met opzet: een gewoonte die zeven van de zeven eist is op
     woensdag al mislukt, en dan tik je de rest van de week niets meer aan.

     Een `min`-gewoonte en geen `max`, net als Vegetarisch: je vinkt aan wat je

'Een regel': '<line x1="6" y1="50" x2="54" y2="50" opacity=".3"/><circle cx="34" cy="12" r="4.5"/><path d="M34 17l-4 12"/><path d="M30 29l-6 9"/><path d="M24 38l-6 10"/><path d="M30 29l8 6"/><path d="M38 35l2 13"/><path d="M33 20l10 4"/><path d="M33 22l-10 2"/>',
};



const STANDAARD_DOELEN = { sport: 2, wandeling: 1, mindful: 3, smoothie: 3, veg: 2,
                           training: 5, chips: 5 };

const LABELS = [
  { id: 'bellen', naam: 'Bellen' },
  { id: 'klus',   naam: 'Klus' },
  { id: 'huis',   naam: 'Huis' },
  { id: 'werk',   naam: 'Werk' },
];

const DAGNAMEN = ['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];
const MAANDEN = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];

/* ---------- opslag ---------- */

let st = leeg();
let opslagWerkt = true;

function leeg() {
  return { versie: 1, taken: [], dagen: {}, doelen: Object.assign({}, STANDAARD_DOELEN),
           bewaard: [], gevierd: [], dossiers: [], metingen: {}, laatsteKopie: null };
}

/* Elk veld hier moet ook in leeg() staan, en andersom.
   Op 3 november 2026 ging dat mis: de dossiers kwamen erbij, maar niet in
   leeg() en niet hier -- en toen was st.dossiers undefined. De lus eroverheen
   wierp "st.dossiers is not iterable", tekenBriefing() brak halverwege af en
   het hele briefingscherm bleef leeg. Je zag een app die niet reageerde op een
   tik, zonder dat er iets in beeld kwam dat op een fout leek.

   Dat het bij het bouwen niet opviel, komt doordat een browser waarin je zelf
   net een dossier hebt aangemaakt het veld wél heeft. Het sloeg pas toe bij
   iemand die nog nooit een dossier had -- dus bij Gert, en bij elke verse
   installatie.

   Daarom staat de controle nu op één plek en loopt het terugzetten van een
   reservekopie er ook doorheen: dat deed zijn eigen Object.assign en sloeg
   deze toetsen over. Komt er een veld bij, zet het dan in leeg() én hier. */
function vormGoed() {
  st.doelen = Object.assign({}, STANDAARD_DOELEN, st.doelen || {});
  if (!Array.isArray(st.taken)) st.taken = [];
  if (!st.dagen || typeof st.dagen !== 'object') st.dagen = {};
  if (!Array.isArray(st.bewaard)) st.bewaard = [];
  if (!Array.isArray(st.gevierd)) st.gevierd = [];
  if (!Array.isArray(st.dossiers)) st.dossiers = [];
  if (!st.metingen || typeof st.metingen !== 'object') st.metingen = {};
}

function laad() {
  try {
    const ruw = localStorage.getItem(SLEUTEL);
    if (!ruw) return;
    const d = JSON.parse(ruw);
    st = Object.assign(leeg(), d);
    vormGoed();
  } catch (e) {
    opslagWerkt = false;
  }
}

function bewaar() {
  try {
    localStorage.setItem(SLEUTEL, JSON.stringify(st));
  } catch (e) {
    opslagWerkt = false;
    zeg('Opslaan lukt niet — maak een reservekopie');
  }
}

/* ---------- datums ---------- */

function sleutelVan(d) {
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const g = String(d.getDate()).padStart(2, '0');
  return d.getFullYear() + '-' + m + '-' + g;
}

function vandaag() { return sleutelVan(new Date()); }

function alsDatum(s) {
  const [j, m, d] = s.split('-').map(Number);
  return new Date(j, m - 1, d);
}

function plusDagen(s, n) {
  const d = alsDatum(s);
  d.setDate(d.getDate() + n);
  return sleutelVan(d);
}

/* ISO-weeknummer, bijvoorbeeld '2026-W32'. */
function weekVan(s) {
  const t = alsDatum(s);
  const dag = (t.getDay() + 6) % 7;              // maandag = 0
  t.setDate(t.getDate() - dag + 3);              // de donderdag van deze week
  const jaar = t.getFullYear();
  const eerste = new Date(jaar, 0, 4);
  eerste.setDate(eerste.getDate() - ((eerste.getDay() + 6) % 7) + 3);
  const nr = 1 + Math.round((t - eerste) / (7 * 86400000));
  return jaar + '-W' + String(nr).padStart(2, '0');
}

function maandagVan(s) {
  const t = alsDatum(s);
  t.setDate(t.getDate() - ((t.getDay() + 6) % 7));
  return sleutelVan(t);
}

function weekDagen(maandag) {
  const uit = [];
  for (let i = 0; i < 7; i++) uit.push(plusDagen(maandag, i));
  return uit;
}

function langeDatum(s) {
  const d = alsDatum(s);
  return DAGNAMEN[d.getDay()] + ' ' + d.getDate() + ' ' + MAANDEN[d.getMonth()];
}

function korteDatum(s) {
  const d = alsDatum(s);
  return d.getDate() + ' ' + MAANDEN[d.getMonth()].slice(0, 3);
}

/* ---------- dagen en tellingen ---------- */

function dag(datum, maak) {
  if (!st.dagen[datum] && maak) st.dagen[datum] = {};
  return st.dagen[datum] || {};
}

function gedaanOp(datum, gewoonte) {
  const d = dag(datum);
  if (gewoonte.uitEten) return d.eten === gewoonte.uitEten;
  if (gewoonte.uitTraining) return !!d.training;
  return !!d[gewoonte.id];
}

function telWeek(maandag, gewoonte) {
  let n = 0;
  for (const datum of weekDagen(maandag)) if (gedaanOp(datum, gewoonte)) n++;
  return n;
}

function doelVan(gewoonte) {
  const v = st.doelen[gewoonte.id];
  return Number.isFinite(v) ? v : STANDAARD_DOELEN[gewoonte.id];
}

/* ---------- taken ---------- */

function nieuwId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

/* Wat gisteren niet afkwam, staat vandaag gewoon weer bovenaan. Geen rood,
   geen "te laat" — alleen stilletjes bijhouden hoe vaak iets is opgeschoven,
   want zes keer opschuiven zegt meestal dat het geen taak van één regel is. */
function rolDoor() {
  const nu = vandaag();
  let veranderd = false;
  for (const t of st.taken) {
    if (!t.klaar && t.voor < nu) {
      t.voor = nu;
      t.verschoven = (t.verschoven || 0) + 1;
      veranderd = true;
    }
  }
  if (veranderd) bewaar();
}

function takenVoorVandaag() {
  const nu = vandaag();
  return st.taken.filter(t => !t.klaar && t.voor <= nu);
}

function takenVoorLater() {
  const nu = vandaag();
  return st.taken.filter(t => !t.klaar && t.voor > nu).sort((a, b) => a.voor < b.voor ? -1 : 1);
}

function takenAfVandaag() {
  const nu = vandaag();
  return st.taken.filter(t => t.klaar === nu);
}

/* ---------- schermstaat (niet bewaard) ---------- */

const ui = {
  tab: 'start',
  blokOpen: {},         // welke briefing-blokken uitgeklapt staan
  oefOpen: {},          // welke oefeningen hun uitleg tonen
  smoothieOpen: {},     // welke smoothie zijn ingrediënten toont
  kopOpen: {},          // welke tussenkopjes binnen een blok open staan
  briefingDag: null,    // null = vandaag, anders een datum uit het archief
  label: null,          // voorgekozen etiket bij het invoerveld
  filter: null,         // filter op de lijst van vandaag
  bewerkt: null,        // id van de taak die je aan het bewerken bent
  toonGedaan: false,
  toonLater: false,
  metingOpen: false,    // de invulvelden van de weekmeting opengeklapt
  dossierBewerk: null,  // id van het dossier dat je bewerkt, of 'nieuw'
  weken: 8,             // hoeveel weken de terugblik toont
};

/* ---------- wat is er nieuw sinds je vorige bezoek ---------- */

/* De briefing wordt elk uur verst en er staan er honderd in. Zonder dit moest je
   na de ronde van 14:00 alles opnieuw langs om te zien wat erbij was gekomen.

   Het tijdstip van je vorige bezoek staat los van `oprij.v1`: het is een gemak
   van dít toestel en niet iets dat in je reservekopie hoort, net als de
   snelheid van de speler. We lezen het één keer bij het opstarten en houden dat
   vast zolang de app open is -- schreven we er meteen "nu" in, dan waren de
   stipjes verdwenen op het moment dat je ze wilde zien. */
const GEZIEN = 'dagstart.gezien';
const gezienMs = (() => {
  try { return Date.parse(localStorage.getItem(GEZIEN) || '') || 0; }
  catch (e) { return 0; }
})();

function gezienBijwerken() {
  try { localStorage.setItem(GEZIEN, new Date().toISOString()); } catch (e) {}
}

/* `sorteer` draagt een tijdzone ("...+01:00"), dus vergelijken gaat via
   Date.parse en niet als tekst: bij twee verschillende offsets geeft een
   tekstvergelijking het verkeerde antwoord. En bij het eerste bezoek ooit is
   er geen ijkpunt -- dan is niets nieuw, in plaats van alles. */
function isNieuw(it) {
  if (!gezienMs || !it.sorteer) return false;
  const t = Date.parse(it.sorteer);
  return !!t && t > gezienMs;
}

/* ---------- bewaarde berichten ---------- */

/* De link is de identiteit; alleen als die er niet is de titel. Twee redacties
   over hetzelfde verhaal zijn dus twee berichten, en dat is hier juist goed. */
function bewaarSleutel(it) { return it.link || it.titel || ''; }

function isBewaard(it) {
  const k = bewaarSleutel(it);
  return !!k && st.bewaard.some((b) => b.sleutel === k);
}

function bewaarWissel(it) {
  const k = bewaarSleutel(it);
  if (!k) return;
  const n = st.bewaard.findIndex((b) => b.sleutel === k);
  if (n >= 0) {
    st.bewaard.splice(n, 1);
    zeg('Niet meer bewaard');
  } else {
    st.bewaard.unshift({
      sleutel: k, titel: it.titel || '', bron: it.bron || '',
      tijd: it.tijd || '', link: it.link || '', op: vandaag(),
    });
    /* Zonder dit tik je op een ster, gebeurt er zichtbaar niets, en vraag je je
       af waar het bericht heen is. Precies wat Gert op 30 oktober 2026 vroeg. */
    zeg('Bewaard \u00b7 bovenaan de briefing');
  }
  bewaar();
}

/* ---------- de maandchallenge ---------- */

/* Gert wilde in november vijf keer per week trainen en het deze maand ook écht
   halen. Eén maand, een duidelijk doel, en daarna weg -- dat is wat een
   challenge een challenge maakt.

   Het doel is een maandtotaal en geen rijtje weken, en dat is met opzet. Vijf
   per week over dertig dagen is eenentwintig; met weken was 1 november (een
   zondag) de staart van een oktoberweek geweest en had zijn eerste training
   nergens geteld. Het weekritme blijft zichtbaar in de regel eronder en in de
   bolletjes die er al waren.

   Wil je hem volgende maand opnieuw: pas deze vier regels aan. Staat de datum
   van vandaag erbuiten, dan is het paneel er gewoon niet. */
const UITDAGING = {
  naam: 'November',
  van: '2026-11-01',
  tot: '2026-11-30',
  doel: 21,          // vijf per week over dertig dagen
  perWeek: 5,
};

function uitdagingLoopt() {
  const nu = vandaag();
  return nu >= UITDAGING.van && nu <= UITDAGING.tot;
}

function uitdagingGedaan() {
  let n = 0;
  for (const datum in st.dagen) {
    if (datum >= UITDAGING.van && datum <= UITDAGING.tot && st.dagen[datum].training) n++;
  }
  return n;
}

/* Confetti bij de vijfde van de week. Gert vroeg erom, en het is het waard:
   dit is het moment waarop de week binnen is. */
function confetti() {
  const kleuren = ['var(--accent)', 'var(--teal)', 'var(--olijf)', 'var(--warm)'];
  const vak = el('div', { class: 'confetti' });
  for (let i = 0; i < 40; i++) {
    const sn = el('div', { class: 'snipper' });
    sn.style.left = Math.random() * 100 + '%';
    sn.style.background = kleuren[i % kleuren.length];
    sn.style.animationDelay = (Math.random() * 0.5).toFixed(2) + 's';
    sn.style.transform = 'rotate(' + Math.floor(Math.random() * 360) + 'deg)';
    vak.appendChild(sn);
  }
  document.body.appendChild(vak);
  setTimeout(() => vak.remove(), 2600);
}

/* Eén keer vieren per week, en dat moet een herlaadbeurt overleven -- anders
   knalt de confetti elke keer dat je het scherm opent. Vandaar in `st` en niet
   in `ui`. */
function vierAls(sleutel, tekst) {
  if (!Array.isArray(st.gevierd)) st.gevierd = [];
  if (st.gevierd.includes(sleutel)) return;
  st.gevierd.push(sleutel);
  bewaar();
  confetti();
  zeg(tekst);
}

function tekenUitdaging() {
  if (!uitdagingLoopt()) return null;

  const nu = vandaag();
  const gedaan = uitdagingGedaan();
  const maandag = maandagVan(nu);
  const dezeWeek = telWeek(maandag, GEWOONTES.find(g => g.id === 'training'));

  /* Hoeveel dagen van de maand zijn om, inclusief vandaag. Daarmee reken je uit
     of je op schema ligt -- en dat is de enige cijferregel die je op een
     donderdag echt helpt. */
  const dagNr = Number(nu.slice(8)) ;
  const totaal = Number(UITDAGING.tot.slice(8));
  const verwacht = Math.round(dagNr / totaal * UITDAGING.doel);
  const verschil = gedaan - verwacht;

  const vak = el('div', { class: 'uitdaging' });
  vak.appendChild(el('div', { class: 'groot' },
    [el('span', { tekst: gedaan + ' van ' + UITDAGING.doel + ' ' }),
     el('small', { tekst: 'trainingen' })]));
  vak.appendChild(stippenRij(gedaan, UITDAGING.doel, 'min'));

  /* Wat heb je deze week nog nodig, en hoeveel dagen heb je er nog voor. Dit is
     het stukje dat ertoe doet: op een donderdag met twee gedaan is "nog drie in
     vier dagen" een plan, en "3 van 5" alleen een constatering. */
  const dagenOver = 7 - ((alsDatum(nu) - alsDatum(maandag)) / 86400000);
  const tekort = UITDAGING.perWeek - dezeWeek;
  let week;
  if (maandag < UITDAGING.van) {
    /* De eerste dagen vallen in een week die grotendeels vóór de challenge
       ligt. Die afrekenen op vijf is onzin: op zondag 1 november zou er
       "vijf haal je niet meer" staan over een week die voor zes zevende in
       oktober zat. Dus tellen we hem niet mee en zeggen we wanneer het begint. */
    week = 'De eerste hele week begint maandag';
  } else if (tekort <= 0) {
    week = 'Deze week binnen — ' + dezeWeek + ' van ' + UITDAGING.perWeek;
  } else if (tekort > dagenOver) {
    week = 'Deze week ' + dezeWeek + ' van ' + UITDAGING.perWeek +
           ' · vijf haal je niet meer, maar ' + (dezeWeek + dagenOver) + ' wel';
  } else {
    week = 'Deze week ' + dezeWeek + ' van ' + UITDAGING.perWeek +
           ' · nog ' + tekort + (tekort === 1 ? ' te gaan in ' : ' te gaan in ') +
           dagenOver + (dagenOver === 1 ? ' dag' : ' dagen');
  }
  vak.appendChild(el('div', { class: 'regel', tekst: week }));

  const op = verschil >= 0
    ? (verschil === 0 ? 'Precies op schema' : verschil + ' voor op schema')
    : Math.abs(verschil) + ' achter op schema';
  vak.appendChild(el('div', { class: 'regel label' + (verschil < 0 ? ' achter' : ''),
                              tekst: op }));

  return paneel(UITDAGING.naam, 'vijf per week', [vak]);
}

/* ---------- wegen en meten ---------- */

/* Gert wilde er op 1 november 2026 bij: elke maandag wegen en de buikomvang
   meten, met een duwtje om het ook echt in te vullen.

   **Sinds 4 november 2026 weegt hij elke dag** -- die ochtend was zijn
   weegschaal bezorgd. Het gewicht gaat dus per dag in de opslag en niet meer
   per week; de buikomvang blijft wél een keer per week, want een meetlint elke
   ochtend levert vooral ademhaling op.

   Dat ging zonder verhuizing van gegevens: de sleutel was de maandag van de
   week, en een maandag is ook gewoon een dag. Zijn weekmetingen van 1 en
   2 november staan er dus nog, op die maandagen, en de lijn loopt er dwars
   doorheen. Eén dict `st.metingen[datum] = { gewicht, buik, op }`, waarin
   `buik` op de meeste dagen leeg is.

   Wat er wél aan vastzat staat verderop: het gemiddelde van zeven dagen in
   plaats van één ochtend (`weekvenster()`), een ruisgrens die mee omlaag kon
   (`MEETRUIS`), en een trend die op dagen let en niet op het aantal metingen
   (`MIN_REEKS_DAGEN`). Die laatste twee waren geen opsmuk maar nodig: met
   zeven metingen per week waren drie metingen opeens drie dagen, en daar een
   lijn naar 1 januari door trekken is geen verwachting.

   Buikomvang staat er bewust naast het gewicht. Bij krachttraining komt er spier
   bij terwijl er vet af gaat, en dan staat de weegschaal weken stil terwijl de
   centimeters wél bewegen. Eén getal zou dus het verkeerde verhaal vertellen. */
function metingVanDag(dag) {
  return (st.metingen && st.metingen[dag]) || null;
}

/* Alle metingen van één veld op een rij, als [datum, waarde] en op datum
   gesorteerd -- precies wat `trendPunten()` verwacht. Dagen waarop dat veld
   leeg bleef doen niet mee, en dat is de hele truc waarmee gewicht en
   buikomvang in dezelfde opslag kunnen zitten met een verschillend ritme. */
function reeksVan(veld) {
  const uit = [];
  for (const d of Object.keys(st.metingen || {}).sort()) {
    const v = st.metingen[d] ? st.metingen[d][veld] : null;
    if (v != null) uit.push([d, v]);
  }
  return uit;
}

/* Zeven dagen, eindigend op `tot`: het gemiddelde gewicht en de buikomvang die
   in dat venster gemeten is.

   Dit is waar dagelijks wegen voor is. Eén ochtend zegt weinig -- zout, een
   avond laat eten en een slechte nacht doen er elk een halve kilo bij of af --
   maar het gemiddelde van zeven ochtenden zegt wel iets, en twee van die
   gemiddelden naast elkaar nog meer. Vandaar dat het paneel niet het getal van
   vandaag vooropzet maar dit.

   Een rollend venster en geen kalenderweek: op een donderdag wil je de zeven
   dagen achter je hebben en niet drie. Van de buikomvang de laatste in het
   venster en geen gemiddelde -- die wordt één keer gemeten, niet zeven keer. */
function weekvenster(tot) {
  const van = plusDagen(tot, -6);
  let som = 0, aantal = 0, buik = null;
  for (const d of Object.keys(st.metingen || {}).sort()) {
    if (d < van || d > tot) continue;
    const m = st.metingen[d];
    if (m.gewicht != null) { som += m.gewicht; aantal++; }
    if (m.buik != null) buik = m.buik;
  }
  return { van, tot, aantal, buik,
           gewicht: aantal ? som / aantal : null };
}

function getal(v) {
  const n = parseFloat(String(v).replace(",", "."));
  return Number.isFinite(n) ? n : null;
}

/* Een getal zoals een Nederlander het schrijft: 0,4 en niet 0.4. */
function nl(n) { return String(Math.round(n * 10) / 10).replace('.', ','); }

function verschilTekst(nu, eerder, eenheid) {
  if (nu == null || eerder == null) return "";
  const d = Math.round((nu - eerder) * 10) / 10;
  if (d === 0) return " (gelijk)";
  return " (" + (d > 0 ? "+" : "\u2212") + nl(Math.abs(d)) + " " + eenheid + ")";
}

/* ---------- waar loopt dit op uit? ---------- */

/* Gert vroeg op 2 november 2026 wat er op 1 december en 1 januari zou staan als
   hij het schema volhoudt. Dat is precies de vraag waar een losse maandag geen
   antwoord op geeft en zijn eigen reeks wel -- dus rekent de app het voor in
   plaats van dat iemand er een getal bij verzint.

   Vier keuzes zitten erin, en ze zijn er alle vier omdat het zonder hen een
   verkeerd verhaal vertelt:

   - **Een kleinste-kwadratenlijn door alle metingen**, niet de eerste tegen de
     laatste. Anders bepaalt een rare maandag de hele verwachting, en bij
     buikomvang is een rare maandag normaal: alleen de ademhaling scheelt al
     twee centimeter.
   - **Onder MEETRUIS heet het "staat stil"** en wordt er niets doorgetrokken.
     Een halve kilo over drie weken is geen richting, en een lijn door ruis
     leest als een belofte.
   - **De snelheid wordt afgetopt op MAX_PER_WEEK.** De eerste weken gaan altijd
     het hardst -- dat is vocht en glycogeen, geen vet -- en zonder die rem
     staat er na drie weken dat hij in januari op 89 kilo zit. Een procent van
     je lichaamsgewicht per week is wat er aan vet af kan.
   - **Gewicht en omvang krijgen elk hun eigen lijn.** Bij krachttraining komt er
     spier bij terwijl er vet af gaat; dan staat de weegschaal stil terwijl de
     centimeters wel bewegen. Dat ze elkaar tegenspreken is geen fout maar de
     hele reden dat er twee getallen staan.

   Minder dan drie metingen levert geen lijn op: met twee punten is elke lijn
   precies passend en dus nergens op gebaseerd. En minder dan MIN_REEKS_DAGEN
   aan reeks ook niet -- zie `trendVan()`. */
/* Gewicht ging op 4 november 2026 van 0,6 naar 0,3 kg, toen Gert elke dag ging
   wegen. Die 0,6 hoorde bij één meting per week: dan is een halve kilo over de
   hele reeks net zo goed de ademhaling van drie maandagen als een richting.
   Met zeven ochtenden per week vallen die uitschieters tegen elkaar weg en is
   een derde kilo wél iets -- en dat is precies wat je van dagelijks wegen
   terugkrijgt. De centimeters blijven op 1,0: die worden nog steeds één keer
   per week gemeten, en daar is een meetlint ook ruiziger in. */
const MEETRUIS = { gewicht: 0.3, buik: 1.0 };
const MAX_PER_WEEK = { gewicht: 1.0, buik: 1.0 };
const VELDNAAM = { gewicht: 'gewicht', buik: 'omvang' };
const EENHEID = { gewicht: 'kg', buik: 'cm' };

function dagenTussen(a, b) { return Math.round((alsDatum(b) - alsDatum(a)) / 86400000); }

/* Hoe lang een reeks moet lopen voordat er een lijn door mag. Veertien dagen,
   en dat getal verandert niets aan wat er tot 4 november 2026 gebeurde: drie
   weekmetingen zijn maandag, maandag, maandag en dus precies veertien dagen.

   Het moest er wél bij toen het wegen dagelijks werd. `trendPunten()` kijkt
   naar het áántal punten (drie), en dat was een goede maat zolang drie punten
   drie weken betekenden. Nu zijn drie punten drie dagen, en een
   kleinste-kwadratenlijn door woensdag, donderdag en vrijdag rekent vrolijk
   uit wat er op 1 januari staat. Dat is geen verwachting maar een grap met
   twee cijfers achter de komma. */
const MIN_REEKS_DAGEN = 14;

function trendVan(veld) {
  const punten = reeksVan(veld);
  if (punten.length && dagenTussen(punten[0][0], punten[punten.length - 1][0])
      < MIN_REEKS_DAGEN) return null;
  return trendPunten(punten, MEETRUIS[veld], MAX_PER_WEEK[veld]);
}

/* De rekensom zelf, los van waar de punten vandaan komen -- het looppaneel
   gebruikt hem ook, met zijn eigen ruis en zijn eigen plafond. `punten` is een
   lijst [datumsleutel, waarde], op datum gesorteerd. */
function trendPunten(punten, ruis, maxPerWeek) {
  if (punten.length < 3) return null;

  const nul = punten[0][0];
  const n = punten.length;
  let sx = 0, sy = 0, sxx = 0, sxy = 0;
  for (const [w, y] of punten) {
    const x = dagenTussen(nul, w);
    sx += x; sy += y; sxx += x * x; sxy += x * y;
  }
  const noemer = n * sxx - sx * sx;
  if (!noemer) return null;

  const ruw = (n * sxy - sx * sy) / noemer;        // eenheid per dag
  const begin = (sy - ruw * sx) / n;
  const laatste = punten[n - 1][0];
  const span = dagenTussen(nul, laatste);

  /* De lijn op de dag van de laatste meting is het beginpunt, en niet die
     meting zelf: anders trekt de app een lijn vanaf precies het punt waar de
     ademhaling van afgelopen maandag in zit. */
  const basis = begin + ruw * span;
  const stil = Math.abs(ruw * span) < ruis;
  const grens = maxPerWeek / 7;
  const afgetopt = !stil && Math.abs(ruw) > grens;
  const perDag = stil ? 0 : (afgetopt ? Math.sign(ruw) * grens : ruw);

  /* `dagen` is hoe lang de reeks loopt, en dat is sinds het dagelijks wegen
     (4 november 2026) de maat die telt in plaats van `aantal`: zeven metingen
     kunnen één week zijn of zeven weken, en voor een verwachting is dat het
     verschil tussen iets en niets. */
  return { aantal: n, dagen: span, stil, afgetopt, perDag, basis, vanaf: laatste,
           perWeek: perDag * 7,
           /* Waar deze lijn op een gegeven dag staat. */
           op: (datum) => basis + perDag * dagenTussen(laatste, datum) };
}

/* De eerstvolgende eerste van de maand die ver genoeg weg ligt, en de maand
   daarna. Te dichtbij heeft geen zin: op 28 december is "1 januari" geen
   verwachting meer maar bijna de meting van volgende week. Tien dagen is de
   grens -- met 21 sloeg hij op 16 november 1 december over en begon hij bij
   januari, precies de maand waar je dan niet naar kijkt.

   Hoeveel datums je krijgt hangt af van hoeveel metingen eronder liggen: met
   drie weken reeks mag je niet drie maanden vooruit rekenen. */
function verwachtingDatums(vanaf, hoeveel) {
  const uit = [];
  const d = alsDatum(vanaf);
  d.setDate(1);
  for (let i = 0; i < 6 && uit.length < hoeveel; i++) {
    d.setMonth(d.getMonth() + 1);
    const s = sleutelVan(d);
    if (dagenTussen(vanaf, s) >= 10) uit.push(s);
  }
  return uit;
}

function tekenVerwachting() {
  const t = { gewicht: trendVan('gewicht'), buik: trendVan('buik') };
  const velden = ['gewicht', 'buik'].filter(v => t[v]);
  if (!velden.length) return null;

  const vak = el('div', { class: 'verwachting' });
  vak.appendChild(el('div', { class: 'kopje', tekst: 'Als deze reeks doorzet' }));

  if (velden.every(v => t[v].stil)) {
    vak.appendChild(el('div', {
      tekst: velden.map(v => VELDNAAM[v]).join(' en ')
             + (velden.length > 1 ? ' staan stil' : ' staat stil') }));
  } else {
    vak.appendChild(el('div', { tekst: velden.map(v => t[v].stil
      ? VELDNAAM[v] + ' staat stil'
      : (t[v].perWeek > 0 ? '+' : '\u2212') + nl(Math.abs(t[v].perWeek)) + ' ' + EENHEID[v]
    ).join(' en ') + ' per week' }));
  }

  /* Pas bij vier weken reeks de tweede maand erbij. Drie weken is genoeg voor
     een richting en te weinig voor een kwartaal.

     Dat stond tot 4 november 2026 op "vijf metingen", en dat was hetzelfde
     bedoeld: vijf keer maandag is een maand. Sinds het dagelijks wegen is vijf
     metingen vijf dagen, dus staat er nu waar het altijd om ging -- de lengte
     van de reeks. De buikomvang houdt hem meestal tegen, en dat hoort: die
     wordt één keer per week gemeten en is dus het traagste van de twee. */
  const minst = Math.min.apply(null, velden.map(v => t[v].dagen));
  for (const datum of verwachtingDatums(vandaag(), minst >= 28 ? 2 : 1)) {
    const delen = velden.map(v => nl(t[v].op(datum)) + ' ' + EENHEID[v]);
    vak.appendChild(el('div', {}, [
      el('span', { tekst: korteDatum(datum) + ' \u00b7 ' }),
      el('b', { tekst: delen.join(' \u00b7 ') }),
    ]));
  }

  /* Wat de getallen hierboven niet kunnen zeggen, staat eronder. Een
     verwachting zonder die twee regels leest als een toezegging. */
  if (minst < 28) {
    vak.appendChild(el('div', { class: 'kant',
      tekst: 'Deze reeks loopt nog maar ' + minst + ' dagen: dat is een '
             + 'richting, geen voorspelling. Na een maand of twee zegt deze '
             + 'lijn pas iets.' }));
  }
  const doelen = velden.map(v => ambitieRegel(v, t[v])).filter(Boolean);
  if (doelen.length) {
    vak.appendChild(el('div', { class: 'ambitie' },
      doelen.map(r => el('div', { tekst: r }))));
  }

  if (velden.some(v => t[v].afgetopt)) {
    vak.appendChild(el('div', { class: 'kant',
      tekst: 'Afgetopt op een kilo en een centimeter per week. Je begin gaat '
             + 'altijd het hardst, en dat is vooral vocht \u2014 doortrekken zou '
             + 'een getal geven dat niet kan.' }));
  }
  return vak;
}

function tekenMeting() {
  const nu = vandaag();
  const maandag = maandagVan(nu);
  const vandaagGemeten = metingVanDag(nu);
  const gewogen = !!(vandaagGemeten && vandaagGemeten.gewicht != null);
  const reeks = reeksVan('gewicht');
  const vorigeKeer = reeks.filter(p => p[0] < nu).slice(-1)[0] || null;
  const deze = weekvenster(nu);
  const ervoor = weekvenster(plusDagen(nu, -7));

  /* Het meetlint hoeft er niet elke ochtend bij: één keer per week is genoeg en
     vaker meet vooral je ademhaling. Het veld staat er dus zolang deze week --
     vanaf maandag -- nog geen centimeters heeft. En ook nog als je ze vandaag
     net hebt ingevuld, want anders kun je een typefout niet meer herstellen. */
  let buikDeze = null;
  for (const p of reeksVan('buik')) if (p[0] >= maandag) buikDeze = p;
  const buikVeld = !buikDeze || buikDeze[0] === nu;

  /* Wanneer staat dit paneel er?
     - Is er vandaag nog niet gewogen, dan altijd: dat is het duwtje. Hetzelfde
       zolang het meetlint deze week nog moet komen.
     - "Gedaan" kijkt naar of de centimeters er déze week staan, en niet naar
       `buikVeld`. Dat veld blijft namelijk de hele maandag staan om een
       typefout te kunnen herstellen -- en op dat verschil stond het paneel een
       hele maandag in de invulstand, met de reeks eronder onzichtbaar.
     - Is alles gedaan, dan alleen als er iets terug te kijken valt. Je reeks is
       de hele opbrengst van meten, en zonder deze regel zag je hem juist niet
       op de dagen dat je je afvraagt of het wat oplevert.
     - Staat er alleen de meting van vandaag, dan is er niets te tonen en blijft
       het scherm kort. */
  const klaar = gewogen && !!buikDeze;
  if (klaar && !ui.metingOpen && reeks.length < 2) return null;

  const vak = el('div');

  if (klaar && !ui.metingOpen) {
    vak.appendChild(el('div', { class: 'regel' }, [
      el('span', { tekst: 'Vandaag: ' }),
      el('b', { tekst: nl(vandaagGemeten.gewicht) + ' kg' }),
      el('span', { tekst: verschilTekst(vandaagGemeten.gewicht,
                                        vorigeKeer && vorigeKeer[1], 'kg') }),
    ]));
    /* Het getal waar het eigenlijk om gaat staat eronder en niet erboven, want
       het is pas na een volle week iets. Onder drie weegmomenten in zeven dagen
       is "gemiddelde" een duur woord voor één ochtend, en dan laat de app het
       weg in plaats van het op te leuken. */
    if (deze.aantal >= 3) {
      vak.appendChild(el('div', { class: 'regel label' }, [
        el('span', { tekst: 'Zeven dagen: ' }),
        el('b', { tekst: nl(deze.gewicht) + ' kg' }),
        el('span', { tekst: verschilTekst(deze.gewicht,
                                          ervoor.aantal >= 3 ? ervoor.gewicht : null,
                                          'kg') }),
      ]));
    }
    if (buikDeze) {
      vak.appendChild(el('div', { class: 'regel label',
        tekst: 'Buikomvang deze week: ' + nl(buikDeze[1]) + ' cm' }));
    }
    vak.appendChild(el('button', {
      class: 'schakel', tekst: 'Aanpassen',
      onclick: () => { ui.metingOpen = true; tekenVandaag(); },
    }));
  } else {
    const rij = el('div', { class: 'meting' });
    const gew = el('input', { type: 'number', step: '0.1', inputmode: 'decimal',
                              placeholder: 'kg' });
    const bui = el('input', { type: 'number', step: '0.5', inputmode: 'decimal',
                              placeholder: 'cm' });
    if (vandaagGemeten) {
      if (vandaagGemeten.gewicht != null) gew.value = vandaagGemeten.gewicht;
      if (vandaagGemeten.buik != null) bui.value = vandaagGemeten.buik;
    }
    rij.appendChild(el('label', { tekst: 'Gewicht' }, [gew]));
    if (buikVeld) rij.appendChild(el('label', { tekst: 'Buikomvang' }, [bui]));
    rij.appendChild(el('button', {
      class: 'schakel', tekst: 'Bewaren',
      onclick: () => {
        const g = getal(gew.value), b = buikVeld ? getal(bui.value) : null;
        if (g == null && b == null) { zeg('Niets ingevuld'); return; }
        /* Wat er al voor vandaag stond blijft staan als dat veld er nu niet is.
           Zonder deze twee regels wiste het bewaren van je gewicht op maandag
           de centimeters van diezelfde maandag -- en dat merk je pas weken
           later, aan een gat in de lijn. */
        const was = vandaagGemeten || {};
        st.metingen[nu] = {
          gewicht: g != null ? g : (was.gewicht != null ? was.gewicht : null),
          buik: b != null ? b : (was.buik != null ? was.buik : null),
          op: nu,
        };
        ui.metingOpen = false;
        bewaar();
        tekenVandaag();
        zeg('Meting bewaard');
      },
    }));
    vak.appendChild(rij);

    /* De uitleg hoort bij het meetlint en staat er dus alleen als dat veld
       er is -- zes dagen per week hoef je hem niet te zien.

       Gert kreeg wisselende uitkomsten, en dat is bij buikomvang eerder regel
       dan uitzondering: ademhaling, tijdstip en de hoek van het lint doen er
       elk een centimeter of twee bij. Daarom staat de werkwijze hier, en niet
       in een LEESMIJ -- je staat met het lint in je handen, niet achter je
       laptop.

       De navel als ijkpunt staat er bewust níet in: die verschuift mee als je
       afvalt, en dan meet je elke maand een andere plek. Het midden tussen je
       onderste rib en je heupbot blijft staan waar het staat. */
    if (buikVeld) vak.appendChild(el('details', { class: 'uitlegvak' }, [
      el('summary', { tekst: 'Hoe meet ik dat goed?' }),
      el('div', { class: 'uitleg' }, [
        el('p', { tekst: 'Staand, op de huid, niet over je kleren. Liggend '
          + 'scheelt het zo een paar centimeter en zittend ook — dus altijd '
          + 'staand, anders vergelijk je twee verschillende dingen.' }),
        el('p', { tekst: 'Rechtop, voeten ongeveer heupbreedte uit elkaar, '
          + 'gewicht op allebei je voeten, armen los langs je lichaam. Buik '
          + 'ontspannen: niet intrekken en niet bol zetten.' }),
        el('p', { tekst: 'Het lint komt midden tussen je onderste rib en de '
          + 'bovenkant van je heupbot — meestal een paar centimeter boven je '
          + 'navel. Neem niet de navel zelf als ijkpunt: die zakt mee als je '
          + 'afvalt, en dan meet je elke maand een andere plek.' }),
        el('p', { tekst: 'Meet aan het eind van een gewone uitademing. Niet '
          + 'inhouden en niet je buik intrekken. Hier zit de grootste '
          + 'schommeling: inademen scheelt zo twee centimeter.' }),
        el('p', { tekst: 'Houd het lint horizontaal — ook op je rug, want daar '
          + 'zakt hij vanzelf. Strak genoeg om te blijven liggen, niet zo strak '
          + 'dat je huid inknijpt.' }),
        el('p', { tekst: 'Altijd \u2019s ochtends, vóór het ontbijt en na de wc. '
          + 'Eten en drinken schelen een centimeter of twee, en dat is precies '
          + 'de verandering waar je naar op zoek bent.' }),
        el('p', { tekst: 'Kijk niet omlaag terwijl je afleest — dan buig je je '
          + 'nek en borst en verandert je houding precies op dat moment. Leg '
          + 'het lint neer, kijk in de spiegel of hij achter net zo hoog zit '
          + 'als voor, en lees dan pas af.' }),
        el('p', { tekst: 'Meet twee keer. Schelen ze meer dan een centimeter, '
          + 'dan een derde keer, en noteer het midden.' }),
      ]),
    ]));

    if (vorigeKeer) {
      vak.appendChild(el('div', { class: 'label', style: 'margin-top:8px',
        tekst: 'Vorige keer: ' + nl(vorigeKeer[1]) + ' kg \u00b7 '
               + korteDatum(vorigeKeer[0]) }));
    }
  }

  /* De laatste weken eronder: daar zit de hele opbrengst van meten. Eén
     getal zegt niets, vier op een rij laten een richting zien.

     Elk van die vier is sinds 4 november 2026 het gemiddelde van zeven
     dagen en niet één ochtend. Vier ochtenden op een rij laten vooral zien
     dat een lichaam van dag tot dag een halve kilo schommelt, en dat is
     precies wat je hier niet zoekt. Staan er in een week minder dan drie
     weegmomenten, dan staat erbij hoeveel het waren -- in de weken van voor
     de weegschaal is dat er één, en dan hoort de lezer te weten dat dat
     getal geen gemiddelde is. */
  const vensters = [];
  const WEEKNAAM = ['deze week', 'vorige week', '2 weken terug', '3 weken terug'];
  for (let i = 0; i < WEEKNAAM.length; i++) {
    const w = weekvenster(plusDagen(nu, -7 * i));
    w.naam = WEEKNAAM[i];
    vensters.push(w);
  }
  /* Staat het gemiddelde van deze week hierboven al, dan hoeft diezelfde week
     niet ook nog als eerste rij: hetzelfde getal twee regels verderop leest als
     een fout. Dan begint de historie bij vorige week, en is één rij genoeg --
     want het getal om mee te vergelijken staat bovenaan. */
  const bovenaanAl = klaar && !ui.metingOpen && deze.aantal >= 3;
  const rijen = [];
  for (let i = 0; i < vensters.length; i++) {
    const w = vensters[i];
    if (i === 0 && bovenaanAl) continue;
    if (!w.aantal && w.buik == null) continue;
    /* Het verschil met het venster er direct voor, ook als dat leeg is --
       dan staat er niets achter in plaats van een sprong over twee weken. */
    const v = vensters[i + 1] || null;
    rijen.push(el('div', {}, [
      /* Het aantal weegmomenten hoort bij de week en niet achter het getal:
         "93,9 kg (-0,7 kg) (2 metingen)" zijn twee haakjes op een rij en dan
         leest niemand meer welk haakje waarover gaat. */
      el('span', { tekst: w.naam + (w.aantal && w.aantal < 3
        ? ' (' + w.aantal + (w.aantal === 1 ? ' meting' : ' metingen') + ')' : '')
        + ' \u00b7 ' }),
      el('b', { tekst: w.gewicht != null ? nl(w.gewicht) + ' kg' : '—' }),
      el('span', { tekst: verschilTekst(w.gewicht, v && v.gewicht, 'kg') }),
      el('span', { tekst: w.buik != null ? ' \u00b7 ' : '' }),
      el('b', { tekst: w.buik != null ? nl(w.buik) + ' cm' : '' }),
      el('span', { tekst: verschilTekst(w.buik, v && v.buik, 'cm') }),
    ]));
  }
  if (rijen.length > (bovenaanAl ? 0 : 1)) {
    vak.appendChild(el('div', { class: 'metinghistorie' }, rijen));
  }

  const vooruit = tekenVerwachting();
  if (vooruit) vak.appendChild(vooruit);

  /* Wat er nog te doen is, in de kop van het paneel. "vandaag gedaan" is
     sinds het dagelijks wegen ook echt vandaag en niet deze week. */
  /* Ook hier `buikDeze` en niet `buikVeld`: wat er nog te doen is hangt aan de
     week, en niet aan het veld dat op de dag zelf open blijft staan. */
  const onder = !gewogen ? (buikDeze ? 'wegen' : 'wegen en meten')
              : buikDeze ? 'vandaag gedaan' : 'meetlint nog';
  return paneel('Meten', onder, [vak]);
}

/* Het sportblok: twee uitslagenlijstjes en twee tabellen, dus het tekent
   zichzelf -- net als het weerblok. Geen berichten, geen links.

   Wie oplicht is `eigen`, en dat wordt in ophalen.py bepaald: bij de Formule 1
   een Nederlandse coureur, bij het voetbal de club uit `EIGEN_CLUB` (die staat
   leeg tot Gert zegt waar hij voor is). In een uitslagenlijst zoek je eerst de
   onze, en dan hoef je niet te lezen maar te kijken. */
/* Het sportblok in twee lagen: Voetbal en Formule 1, en daaronder Uitslagen en
 * Stand. Gert vroeg daar op 4 november 2026 om. Het was één rij kopjes --
 * "Eredivisie", "Stand", "Formule 1", "WK-stand" -- en dan staat de sport waar
 * iets over gaat nergens boven de stand die erbij hoort.
 *
 * De competitie en de race blijven staan, maar als toevoeging achter de sport:
 * "Voetbal  Eredivisie" en "Formule 1  Grand Prix van Brazilië". Dat is waar
 * ze thuishoren -- het zijn twee dingen over hetzelfde, en een kopje
 * "Uitslagen" zegt al wat eronder staat.
 */
function tekenSport(sp) {
  const vak = document.createElement('div');
  /* De groepskop. `later` zet een streep erboven; die wil je tussen de twee
     sporten en niet boven de eerste, want daar zit de knop van het blok al. */
  const groep = (naam, wat) => {
    const d = document.createElement('div');
    d.className = 'sportgroep' + (vak.children.length ? ' later' : '');
    d.append(document.createTextNode(naam));
    if (wat) {
      const w = document.createElement('span');
      w.className = 'wat';
      w.textContent = '\u00a0\u00a0' + wat;
      d.append(w);
    }
    vak.append(d);
  };
  /* Uitslagen en Stand klappen uit, sinds 4 november 2026 op Gerts verzoek.
     Dichtgeklapt is het blok een menuutje van vier regels in plaats van 47
     rijen -- de stand van de Eredivisie alleen is er al achttien.

     Dezelfde knop als de kopjes binnen een nieuwsblok (`.subkop`) en dezelfde
     opslag (`ui.kopOpen`), zodat het zich gedraagt zoals je het van de rest
     kent: dicht als je de briefing opent, en open zolang de app open blijft.
     `herteken` zet je na de klik weer op dezelfde hoogte, want anders spring je
     bij het openklappen van de stand terug naar de bovenkant van het scherm.

     `vullen` wordt alleen aangeroepen als het kopje open staat: dichtgeklapt
     hoeft die tabel niet gebouwd te worden. */
  const kopje = (naam, id, aantal, vullen) => {
    const sleutel = 'sport|' + id;
    const open = !!ui.kopOpen[sleutel];
    const knop = document.createElement('button');
    knop.type = 'button';
    knop.dataset.sleutel = 'kop:' + sleutel;
    knop.className = 'subkop' + (open ? ' open' : '');
    knop.innerHTML = '<span class="naam"></span><span class="aantal"></span>' +
                     '<span class="pijl">&#9656;</span>';
    knop.querySelector('.naam').textContent = naam;
    knop.querySelector('.aantal').textContent = aantal;
    knop.addEventListener('click', () => {
      ui.kopOpen[sleutel] = !ui.kopOpen[sleutel];
      herteken(tekenBriefing, 'kop:' + sleutel);
    });
    vak.append(knop);
    if (open) vullen();
  };
  const voet = (t) => {
    const d = document.createElement('div');
    d.className = 'sportvoet';
    d.textContent = t;
    vak.append(d);
  };

  const v = sp.voetbal || {};
  /* De groepskop alleen als er ook iets onder komt te staan. Een kale kop
     "Voetbal" zonder uitslag en zonder stand is erger dan geen kop. */
  if ((v.uitslagen || []).length || (v.stand || []).length) {
    groep('Voetbal', 'Eredivisie');
  }
  if ((v.uitslagen || []).length) {
    kopje('Uitslagen', 'voetbal-uitslagen', v.uitslagen.length, () => {
    for (const u of v.uitslagen) {
      const rij = document.createElement('div');
      rij.className = 'uitslag' + (u.eigen ? ' eigen' : '');
      rij.innerHTML =
        '<span class="thuis"></span><span class="score"></span>' +
        '<span class="gast"></span><span class="wanneer"></span>';
      rij.children[0].textContent = u.thuis;
      rij.children[1].textContent = u.score || '\u2014';
      rij.children[2].textContent = u.uit;
      rij.children[3].textContent = u.wanneer || '';
      if (u.bezig) {
        const b = document.createElement('span');
        b.className = 'bezig';
        b.textContent = ' \u00b7 ' + u.bezig;
        rij.children[3].append(b);
      }
      vak.append(rij);
    }
    });
  }

  if ((v.stand || []).length) {
    kopje('Stand', 'voetbal-stand', v.stand.length, () => {
    const t = document.createElement('table');
    t.className = 'stand';
    t.innerHTML = '<tr><th></th><th class="club">club</th><th>gesp</th>'
                + '<th>ptn</th><th>saldo</th></tr>';
    for (const r of v.stand) {
      const rij = document.createElement('tr');
      if (r.eigen) rij.className = 'eigen';
